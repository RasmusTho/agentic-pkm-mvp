[pytest]
addopts = -q --timeout=20 --timeout-method=thread
markers =
    integration: tests that require Postgres
    pg: store-contract tests that require Postgres backend
    not_pg: tests that must not touch Postgres or external deps
    alpha_llm: tests that exercise real LLM flows (Ollama/local); skipped in CI
    alpha_llm_live: live LLM + tracing integration (opt-in; may be skipped unless ALPHA_LLM_LIVE=1)
    eval: LLM/retrieval eval tests (DeepEval/Ragas); opt-in
    e2e: end-to-end Reality-MVP flows over the memory backend
pythonpath = .
