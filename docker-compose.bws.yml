# Linux BWS-only overlay. The managed lifecycle owns every start/recreate.
services:
  db:
    restart: 'no'
    environment:
      POSTGRES_USER: app
      POSTGRES_DB: ${BWS_DATABASE_NAME:?channel database name required}
      POSTGRES_PASSWORD: null
      PGPASSWORD: null
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      DATABASE_URL: null
      DB_DSN: null
    secrets:
      - postgres_password
    entrypoint:
      - /bin/bash
      - /usr/local/bin/yggdrasil-postgres-entrypoint.sh
    command: ["postgres"]
    volumes:
      - type: volume
        source: bws_pgdata
        target: /var/lib/postgresql/data
      - type: bind
        source: ./scripts/postgres_entrypoint.sh
        target: /usr/local/bin/yggdrasil-postgres-entrypoint.sh
        read_only: true
        bind:
          create_host_path: false
  instance-state-init:
    environment:
      POSTGRES_PASSWORD: null
      PGPASSWORD: null
      DATABASE_URL: null
      DB_DSN: null
  migrate:
    restart: 'no'
    environment:
      POSTGRES_PASSWORD: null
      PGPASSWORD: null
      DATABASE_PASSWORD_FILE: /run/secrets/postgres_password
      DATABASE_URL: ${DATABASE_URL:-${DB_DSN:-postgresql+psycopg://app@db:5432/${BWS_DATABASE_NAME:?channel database name required}}}
      DB_DSN: ${DATABASE_URL:-${DB_DSN:-postgresql+psycopg://app@db:5432/${BWS_DATABASE_NAME:?channel database name required}}}
    secrets:
      - postgres_password
  api:
    restart: 'no'
    environment:
      POSTGRES_PASSWORD: null
      PGPASSWORD: null
      DATABASE_PASSWORD_FILE: /run/secrets/postgres_password
      DATABASE_URL: ${DATABASE_URL:-${DB_DSN:-postgresql+psycopg://app@db:5432/${BWS_DATABASE_NAME:?channel database name required}}}
      DB_DSN: ${DATABASE_URL:-${DB_DSN:-postgresql+psycopg://app@db:5432/${BWS_DATABASE_NAME:?channel database name required}}}
    secrets:
      - postgres_password
  worker:
    restart: 'no'
    environment:
      POSTGRES_PASSWORD: null
      PGPASSWORD: null
      DATABASE_PASSWORD_FILE: /run/secrets/postgres_password
      DATABASE_URL: ${DATABASE_URL:-${DB_DSN:-postgresql+psycopg://app@db:5432/${BWS_DATABASE_NAME:?channel database name required}}}
      DB_DSN: ${DATABASE_URL:-${DB_DSN:-postgresql+psycopg://app@db:5432/${BWS_DATABASE_NAME:?channel database name required}}}
    secrets:
      - postgres_password
  watcher:
    restart: 'no'
    environment:
      POSTGRES_PASSWORD: null
      PGPASSWORD: null
      DATABASE_PASSWORD_FILE: /run/secrets/postgres_password
      DATABASE_URL: ${DATABASE_URL:-${DB_DSN:-postgresql+psycopg://app@db:5432/${BWS_DATABASE_NAME:?channel database name required}}}
      DB_DSN: ${DATABASE_URL:-${DB_DSN:-postgresql+psycopg://app@db:5432/${BWS_DATABASE_NAME:?channel database name required}}}
    secrets:
      - postgres_password
  heimdal-capture-watch:
    restart: 'no'
    environment:
      POSTGRES_PASSWORD: null
      PGPASSWORD: null
      DATABASE_PASSWORD_FILE: /run/secrets/postgres_password
      DATABASE_URL: ${DATABASE_URL:-${DB_DSN:-postgresql+psycopg://app@db:5432/${BWS_DATABASE_NAME:?channel database name required}}}
      DB_DSN: ${DATABASE_URL:-${DB_DSN:-postgresql+psycopg://app@db:5432/${BWS_DATABASE_NAME:?channel database name required}}}
    secrets:
      - postgres_password
secrets:
  postgres_password:
    file: ${BWS_POSTGRES_PASSWORD_SOURCE:?managed tmpfs source required}
volumes:
  bws_pgdata:
    external: true
    name: ${BWS_DATABASE_VOLUME:?verified existing channel data volume required}
