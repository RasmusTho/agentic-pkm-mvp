# Production overlay — makes the Postgres data volume external so
# `docker compose down` (even without -v) cannot destroy prod data.
# Usage: docker compose -f docker-compose.yaml -f docker-compose.prod.yml -p pkm-prod up -d
services:
  # Production uses the project-local Ollama service over the Compose network.
  # Do not publish 11434: the mac mini may also have a host Ollama listener,
  # and api/worker must not depend on host.docker.internal routing.
  ollama:
    ports: !override []

  api:
    environment:
      API_HEALTHCHECK_URL: http://host.docker.internal:18000/readyz
      PKM_ENVIRONMENT: prod
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://app:app@db:5432/app}
      DB_DSN: ${DB_DSN:-postgresql+psycopg://app:app@db:5432/app}
      OLLAMA_BASE_URL: http://ollama:11434
      # The screen-derivation stage refuses to send a raw frame to any
      # endpoint it cannot prove is host-local. This compose network's
      # `ollama` service is inside the host trust boundary, and this line
      # is the operator declaring exactly that (HEIM-12).
      HEIMDAL_SCREEN_VISION_HOST_LOCAL_HOSTS: ollama
    depends_on:
      ollama:
        condition: service_healthy

  worker:
    environment:
      PKM_ENVIRONMENT: prod
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://app:app@db:5432/app}
      DB_DSN: ${DB_DSN:-postgresql+psycopg://app:app@db:5432/app}
      OLLAMA_BASE_URL: http://ollama:11434
      # The screen-derivation stage refuses to send a raw frame to any
      # endpoint it cannot prove is host-local. This compose network's
      # `ollama` service is inside the host trust boundary, and this line
      # is the operator declaring exactly that (HEIM-12).
      HEIMDAL_SCREEN_VISION_HOST_LOCAL_HOSTS: ollama
    depends_on:
      ollama:
        condition: service_healthy

  watcher:
    environment:
      PKM_ENVIRONMENT: prod
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://app:app@db:5432/app}
      DB_DSN: ${DB_DSN:-postgresql+psycopg://app:app@db:5432/app}

  heimdal-capture-watch:
    environment:
      PKM_ENVIRONMENT: prod
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://app:app@db:5432/app}
      DB_DSN: ${DB_DSN:-postgresql+psycopg://app:app@db:5432/app}

  companion-ui:
    ports: !override
      - "${COMPANION_UI_BIND_HOST:-127.0.0.1}:8113:8113"
    environment:
      PKM_ENVIRONMENT: prod
      PORT: 8113
      COMPANION_API_BASE_URL: http://api:8000
      # Separate the container listener from the browser-facing host publish.
      # Missing/non-loopback declarations leave ordinary Companion health up
      # but keep the devUI gateway routes fail-closed.
      COMPANION_UI_BIND_HOST: ${COMPANION_UI_BIND_HOST:-}
      COMPANION_UI_SERVE_MODULE: companion_ui.workspace.serve_production_page

  db:
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
    volumes:
      - pgdata_prod:/var/lib/postgresql/data

volumes:
  pgdata_prod:
    external: true
    name: pkm-prod_pgdata
  # Protected from ordinary project teardown; provisioned idempotently by the
  # canonical prod startup/deploy wrappers before Compose evaluates `up`.
  instance-state:
    external: true
    name: pkm-prod_instance-state
