# Production overlay — makes the Postgres data volume external so
# `docker compose down` (even without -v) cannot destroy prod data.
# Usage: docker compose -f docker-compose.yaml -f docker-compose.prod.yml -p pkm-prod up -d
services:
  # Production uses the project-local Ollama service over the Compose network.
  # Do not publish 11434: the mac mini may also have a host Ollama listener,
  # and api/worker must not depend on host.docker.internal routing.
  ollama:
    ports: !override []

  migrate:
    environment:
      # Production migration authority is bound to this overlay rather than
      # the shared generated runtime.env file. Compose environment values win
      # over service env_file values, so stale cross-channel control values
      # cannot disable or accidentally activate this gate.
      PKM_ENVIRONMENT: prod
      # Keep the migration authority on the same effective production database
      # binding as the runtime services. The deploy pin/ambient shell may
      # intentionally select an approved production endpoint; otherwise this
      # falls back to the canonical Compose database.
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://app:app@db:5432/app}
      DB_DSN: ${DB_DSN:-postgresql+psycopg://app:app@db:5432/app}
      MIGRATION_PRODUCTION_GATE: "1"
      MIGRATION_TARGET_IDENTITY: pkm-prod/app
      PROD_MIGRATION_FORWARD_ONLY_ACK: ${PROD_MIGRATION_FORWARD_ONLY_ACK:-}
      # Ordinary production startup is always full migration mode. The deploy
      # wrapper passes the private token-only selector explicitly on its
      # read-only pre-cutover `compose run`; no ambient host variable can
      # change this service's normal startup mode.
      MIGRATION_GATE_TOKEN_ONLY: "0"

  api:
    environment:
      API_HEALTHCHECK_URL: http://host.docker.internal:18000/readyz
      PKM_ENVIRONMENT: prod
      MIGRATION_GATE_TOKEN_ONLY: "0"
      COCKPIT_GITHUB_REPO: RasmusTho/agentic-pkm-mvp
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://app:app@db:5432/app}
      DB_DSN: ${DB_DSN:-postgresql+psycopg://app:app@db:5432/app}
      OLLAMA_BASE_URL: http://ollama:11434
      # The screen-derivation stage refuses to send a raw frame to any
      # endpoint it cannot prove is host-local. This compose network's
      # `ollama` service is inside the host trust boundary, and this line
      # is the operator declaring exactly that (HEIM-12).
      HEIMDAL_SCREEN_VISION_HOST_LOCAL_HOSTS: ollama
    depends_on:
      ollama:
        condition: service_healthy

  worker:
    environment:
      PKM_ENVIRONMENT: prod
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://app:app@db:5432/app}
      DB_DSN: ${DB_DSN:-postgresql+psycopg://app:app@db:5432/app}
      OLLAMA_BASE_URL: http://ollama:11434
      # The screen-derivation stage refuses to send a raw frame to any
      # endpoint it cannot prove is host-local. This compose network's
      # `ollama` service is inside the host trust boundary, and this line
      # is the operator declaring exactly that (HEIM-12).
      HEIMDAL_SCREEN_VISION_HOST_LOCAL_HOSTS: ollama
    depends_on:
      ollama:
        condition: service_healthy

  watcher:
    environment:
      PKM_ENVIRONMENT: prod
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://app:app@db:5432/app}
      DB_DSN: ${DB_DSN:-postgresql+psycopg://app:app@db:5432/app}

  heimdal-capture-watch:
    environment:
      PKM_ENVIRONMENT: prod
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://app:app@db:5432/app}
      DB_DSN: ${DB_DSN:-postgresql+psycopg://app:app@db:5432/app}

  companion-ui:
    ports: !override
      # Production is intentionally loopback-only. Keep the browser-facing
      # publish and the declaration consumed by the process as one fixed
      # producer pair; an ambient shell value must not widen or disable it.
      - "127.0.0.1:8113:8113"
    environment:
      PKM_ENVIRONMENT: prod
      PORT: 8113
      COMPANION_API_BASE_URL: http://api:8000
      # Separate the container listener from the browser-facing host publish.
      # Noncanonical/direct process launches still fail closed in the runtime,
      # while this canonical production producer always supplies the exact
      # declaration matching the host publish above.
      COMPANION_UI_BIND_HOST: 127.0.0.1
      COMPANION_UI_SERVE_MODULE: companion_ui.workspace.serve_production_page

  db:
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
    volumes:
      - pgdata_prod:/var/lib/postgresql/data

volumes:
  pgdata_prod:
    external: true
    name: pkm-prod_pgdata
  # Protected from ordinary project teardown; provisioned idempotently by the
  # canonical prod startup/deploy wrappers before Compose evaluates `up`.
  instance-state:
    external: true
    name: pkm-prod_instance-state
