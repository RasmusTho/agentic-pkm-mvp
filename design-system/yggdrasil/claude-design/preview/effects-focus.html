<!DOCTYPE html>
<!-- @dsCard group="Components" name="Focus ring and state-only effects" subtitle="data-focus=v2 ring · .fx-glow-* only on the live or working element" viewport="700x230" -->
<html lang="en" data-focus="v2">
<head><meta charset="UTF-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
body { background: var(--bg-surface); padding: 20px 24px; }
.meta { font-family: var(--font-mono); font-size: 10px; color: var(--fg-2); letter-spacing: 0.12em; text-transform: uppercase; margin: 16px 0 10px; }
.meta:first-child { margin-top: 0; }
.row { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
.btn { height: var(--control-height); padding: 0 16px; font-family: var(--font-ui); font-size: 13px; font-weight: 500; background: transparent; color: var(--fg-1); border: 1px solid var(--border-strong); border-radius: var(--radius-sm); }
.sim-focus { outline: 2px solid var(--border-focus); outline-offset: 2px; box-shadow: none; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-family: var(--font-mono); font-size: 11px; color: var(--fg-2); background: var(--bg-raised); border: 1px solid var(--border-strong); border-radius: var(--radius-sm); padding: 4px 9px; }
.dot { width: 6px; height: 6px; border-radius: 50%; }
.live { color: var(--cyan); border-color: var(--cyan-dim); }
.working { color: var(--agent); border-color: var(--agent-dim); }
.note { font-size: 12px; color: var(--fg-2); margin-top: 10px; }
</style>
</head>
<body>
  <div class="meta">Focus · data-focus="v2"</div>
  <div class="row">
    <button class="btn">Resting</button>
    <button class="btn sim-focus">Focus-visible</button>
  </div>
  <div class="meta">Glow marks state, not style</div>
  <div class="row">
    <span class="chip"><span class="dot" style="background:var(--fg-2)"></span>Idle source</span>
    <span class="chip live fx-glow-cyan"><span class="dot" style="background:var(--cyan)"></span>Live connection</span>
    <span class="chip working fx-glow-agent"><span class="dot" style="background:var(--agent)"></span>Hugin working</span>
    <span class="chip"><span class="dot" style="background:var(--vault)"></span>Indexed</span>
  </div>
  <div class="note">Only the live and working elements glow. Resting content, panels, and body text never do.</div>
</body>
</html>
