<!DOCTYPE html>
<!-- @dsCard group="Colors" name="Foreground colors" subtitle="fg-1 · fg-2 · fg-3 — cool blue-white scale · fg-3 disabled only" viewport="700x205" -->
<html lang="en">
<head><meta charset="UTF-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
body { background: var(--bg-surface); padding: 20px; }
.row { display: flex; align-items: center; gap: 16px; margin-bottom: 14px; }
.block { width: 40px; height: 40px; border-radius: var(--radius-md); border: 1px solid var(--border-strong); flex-shrink: 0; }
.info { display: flex; flex-direction: column; gap: 2px; }
.name { font-family: var(--font-mono); font-size: 11px; color: var(--fg-2); }
.hex  { font-family: var(--font-mono); font-size: 10px; color: var(--fg-3); }
.sample { font-family: var(--font-ui); font-size: 13px; }
</style>
</head>
<body>
  <div class="row"><div class="block" style="background:#dce8f0;"></div><div class="info"><div class="name">--fg-1</div><div class="hex">#dce8f0</div></div><span class="sample" style="color:#dce8f0">Primary text — cool blue-white</span></div>
  <div class="row"><div class="block" style="background:#7a9ab8;"></div><div class="info"><div class="name">--fg-2</div><div class="hex">#7a9ab8</div></div><span class="sample" style="color:#7a9ab8">Secondary — labels, metadata, captions, timestamps</span></div>
  <div class="row"><div class="block" style="background:#3d5570;"></div><div class="info"><div class="name">--fg-3</div><div class="hex">#3d5570</div></div><span class="sample" style="color:#3d5570">Dim — disabled and decorative only, never readable text</span></div>
</body>
</html>
