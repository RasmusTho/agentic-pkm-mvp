[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mimer-mcp-sidecar"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["mcp>=1.29,<2", "httpx>=0.27,<1"]

[project.scripts]
mimer-mcp = "mimer_mcp_sidecar.transport:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["mimer_mcp_sidecar*"]
