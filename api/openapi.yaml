---
openapi: 3.1.0
info:
  title: Agentic PKM API
  version: 0.1.0
  description: >-
    Partial legacy snapshot covering only the ingest and search routes. This file is not the
    published client-surface contract and must not be read as complete API coverage. See
    docs/contracts/MIMER_CLIENT_CONTRACT.md sections 4 and 9 (F4) for the current callable-surface
    pointers and the separately governed API-versioning and OpenAPI follow-up.
paths:
  /ingest:
    post:
      summary: Ingest a knowledge object
      parameters:
        - in: header
          name: x-trace-id
          required: false
          schema: {type: string}
          description: Optional trace correlation id, echoed back by server
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '202':
          description: Accepted
  /search:
    get:
      summary: Hybrid search
      parameters:
        - in: header
          name: x-trace-id
          required: false
          schema: {type: string}
          description: Optional trace correlation id, echoed back by server
      responses:
        '200':
          description: Results
