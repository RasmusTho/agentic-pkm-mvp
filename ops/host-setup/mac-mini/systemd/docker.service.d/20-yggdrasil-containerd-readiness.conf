[Unit]
Requires=containerd.service
After=containerd.service yggdrasil-colima-persistent-substrate.service
StartLimitIntervalSec=300s
StartLimitBurst=1

[Service]
EnvironmentFile=/etc/yggdrasil/colima-runtime.env
Sockets=docker.socket
ExecStartPre=/usr/local/libexec/yggdrasil-colima-runtime-readiness --docker-api-close
ExecStartPre=/usr/local/libexec/yggdrasil-colima-runtime-readiness --docker-preflight
TimeoutStartSec=900s
Restart=no

ExecStartPost=/usr/local/libexec/yggdrasil-colima-runtime-readiness --post-start
ExecStopPost=/usr/local/libexec/yggdrasil-colima-runtime-readiness --docker-api-cleanup
