# Golden metrics baselines for Quality Wave acceptance tests
# Used by Phase C/D/E to validate stability across parameter changes

version: 1.0
description: "Quality Wave v5.6 baseline metrics for golden vault"
golden_vault_path: "docs/examples/vault_test_seed/"
created_date: "2025-03-28"

# Phase B: Golden Vault Baselines
golden_vault:
  total_notes: 5
  total_objects: 5
  total_embeddings: 5
  total_relations: 2

# Phase C: Metamorphic Run Baselines
metamorphic_runs:
  ingest_interval_variations:
    - interval: 1
      expected_objects: 5
      expected_embeddings: 5
    - interval: 10
      expected_objects: 5
      expected_embeddings: 5
    - interval: 30
      expected_objects: 5
      expected_embeddings: 5

  watcher_tick_variations:
    - max_ticks: 5
      expected_objects: 5
      expected_embeddings: 5
    - max_ticks: 20
      expected_objects: 5
      expected_embeddings: 5

  store_backend_variations:
    - backend: memory
      expected_objects: 5
      expected_embeddings: 5
    - backend: postgres
      expected_objects: 5
      expected_embeddings: 5

# Phase D: Cold Rebuild Baselines
cold_rebuild:
  expected_object_count: 5
  expected_embedding_count: 5
  lossless: true
  idempotent: true

# Phase E: Fitness Gates Baselines
fitness_gates:
  minimum_ingest_runs: 1
  minimum_panel_runs: 0
  minimum_promote_intents: 0
  minimum_objects: 5
  minimum_embeddings: 5
  event_dedup_strict: true
  idempotent_operations: true

# Phase F: UAT Harness Baselines
uat_harness:
  vault_load_required: true
  min_objects_to_ingest: 5
  min_embeddings_to_create: 5
  min_ask_queries_successful: 1
  watcher_health_required: true
  worker_health_required: true
  ask_api_health_required: true
  idempotency_required: true

# Tolerance thresholds for CI gates
tolerances:
  object_count_variance_percent: 0
  embedding_count_variance_percent: 0
  timing_variance_percent: 10
  max_duplicate_events_allowed: 0
