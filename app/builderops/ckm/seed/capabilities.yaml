capabilities:
  - id: human-authority-kernel
    name: Human Authority Kernel
    definition: Owns what must stay trustworthy independent of any machine — human knowledge, who it concerns, where it came from, who may act on it, and the proof that they did. See seed_source for the canonical scope.
    parent: null
    boundary_ref: null
    seed_source: "docs/SYSTEM_BREAKDOWN_STRUCTURE.md :: Level 1 macro-domains"
  - id: cognitive-context-topology
    name: Cognitive Context & Topology
    definition: Tracks where the system's attention currently sits and how that state stays coherent as it deploys, replicates, and moves. See seed_source for the canonical scope.
    parent: null
    boundary_ref: null
    seed_source: "docs/SYSTEM_BREAKDOWN_STRUCTURE.md :: Level 1 macro-domains"
  - id: human-experience
    name: Human Experience
    definition: The surfaces through which a person states intent, reviews the system's output, and steers or explains its behavior. See seed_source for the canonical scope.
    parent: null
    boundary_ref: null
    seed_source: "docs/SYSTEM_BREAKDOWN_STRUCTURE.md :: Level 1 macro-domains"
  - id: external-boundary
    name: External Boundary
    definition: Everything the system talks to outside itself, and the trust line drawn at that edge. See seed_source for the canonical scope.
    parent: null
    boundary_ref: null
    seed_source: "docs/SYSTEM_BREAKDOWN_STRUCTURE.md :: Level 1 macro-domains"
  - id: machine-substrate
    name: Machine Substrate
    definition: The rebuildable machine-side layer that stores and derives from human-owned knowledge, as distinct from that knowledge itself. See seed_source for the canonical scope.
    parent: null
    boundary_ref: null
    seed_source: "docs/SYSTEM_BREAKDOWN_STRUCTURE.md :: Level 1 macro-domains"
  - id: cognitive-augmentation
    name: Cognitive Augmentation
    definition: Finds, remembers, and acts on a human's behalf — search, recall, learning, and agent workflows built on the substrate. See seed_source for the canonical scope.
    parent: null
    boundary_ref: null
    seed_source: "docs/SYSTEM_BREAKDOWN_STRUCTURE.md :: Level 1 macro-domains"
  - id: governed-execution
    name: Governed Execution
    definition: Where authorized intent becomes a real side effect, gated on prior approval and paired with preview/undo. See seed_source for the canonical scope.
    parent: null
    boundary_ref: null
    seed_source: "docs/SYSTEM_BREAKDOWN_STRUCTURE.md :: Level 1 macro-domains"
  - id: trust-fitness-evolution
    name: Trust, Fitness & Evolution
    definition: Keeps the system honest over time — visibility into what it is doing and whether its own architecture still holds up. See seed_source for the canonical scope.
    parent: null
    boundary_ref: null
    seed_source: "docs/SYSTEM_BREAKDOWN_STRUCTURE.md :: Level 1 macro-domains"
  - id: hix
    name: Human Interaction & Intent
    definition: Human Experience's concrete surface set, where a person captures intent and reviews, corrects, or gets an explanation. See seed_source for the canonical scope.
    parent: human-experience
    boundary_ref: HIX
    seed_source: "docs/SYSTEM_BREAKDOWN_STRUCTURE.md :: Level 2 control-boundary subsystems"
  - id: wsp
    name: Workspace, Scope & Principal Context
    definition: Models "where attention currently is" as an explicit, governed binding rather than one implicit global setting. See seed_source for the canonical scope.
    parent: cognitive-context-topology
    boundary_ref: WSP
    seed_source: "docs/SYSTEM_BREAKDOWN_STRUCTURE.md :: Level 2 control-boundary subsystems"
  - id: hka
    name: Human Knowledge & Artifact Substrate
    definition: The store of record for material a human wrote or explicitly accepted, kept intact even if derived state is lost. See seed_source for the canonical scope.
    parent: human-authority-kernel
    boundary_ref: HKA
    seed_source: "docs/SYSTEM_BREAKDOWN_STRUCTURE.md :: Level 2 control-boundary subsystems"
  - id: sip
    name: Semantic Identity & Provenance
    definition: The rebuildable graph answering "what is this and where did it come from" — identity, lineage, and attribution. See seed_source for the canonical scope.
    parent: human-authority-kernel
    boundary_ref: SIP
    seed_source: "docs/SYSTEM_BREAKDOWN_STRUCTURE.md :: Level 2 control-boundary subsystems"
  - id: gov
    name: Governance, Policy, Authority & Receipts
    definition: The authority layer — who may approve what, and the receipt trail proving it happened. See seed_source for the canonical scope.
    parent: human-authority-kernel
    boundary_ref: GOV
    seed_source: "docs/SYSTEM_BREAKDOWN_STRUCTURE.md :: Level 2 control-boundary subsystems"
  - id: ebf
    name: External Boundary Fabric
    definition: The adapter layer at the system's outer edge, through which every source, tool, model, and egress path passes. See seed_source for the canonical scope.
    parent: external-boundary
    boundary_ref: EBF
    seed_source: "docs/SYSTEM_BREAKDOWN_STRUCTURE.md :: Level 2 control-boundary subsystems"
  - id: pdm
    name: Persistence & Data Management
    definition: How data is physically stored, migrated, backed up, and restored, independent of the storage technology chosen. See seed_source for the canonical scope.
    parent: machine-substrate
    boundary_ref: PDM
    seed_source: "docs/SYSTEM_BREAKDOWN_STRUCTURE.md :: Level 2 control-boundary subsystems"
  - id: dri
    name: Derived Representation & Indexing
    definition: Everything derived from durable data that can be discarded and recomputed on demand. See seed_source for the canonical scope.
    parent: machine-substrate
    boundary_ref: DRI
    seed_source: "docs/SYSTEM_BREAKDOWN_STRUCTURE.md :: Level 2 control-boundary subsystems"
  - id: rca
    name: Retrieval & Context Assembly
    definition: Turns a moment's need into ranked, cited evidence and an assembled context bundle. See seed_source for the canonical scope.
    parent: cognitive-augmentation
    boundary_ref: RCA
    seed_source: "docs/SYSTEM_BREAKDOWN_STRUCTURE.md :: Level 2 control-boundary subsystems"
  - id: mem
    name: Machine Memory & Learning
    definition: The reviewable memory layer — what gets promoted, recalled, corrected, decayed, or forgotten, and why. See seed_source for the canonical scope.
    parent: cognitive-augmentation
    boundary_ref: MEM
    seed_source: "docs/SYSTEM_BREAKDOWN_STRUCTURE.md :: Level 2 control-boundary subsystems"
  - id: cao
    name: Cognitive Capability & Agent Orchestration
    definition: Composable cognition and agent behavior that proposes and plans without itself causing a side effect. See seed_source for the canonical scope.
    parent: cognitive-augmentation
    boundary_ref: CAO
    seed_source: "docs/SYSTEM_BREAKDOWN_STRUCTURE.md :: Level 2 control-boundary subsystems"
  - id: exe
    name: Capability Execution & Automation
    definition: Where an authorized proposal actually executes, with preview and rollback as first-class parts of the boundary. See seed_source for the canonical scope.
    parent: governed-execution
    boundary_ref: EXE
    seed_source: "docs/SYSTEM_BREAKDOWN_STRUCTURE.md :: Level 2 control-boundary subsystems"
  - id: sfc
    name: Synchronization, Federation & Consensus
    definition: Keeps multiple nodes or replicas of the system in agreement — ordering, conflict resolution, and convergence. See seed_source for the canonical scope.
    parent: cognitive-context-topology
    boundary_ref: SFC
    seed_source: "docs/SYSTEM_BREAKDOWN_STRUCTURE.md :: Level 2 control-boundary subsystems"
  - id: oef
    name: Observability, Evaluation & Fitness
    definition: The feedback loop on the system itself — traces, metrics, evaluation, and whether the architecture is still fit for purpose. See seed_source for the canonical scope.
    parent: trust-fitness-evolution
    boundary_ref: OEF
    seed_source: "docs/SYSTEM_BREAKDOWN_STRUCTURE.md :: Level 2 control-boundary subsystems"
  - id: retrieval
    name: Retrieval
    definition: Finds candidate artifacts or projections relevant to a query or context with explicit provenance.
    parent: rca
    boundary_ref: RCA
    seed_source: "docs/FINDING_AND_REORIENTING/README.md :: The cognitive-prosthetic framing"
  - id: orientation
    name: Orientation
    definition: Returns a situational frame for where the human is and what they were doing without a query term.
    parent: cao
    boundary_ref: CAO
    seed_source: "docs/FINDING_AND_REORIENTING/README.md :: The cognitive-prosthetic framing"
  - id: resurfacing
    name: Resurfacing
    definition: Returns why-now candidates for material that plausibly needs attention without an explicit query.
    parent: cao
    boundary_ref: CAO
    seed_source: "docs/FINDING_AND_REORIENTING/README.md :: The cognitive-prosthetic framing"
  - id: context-building
    name: Context building
    definition: Assembles an inspectable context bundle from retrieval, orientation, resurfacing, provenance, receipts, and write guards.
    parent: rca
    boundary_ref: RCA
    seed_source: "docs/CONTEXT_BUNDLES/README.md :: Context Bundles"
  - id: citation-checking
    name: Citation checking
    definition: Validates outbound references against durable surfaces and runtime projections without rewriting outputs.
    parent: oef
    boundary_ref: OEF
    seed_source: "docs/COMPONENTS.md :: CitationChecker"
  - id: memory-candidate-extraction
    name: Memory candidate extraction
    definition: Proposes provenance-bearing candidates for agent memory or long-lived recall from a session, run, or artifact.
    parent: mem
    boundary_ref: MEM
    seed_source: "docs/CONCEPTS/AGENT_MEMORY_AND_KNOWLEDGE_CONTRACT.md :: What agent memory is"
  - id: note-patch-proposal
    name: Note patch proposal
    definition: Proposes a structured patch to a vault note for governance or a human-facing surface to accept or reject.
    parent: cao
    boundary_ref: CAO
    seed_source: "docs/PANEL_AGENT.md :: Panel Agent"
  - id: archive-exposure
    name: Archive exposure
    definition: Exposes retained material through discovery, citation, preview, and governed materialization modes.
    parent: hka
    boundary_ref: HKA
    seed_source: "docs/CONCEPTS/ARCHIVE_EXPOSURE_CONTRACT.md :: Purpose"
  - id: commitment-surfacing
    name: Commitment surfacing
    definition: Returns open commitments, next actions, and waiting items as a structured payload distinct from note state.
    parent: cao
    boundary_ref: CAO
    seed_source: "docs/COMMITMENT_AS_FIRST_CLASS/README.md :: What this capability is"
