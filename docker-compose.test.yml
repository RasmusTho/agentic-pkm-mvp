services:
  db:
    ports:
      - "15434:5432"

  api:
    ports:
      - "18002:8000"
    environment:
      PKM_ENVIRONMENT: dev
      DATABASE_URL: postgresql+psycopg://app:app@db:5432/app
      DB_DSN: postgresql+psycopg://app:app@db:5432/app

  worker:
    environment:
      PKM_ENVIRONMENT: dev
      DATABASE_URL: postgresql+psycopg://app:app@db:5432/app
      DB_DSN: postgresql+psycopg://app:app@db:5432/app

  watcher:
    environment:
      PKM_ENVIRONMENT: dev
      DATABASE_URL: postgresql+psycopg://app:app@db:5432/app
      DB_DSN: postgresql+psycopg://app:app@db:5432/app
