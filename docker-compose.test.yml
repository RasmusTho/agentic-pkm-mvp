x-channel-logging: &channel-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:
  source-identity-db-witness:
    logging: *channel-logging

  instance-state-init:
    logging: *channel-logging
    volumes:
      - "runtime-tmp:/app/tmp-test"
    environment:
      # Keep the non-caller bootstrap service isolated from channel routing.
      LLM_PROVIDER: mock
      DESIGN_HANDOFF_APP_LOCAL_SETTINGS: ${DESIGN_HANDOFF_APP_LOCAL_SETTINGS:-/app/tmp-test/agentic-pkm/app-local.md}

  migrate:
    logging: *channel-logging
    environment:
      PKM_ENVIRONMENT: test
      DATABASE_URL: postgresql+psycopg://app:app@db:5432/app_test
      DB_DSN: postgresql+psycopg://app:app@db:5432/app_test
      LLM_PROVIDER: mock
      # Test is non-production; stale shared runtime control values must not
      # turn this migration producer into the production gate.
      MIGRATION_PRODUCTION_GATE: "0"
      MIGRATION_GATE_TOKEN_ONLY: "0"
      MIGRATION_TARGET_IDENTITY: !reset null
      PROD_MIGRATION_FORWARD_ONLY_ACK: !reset null

  db:
    logging: *channel-logging
    environment:
      POSTGRES_DB: app_test
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports: !override
      - "15434:5432"

  ollama:
    logging: *channel-logging
    ports: !override
      - "11435:11434"

  api:
    logging: *channel-logging
    ports: !override
      - "18002:8000"
    # #2991: test channel writes heartbeat/state/outbox artifacts under
    # /app/tmp-test instead of the base /app/tmp default. Mount the SAME
    # per-project named runtime-tmp volume at that path so api/worker/watcher
    # share the test-channel runtime surface too — otherwise the #2991
    # cross-container-visibility fix would not extend to the test channel.
    # The mock-default channel may run before host identity is provisioned.
    # Creating an empty source directory preserves that route; it is not an identity.
    volumes:
      - "runtime-tmp:/app/tmp-test"
      - type: bind
        source: /etc/yggdrasil/model-access/codex-client
        target: /run/model-access/codex-client
        read_only: true
        bind:
          create_host_path: true
    environment:
      DESIGN_HANDOFF_APP_LOCAL_SETTINGS: ${DESIGN_HANDOFF_APP_LOCAL_SETTINGS:-/app/tmp-test/agentic-pkm/app-local.md}
      API_HEALTHCHECK_URL: http://host.docker.internal:18002/readyz
      PKM_ENVIRONMENT: test
      DATABASE_URL: postgresql+psycopg://app:app@db:5432/app_test
      DB_DSN: postgresql+psycopg://app:app@db:5432/app_test
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      LLM_PROVIDER_ENFORCE: "0"
      MODEL_ACCESS_CODEX_VLAN_ENDPOINT: ${MODEL_ACCESS_CODEX_VLAN_ENDPOINT:-}
      MODEL_ACCESS_CODEX_VLAN_CA_BUNDLE: ${MODEL_ACCESS_CODEX_VLAN_CA_BUNDLE:-}
      MODEL_ACCESS_CODEX_VLAN_CLIENT_CERT: ${MODEL_ACCESS_CODEX_VLAN_CLIENT_CERT:-}
      MODEL_ACCESS_CODEX_VLAN_CLIENT_KEY: ${MODEL_ACCESS_CODEX_VLAN_CLIENT_KEY:-}
      # Keep the universal TEST overlay fail-closed when no vault overlay is
      # selected. The explicit legacy-vault overlay comes later and restores
      # the operator-selected /app/vault watcher binding.
      WATCHER_ENABLE: "0"
      WATCHER_VAULT_PATH: ""
      WATCHER_STATE_DIR: tmp-test
      WATCHER_STOP_FILE: /app/tmp-test/WATCHER_STOP
      INDEX_OUTBOX_PATH: /app/tmp-test/index-outbox.jsonl
      WATCHER_HEARTBEAT_PATH: /app/tmp-test/watcher_heartbeat.json
      WORKER_HEARTBEAT_PATH: /app/tmp-test/worker_heartbeat.json
      WATCHER_STATE_PATH: /app/tmp-test/watcher_state.json
      VAULT_SYSTEM_DIR_REL: "⚙️ System"
      VAULT_INBOX_DIR_REL: "📥 Inbox"
      VAULT_DESK_DIR_REL: "🛠️ Workbench"

  worker:
    logging: *channel-logging
    volumes:
      - "runtime-tmp:/app/tmp-test"
      - type: bind
        source: /etc/yggdrasil/model-access/codex-client
        target: /run/model-access/codex-client
        read_only: true
        bind:
          create_host_path: true
    environment:
      DESIGN_HANDOFF_APP_LOCAL_SETTINGS: ${DESIGN_HANDOFF_APP_LOCAL_SETTINGS:-/app/tmp-test/agentic-pkm/app-local.md}
      PKM_ENVIRONMENT: test
      DATABASE_URL: postgresql+psycopg://app:app@db:5432/app_test
      DB_DSN: postgresql+psycopg://app:app@db:5432/app_test
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      LLM_PROVIDER_ENFORCE: "0"
      MODEL_ACCESS_CODEX_VLAN_ENDPOINT: ${MODEL_ACCESS_CODEX_VLAN_ENDPOINT:-}
      MODEL_ACCESS_CODEX_VLAN_CA_BUNDLE: ${MODEL_ACCESS_CODEX_VLAN_CA_BUNDLE:-}
      MODEL_ACCESS_CODEX_VLAN_CLIENT_CERT: ${MODEL_ACCESS_CODEX_VLAN_CLIENT_CERT:-}
      MODEL_ACCESS_CODEX_VLAN_CLIENT_KEY: ${MODEL_ACCESS_CODEX_VLAN_CLIENT_KEY:-}
      WATCHER_ENABLE: "0"
      WATCHER_VAULT_PATH: ""
      WATCHER_STATE_DIR: tmp-test
      WATCHER_STOP_FILE: /app/tmp-test/WATCHER_STOP
      INDEX_OUTBOX_PATH: /app/tmp-test/index-outbox.jsonl
      WATCHER_HEARTBEAT_PATH: /app/tmp-test/watcher_heartbeat.json
      WORKER_HEARTBEAT_PATH: /app/tmp-test/worker_heartbeat.json
      WATCHER_STATE_PATH: /app/tmp-test/watcher_state.json
      VAULT_SYSTEM_DIR_REL: "⚙️ System"
      VAULT_INBOX_DIR_REL: "📥 Inbox"
      VAULT_DESK_DIR_REL: "🛠️ Workbench"

  watcher:
    logging: *channel-logging
    volumes:
      - "runtime-tmp:/app/tmp-test"
      - type: bind
        source: /etc/yggdrasil/model-access/codex-client
        target: /run/model-access/codex-client
        read_only: true
        bind:
          create_host_path: true
    environment:
      DESIGN_HANDOFF_APP_LOCAL_SETTINGS: ${DESIGN_HANDOFF_APP_LOCAL_SETTINGS:-/app/tmp-test/agentic-pkm/app-local.md}
      PKM_ENVIRONMENT: test
      DATABASE_URL: postgresql+psycopg://app:app@db:5432/app_test
      DB_DSN: postgresql+psycopg://app:app@db:5432/app_test
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      LLM_PROVIDER_ENFORCE: "0"
      MODEL_ACCESS_CODEX_VLAN_ENDPOINT: ${MODEL_ACCESS_CODEX_VLAN_ENDPOINT:-}
      MODEL_ACCESS_CODEX_VLAN_CA_BUNDLE: ${MODEL_ACCESS_CODEX_VLAN_CA_BUNDLE:-}
      MODEL_ACCESS_CODEX_VLAN_CLIENT_CERT: ${MODEL_ACCESS_CODEX_VLAN_CLIENT_CERT:-}
      MODEL_ACCESS_CODEX_VLAN_CLIENT_KEY: ${MODEL_ACCESS_CODEX_VLAN_CLIENT_KEY:-}
      WATCHER_ENABLE: "0"
      WATCHER_VAULT_PATH: ""
      WATCHER_STATE_DIR: tmp-test
      WATCHER_STOP_FILE: /app/tmp-test/WATCHER_STOP
      INDEX_OUTBOX_PATH: /app/tmp-test/index-outbox.jsonl
      WATCHER_HEARTBEAT_PATH: /app/tmp-test/watcher_heartbeat.json
      WORKER_HEARTBEAT_PATH: /app/tmp-test/worker_heartbeat.json
      WATCHER_STATE_PATH: /app/tmp-test/watcher_state.json
      VAULT_SYSTEM_DIR_REL: "⚙️ System"
      VAULT_INBOX_DIR_REL: "📥 Inbox"
      VAULT_DESK_DIR_REL: "🛠️ Workbench"

  heimdal-capture-watch:
    logging: *channel-logging
    volumes:
      - "runtime-tmp:/app/tmp-test"
    environment:
      DESIGN_HANDOFF_APP_LOCAL_SETTINGS: ${DESIGN_HANDOFF_APP_LOCAL_SETTINGS:-/app/tmp-test/agentic-pkm/app-local.md}
      PKM_ENVIRONMENT: test
      DATABASE_URL: postgresql+psycopg://app:app@db:5432/app_test
      DB_DSN: postgresql+psycopg://app:app@db:5432/app_test
      LLM_PROVIDER: mock
      # HEIMDAL_CAPTURE_WATCH_DIR is deliberately NOT set here (#4362):
      # CAPTURE_GOVERNED_KEYS (tests/deploy/test_base_runtime_env_compose.py)
      # must ride the env_file chain, not `environment:` (which would shadow
      # it with CLI interpolation, #3885). The test-scoped default lives in
      # scripts/export_runtime_env.sh's test-channel branch instead.

  companion-ui:
    logging: *channel-logging
    ports: !override
      - "${COMPANION_UI_BIND_HOST:-127.0.0.1}:8112:8112"
    environment:
      PKM_ENVIRONMENT: test
      PORT: 8112
      COMPANION_API_BASE_URL: http://api:8000
      COMPANION_API_TIMEOUT_SECONDS: "30.0"
      COMPANION_CAPTURE_TIMEOUT_SECONDS: ${COMPANION_CAPTURE_TIMEOUT_SECONDS:-120.0}
      COMPANION_UI_SERVE_MODULE: companion_ui.workspace.serve_dev_page

volumes:
  pgdata:
