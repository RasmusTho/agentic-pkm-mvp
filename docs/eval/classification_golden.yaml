# Intent-classification golden set (classification_case.v1)
#
# Authored under issue #2784 (RESEARCH-06); adopted by KERNEL-13 (#2775), which
# wires the runner, scorecard slice, thresholds, and CI gate. Spec:
# docs/RUNTIME_CORRECTNESS_KERNEL/INTENT_CLASSIFICATION_GOLDEN_SET.md
# Rationale per case family: docs/eval/classification_golden_rationale.md
#
# All content is SYNTHETIC. No real personal data; note references are generic.
#
# Per-case fields (classification_case.v1, per the KERNEL-13 spec):
#   id                    family-language-slug (family encodes the confusion boundary probed)
#   language              en | sv  (dominant language of the utterance; convention
#                         carried over from retrieval_eval_case.v1)
#   utterance             the user intent text handed to the classifier
#   context.surface       canvas (the classifier runs on the canvas co-authoring surface)
#   context.note_state    draft-open | seedling-open | evergreen-open | none
#   expected_intent       co_authoring | governance_bearing | exploratory | unknown
#                         (enum values from app/chat/intent_classifier.py::IntentClass;
#                         `unknown` is the explicit safe-fail class added by KERNEL-07)
#   expected_action_type  null unless expected_intent is governance_bearing; then one of
#                         frontmatter_update | maturity_transition | note_lifecycle | cross_note
#                         (app/chat/governance_router.py::GovernanceActionType)
#   acceptable            intent classes OTHER than expected_intent that the scorer
#                         treats as a pass (read-side tolerance only)
#
# Scoring semantics the runner must honor (KERNEL-13):
#   - `unknown` is scored as safe-fail SEPARATELY, never as a wrong class. It is
#     therefore never listed in `acceptable`.
#   - HARD GATE: for every case with expected_intent in {exploratory, unknown},
#     classification into an action-capable class (co_authoring, governance_bearing)
#     is a blocking regression. Dataset invariant protecting that gate: such cases
#     never list an action-capable class in `acceptable`.
#   - Read-side confusion (expected action-capable, classified exploratory) is
#     thresholded, not blocking.
#
# Families (id prefix -> boundary probed; details in the rationale doc):
#   coauthor-*   plain body-edit requests                       (plain)
#   gov-*        plain governance commands, all 4 action types  (plain)
#   explore-*    plain exploratory questions                    (plain)
#   govchat-*    governance intent phrased as casual chat       (boundary)
#   cmdstyle-*   body edits phrased as governance-sounding commands (boundary)
#   readvocab-*  exploratory questions carrying mutation vocabulary (boundary, hard gate)
#   vague-*      genuinely unresolvable -> expected unknown     (boundary, hard gate)
#   polite-*     Swedish politeness/indirection forms           (boundary)
#   multi-*      multi-intent utterances resolved to ONE class or unknown (boundary)
#   xlang-*      cross-language idiom (Swenglish, mixed note names) (boundary)

schema_version: classification_case.v1
