id: ask.v1
status: active
kind: langgraph
description: Retrieve → rerank → answer (ASK graph).
entrypoint: app/agents/ask/graph.py:build_graph
state_schema: app/agents/ask/state.py:AskState
input_events:
  - ask.requested
output_events:
  - ask.answered
allowed_tools:
  - mcp.search.objects
allowed_stores:
  - ObjectStore
  - VectorIndex
settings_refs:
  - docs/settings/prompts/registry.yaml
  - docs/settings/standards.yaml
