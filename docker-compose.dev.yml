services:
  db:
    environment:
      POSTGRES_DB: app_dev
    ports: !override
      - "15433:5432"
    # Named volume so app_dev data survives container recreation (issue #2254).
    # Without this, `docker compose up --force-recreate db` wipes store_objects
    # and watcher mtime saturation prevents re-population via normal watch ticks.
    volumes:
      - pgdata-dev:/var/lib/postgresql/data

  api:
    ports: !override
      - "18001:8000"
    environment:
      PKM_ENVIRONMENT: dev
      DATABASE_URL: postgresql+psycopg://app:app@db:5432/app_dev
      DB_DSN: postgresql+psycopg://app:app@db:5432/app_dev

  worker:
    environment:
      PKM_ENVIRONMENT: dev
      DATABASE_URL: postgresql+psycopg://app:app@db:5432/app_dev
      DB_DSN: postgresql+psycopg://app:app@db:5432/app_dev

  watcher:
    environment:
      PKM_ENVIRONMENT: dev
      DATABASE_URL: postgresql+psycopg://app:app@db:5432/app_dev
      DB_DSN: postgresql+psycopg://app:app@db:5432/app_dev

  companion-ui:
    ports: !override
      - "${COMPANION_UI_BIND_HOST:-127.0.0.1}:8111:8111"
    environment:
      PKM_ENVIRONMENT: dev
      PORT: 8111
      COMPANION_API_BASE_URL: http://api:8000
      COMPANION_UI_SERVE_MODULE: companion_ui.workspace.serve_dev_page

volumes:
  pgdata-dev:
