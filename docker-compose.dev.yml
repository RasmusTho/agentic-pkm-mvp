services:
  migrate:
    environment:
      LLM_PROVIDER: mock
      DATABASE_URL: postgresql+psycopg://app:app@db:5432/app_dev
      DB_DSN: postgresql+psycopg://app:app@db:5432/app_dev

  db:
    environment:
      POSTGRES_DB: app_dev
    ports: !override
      - "15433:5432"
    # Named volume so app_dev data survives container recreation (issue #2254).
    # Without this, `docker compose up --force-recreate db` wipes store_objects
    # and watcher mtime saturation prevents re-population via normal watch ticks.
    volumes:
      - pgdata-dev:/var/lib/postgresql/data

  api:
    ports: !override
      - "18001:8000"
    environment:
      LLM_PROVIDER: mock
      PKM_ENVIRONMENT: dev
      DATABASE_URL: postgresql+psycopg://app:app@db:5432/app_dev
      DB_DSN: postgresql+psycopg://app:app@db:5432/app_dev
      # Deliberately no VAULT_ROOT / VAULT_ROOT_DEV keys here (#3875, follow-up
      # to #3659/#3666 review thread PRRT_kwDOQEip6s6RRnQ2). Compose's service
      # `environment:` mapping always wins over `env_file:` for a given key,
      # and `${VAULT_ROOT:-}` only interpolates from the Compose CLI/shell
      # environment -- never from a service `env_file:`. `deploy_channel_compose.sh`
      # deliberately does not pass the governed runtime env file as a CLI
      # `--env-file` (that would expose its DSNs to Compose interpolation), so
      # an explicit key here always resolved to an empty string and blanked
      # whatever the base compose's `env_file:` chain (config/runtime.defaults.env
      # + the WATCHER_RUNTIME_ENV_FILE-referenced runtime env) actually bound --
      # erasing an active dev vault selection on every deploy. Omitting the
      # keys lets the governed env_file chain supply the value untouched, and
      # as a side effect a stale parent-shell VAULT_ROOT/VAULT_ROOT_DEV can no
      # longer leak in either, since Compose only interpolates variables that
      # are textually referenced in the compose file.

  worker:
    environment:
      LLM_PROVIDER: mock
      PKM_ENVIRONMENT: dev
      DATABASE_URL: postgresql+psycopg://app:app@db:5432/app_dev
      DB_DSN: postgresql+psycopg://app:app@db:5432/app_dev
      # See the `api` service comment above: no VAULT_ROOT / VAULT_ROOT_DEV
      # keys here so the governed env_file chain supplies the binding.

  watcher:
    environment:
      LLM_PROVIDER: mock
      PKM_ENVIRONMENT: dev
      DATABASE_URL: postgresql+psycopg://app:app@db:5432/app_dev
      DB_DSN: postgresql+psycopg://app:app@db:5432/app_dev
      # See the `api` service comment above: no VAULT_ROOT / VAULT_ROOT_DEV
      # keys here so the governed env_file chain supplies the binding.

  heimdal-capture-watch:
    # The governed dev deploy wrapper materializes this last layer from the
    # declared Keychain consumer and removes it after Compose creates the
    # container. The base interpolation key is reset so it cannot blank or
    # override the bootstrap layer from a caller shell or runtime env file.
    env_file: !override
      - ./config/runtime.defaults.env
      - path: ${WATCHER_RUNTIME_ENV_FILE:-./tmp/runtime.env}
        required: false
      - path: ${HOST_SECRET_RUNTIME_ENV_FILE:-/dev/null}
        required: false
    environment:
      LLM_PROVIDER: mock
      PKM_ENVIRONMENT: dev
      DATABASE_URL: postgresql+psycopg://app:app@db:5432/app_dev
      DB_DSN: postgresql+psycopg://app:app@db:5432/app_dev
      HEIMDAL_RAW_STORE_KEY: !reset null

  companion-ui:
    ports: !override
      - "${COMPANION_UI_BIND_HOST:-127.0.0.1}:8111:8111"
    environment:
      PKM_ENVIRONMENT: dev
      PORT: 8111
      COMPANION_API_BASE_URL: http://api:8000
      COMPANION_UI_SERVE_MODULE: companion_ui.workspace.serve_dev_page

volumes:
  pgdata-dev:
