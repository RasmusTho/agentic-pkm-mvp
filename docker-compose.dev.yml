services:
  db:
    environment:
      POSTGRES_DB: app_dev
    ports:
      - "15433:5432"

  api:
    ports:
      - "18001:8000"
    environment:
      PKM_ENVIRONMENT: dev
      DATABASE_URL: postgresql+psycopg://app:app@db:5432/app_dev
      DB_DSN: postgresql+psycopg://app:app@db:5432/app_dev

  worker:
    environment:
      PKM_ENVIRONMENT: dev
      DATABASE_URL: postgresql+psycopg://app:app@db:5432/app_dev
      DB_DSN: postgresql+psycopg://app:app@db:5432/app_dev

  watcher:
    environment:
      PKM_ENVIRONMENT: dev
      DATABASE_URL: postgresql+psycopg://app:app@db:5432/app_dev
      DB_DSN: postgresql+psycopg://app:app@db:5432/app_dev
