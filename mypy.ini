[mypy]
python_version = 3.11
warn_unused_configs = True
warn_unused_ignores = False
warn_return_any = False
ignore_missing_imports = True
plugins = pydantic.mypy

[mypy-app.*]
disallow_untyped_defs = True

[mypy-app._legacy.*]
ignore_errors = True

[mypy-app.agent.*]
ignore_errors = True

[mypy-app.agent.graph]
allow_redefinition = True

[mypy-app.agents.*]
ignore_errors = True

[mypy-app.alembic.*]
ignore_errors = True

[mypy-app.api.*]
ignore_errors = True

[mypy-app.cli.*]
ignore_errors = True

[mypy-app.components.*]
ignore_errors = True

[mypy-app.config.*]
ignore_errors = True

[mypy-app.db.*]
ignore_errors = True

[mypy-app.deps]
ignore_errors = True

[mypy-app.diarization.*]
ignore_errors = True

[mypy-app.embedding_config]
ignore_errors = True

[mypy-app.events.*]
ignore_errors = True

[mypy-app.eval.*]
ignore_errors = True

[mypy-app.fitness.*]
ignore_errors = True

[mypy-app.health_contract]
ignore_errors = True

[mypy-app.ingest.*]
ignore_errors = True

[mypy-app.indexer.*]
ignore_errors = True

[mypy-app.jobs.*]
ignore_errors = True

[mypy-app.langgraph.*]
ignore_errors = True

[mypy-app.llm.*]
ignore_errors = True

[mypy-app.media.*]
ignore_errors = True

[mypy-app.memory.*]
ignore_errors = True

[mypy-app.middleware.*]
ignore_errors = True

[mypy-app.observability.*]
ignore_errors = True

[mypy-app.outbox.*]
ignore_errors = True

[mypy-app.planner.*]
ignore_errors = True

[mypy-app.plugins.*]
ignore_errors = True

[mypy-app.policy.*]
ignore_errors = True

[mypy-app.promotion.*]
ignore_errors = True

[mypy-app.reasoning.*]
ignore_errors = True

[mypy-app.retrieval.*]
ignore_errors = True

[mypy-app.runtime.*]
ignore_errors = True

[mypy-app.search.*]
ignore_errors = True

[mypy-app.services.*]
ignore_errors = True

[mypy-app.settings.*]
ignore_errors = True

[mypy-app.store.*]
ignore_errors = True

[mypy-app.stores.*]
ignore_errors = True

[mypy-app.tracing]
ignore_errors = True

[mypy-app.watcher.*]
