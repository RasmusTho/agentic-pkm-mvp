---
# Explicit development overlay for the repo source bind mount.
#
# S5 makes pinned-image mode the default so /version is authoritative for the
# running code. Include this overlay only for an explicit local hot-reload
# session; deploy and channel startup paths omit it.
services:
  api:
    volumes:
      - ./:/app

  worker:
    volumes:
      - ./:/app

  watcher:
    volumes:
      - ./:/app

  companion-ui:
    volumes:
      - ./:/app
