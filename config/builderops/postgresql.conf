# BuilderOps recovery durability is asynchronous (ADR-0062 A1). Local commit
# acknowledgement does not wait for this off-host archive pipeline.
archive_mode = on
archive_command = '/bin/bash /app/scripts/builderops/wal_archive.sh push %p'
archive_timeout = '60s'
wal_level = replica
max_wal_senders = 3

# WAL sizing does not discard unarchived segments. Operators must alert on
# archive lag and free disk because PostgreSQL retains segments until archival
# succeeds. Exact sizing remains an operator decision based on write volume.
max_wal_size = '2GB'
min_wal_size = '256MB'
