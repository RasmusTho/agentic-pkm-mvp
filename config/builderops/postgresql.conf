# Custom config_file bypasses the postgres image's usual listen_addresses='*'
# handling, so it must be set explicitly here or the server falls back to its
# compiled-in localhost default and no other container can connect. The
# containing network (builderops-control-plane-internal) is internal: true,
# so '*' is not host exposure.
listen_addresses = '*'

# The local BuilderOps control plane is rebuildable operational state. It does
# not currently have an independent recovery target, so archiving must remain
# disabled rather than retaining WAL after a failed archive command.
archive_mode = off
archive_command = ''
wal_level = replica
max_wal_senders = 3

# The container health check enforces bounded local WAL and disk use. These
# are guardrails for a rebuildable projection, not a backup/PITR claim.
max_wal_size = '2GB'
min_wal_size = '256MB'
max_slot_wal_keep_size = '2GB'
