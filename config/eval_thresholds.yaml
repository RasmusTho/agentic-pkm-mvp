# Deterministic retrieval/memory eval thresholds for `python -m app.eval.run`.
#
# These are conservative floors for the current baseline retrieval quality,
# not aspirational targets. Read by app/eval/run.py; documented in
# docs/eval.md :: Metrics. Raise thresholds only after intentionally
# improving retrieval and re-measuring the golden set — do not hardcode
# aspirational numbers directly in code.
schema_version: eval_thresholds.v1

# Applied to the overall aggregate across the full bilingual seed.
aggregate:
  precision_at_k: 0.15
  ndcg_at_k: 0.60

# Applied per language (en, sv) over the bilingual seed.
per_language:
  precision_at_k: 0.10
  ndcg_at_k: 0.55

# Applied to the memory-recall slice (recall_into_ask + low_trust_citation
# route_intents from docs/eval/retrieval_bilingual_seed.yaml).
memory_recall:
  precision_at_k: 0.10
  ndcg_at_k: 0.60

# Applied to the intent-classification golden set (KERNEL-13, #2775):
# docs/eval/classification_golden.yaml scored through the real classifier
# path via the deterministic replay fixture docs/eval/classification_replay.yaml.
# These floors gate READ-SIDE confusion only. The mutation-side hard gate
# (an expected exploratory/unknown case classified into an action-capable
# class) is enforced unconditionally in app/eval/run.py — it is a blocking
# regression and deliberately has no threshold here.
classification:
  macro_precision: 0.90
  macro_recall: 0.90
  pass_rate: 0.90
  answer_rate: 0.85
  unknown_safe_fail_rate: 0.85

k: 5
