# Import boundary contracts — see docs/adr/ADR-0013-code-dependency-direction.md
#
# Directional, contract-based projection of DESIGN_PRINCIPLES §3 system layers
# (interaction > cognition/execution > memory; governance cross-cutting; foundation leaf)
# onto app.* packages. v1 enforces the primary invariant only: nothing outside the
# interaction layer may import the interaction layer. Run NON-BLOCKING on PRs
# (.github/workflows/import-linter.yaml, continue-on-error). Add new packages to
# source_modules below as they are introduced. Fuller per-layer layered/independence
# contracts are a documented refinement (ADR-0013, Out of scope).
#
# Invoke with: lint-imports --config importlinter.ini  (bare `lint-imports` does not
# auto-discover this filename; it looks for .importlinter / setup.cfg / pyproject).
#
# NOTE: All app/ subdirectories are now regular packages (have __init__.py), as
# of #2085. The previously-deferred packages (app.orientation, app.reasoning,
# app.watcher, app.capture, app.eval, app.llm, and others) are now included in
# source_modules below and are machine-enforced. app/alembic is intentionally
# excluded (it is a migrations dir, not an application package).
#
# COVERAGE: source_modules must list every non-interaction app.* package so the
# interaction-protected contract actually evaluates each one. Packages are grouped
# by their ADR-0013 §3 layer for legibility. tests/architecture/test_import_boundary.py
# asserts this coverage is complete (no real app.* package outside the interaction
# set is silently omitted).

[importlinter]
root_package = app

[importlinter:contract:interaction-protected]
name = Interaction layer is import-protected (no inward imports from deeper layers)
type = forbidden
source_modules =
    # Cognition — derivation, understanding, retrieval, reasoning, projection
    app.agents
    app.reasoning
    app.retrieval
    app.search
    app.relevance
    app.source_understanding
    app.knowledge_compilation
    app.planner
    app.orientation
    app.resurfacing
    app.panel
    app.context_bundles
    app.components
    # Execution — orchestration and side-effecting capabilities
    app.orchestrator
    app.dispatcher
    app.services
    app.a2a
    app.watcher
    app.runtime
    app.ingest
    app.sync
    app.writeback
    app.capture
    app.tts
    app.diarization
    app.indexer
    app.jobs
    app.langgraph
    app.workers
    app.media
    app.middleware
    # Memory — durable stores and knowledge persistence
    app.agent_memory
    app.memory
    app.stores
    app.store
    app.index
    app.db
    app.knowledge
    app.vault
    app.objects
    app.receipts
    app.outbox
    # Governance — policy, authority, promotion, quality gates (cross-cutting)
    app.builderops
    app.promotion
    app.release_channels
    app.governance
    app.policy
    app.guardrails
    app.fitness
    app.activation
    app.quality
    app.eval
    app.ops
    # Foundation — shared leaf (kept upward-free; listed so leaks are reported)
    app.events
    app.settings
    app.schemas
    app.config
    app.domain
    app.ports
    app.llm
    app.mcp
    app.observability
    app.obs
    app.io
    app.text
    app.scripts
    app.testing
forbidden_modules =
    app.api
    app.chat
    app.cli
    app.web
