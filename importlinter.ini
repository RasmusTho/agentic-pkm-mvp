# Import boundary contracts — see docs/adr/ADR-0013-code-dependency-direction.md
#
# Directional, contract-based projection of DESIGN_PRINCIPLES §3 system layers
# (interaction > cognition/execution > memory; governance cross-cutting; foundation leaf)
# onto app.* packages. v1 enforces the primary invariant only: nothing outside the
# interaction layer may import the interaction layer. Run NON-BLOCKING on PRs
# (.github/workflows/import-linter.yaml, continue-on-error). Add new packages to
# source_modules below as they are introduced. Fuller per-layer layered/independence
# contracts are a documented refinement (ADR-0013, Out of scope).
#
# Invoke with: lint-imports --config importlinter.ini  (bare `lint-imports` does not
# auto-discover this filename; it looks for .importlinter / setup.cfg / pyproject).
#
# NOTE: import-linter cannot reference implicit namespace packages (app subdirs
# without __init__.py: app.orientation, app.reasoning, app.watcher, app.capture,
# app.eval, app.llm, ...). They are omitted from source_modules below until they
# are made regular packages (follow-up issue); their inward leaks are recorded in
# docs/architecture/IMPORT_BOUNDARY_INVENTORY.md but are not yet machine-enforced.

[importlinter]
root_package = app

[importlinter:contract:interaction-protected]
name = Interaction layer is import-protected (no inward imports from deeper layers)
type = forbidden
source_modules =
    app.agents
    app.retrieval
    app.search
    app.relevance
    app.source_understanding
    app.knowledge_compilation
    app.planner
    app.resurfacing
    app.panel
    app.context_bundles
    app.orchestrator
    app.dispatcher
    app.services
    app.a2a
    app.ingest
    app.sync
    app.writeback
    app.tts
    app.diarization
    app.indexer
    app.agent_memory
    app.stores
    app.store
    app.index
    app.db
    app.knowledge
    app.vault
    app.objects
    app.receipts
    app.outbox
    app.builderops
    app.promotion
    app.release_channels
    app.policy
    app.guardrails
    app.fitness
    app.activation
    app.quality
    app.observability
forbidden_modules =
    app.api
    app.chat
    app.cli
    app.web
