# Import boundary contracts — see docs/adr/ADR-0013-code-dependency-direction.md
#
# Directional, contract-based projection of DESIGN_PRINCIPLES §3 system layers
# (interaction > cognition/execution > memory; governance cross-cutting; foundation leaf)
# onto app.* packages. The primary invariant prevents inward imports of the
# interaction layer. Issue-scoped protected contracts below also seal named
# stateful mutation modules to their sanctioned importers. Run BLOCKING in
# `.github/workflows/import-linter.yaml` and `.github/workflows/ci-smoke.yaml`
# on relevant PRs. Add new packages to source_modules below as they are
# introduced. Fuller per-layer
# layered/independence contracts are a documented refinement (ADR-0013, Out of
# scope).
#
# Invoke with: lint-imports --config importlinter.ini  (bare `lint-imports` does not
# auto-discover this filename; it looks for .importlinter / setup.cfg / pyproject).
#
# NOTE: All app/ subdirectories are now regular packages (have __init__.py), as
# of #2085. The previously-deferred packages (app.orientation, app.reasoning,
# app.watcher, app.capture, app.eval, app.llm, and others) are now included in
# source_modules below and are machine-enforced. app/alembic is intentionally
# excluded (it is a migrations dir, not an application package).
#
# COVERAGE: source_modules must list every non-interaction app.* package so the
# interaction-protected contract actually evaluates each one. Packages are grouped
# by their ADR-0013 §3 layer for legibility. tests/architecture/test_import_boundary.py
# asserts this coverage is complete (no real app.* package outside the interaction
# set is silently omitted).

[importlinter]
root_packages =
    app
    llm_contract

[importlinter:contract:builder-llm-authority]
name = Builder System must not import the Product LLM fabric
type = forbidden
source_modules =
    app.builderops
forbidden_modules =
    app.components.llm

[importlinter:contract:interaction-protected]
name = Interaction layer is import-protected (no inward imports from deeper layers)
type = forbidden
source_modules =
    # Cognition — derivation, understanding, retrieval, reasoning, projection
    app.agents
    app.reasoning
    app.retrieval
    app.search
    app.relevance
    app.source_understanding
    app.knowledge_compilation
    app.calibration
    app.temporal
    app.planner
    app.orientation
    app.resurfacing
    app.panel
    app.context_bundles
    app.components
    # Execution — orchestration and side-effecting capabilities
    app.orchestrator
    app.execution
    app.dispatcher
    app.services
    app.a2a
    app.watcher
    app.runtime
    app.ingest
    app.sync
    app.sfc
    app.writeback
    app.capture
    app.tts
    app.diarization
    app.voice
    app.indexer
    app.jobs
    app.langgraph
    app.workers
    app.media
    app.middleware
    app.knowledge_acquisition
    app.proxmox
    app.heimdal
    app.voice
    app.briefing
    app.journaling
    # Memory — durable stores and knowledge persistence
    app.instance
    app.agent_memory
    app.memory_kv
    app.stores
    app.store
    app.index
    app.db
    app.knowledge
    app.vault
    app.objects
    app.receipts
    app.archival
    app.outbox
    app.episodes
    app.standing_questions
    # Governance — policy, authority, promotion, quality gates (cross-cutting)
    app.builderops
    app.promotion
    app.release_channels
    app.governance
    app.policy
    app.guardrails
    app.fitness
    app.activation
    app.quality
    app.curation
    app.expansion
    app.proposals
    app.eval
    app.ops
    # Foundation — shared leaf (kept upward-free; listed so leaks are reported)
    app.events
    app.settings
    app.schemas
    app.config
    app.domain
    app.ports
    app.llm
    app.mcp
    app.observability
    app.io
    app.text
    app.scripts
    app.testing
forbidden_modules =
    app.api
    app.chat
    app.cli
    app.web

[importlinter:contract:neutral-llm-contract-kernel]
name = Neutral LLM contract kernel must not import Product or Builder runtime
type = forbidden
source_modules =
    llm_contract
forbidden_modules =
    app

[importlinter:contract:instance-storage-mutation-protected]
name = Instance storage mutation modules are import-protected
type = protected
protected_modules =
    app.instance.instance_state
    app.instance.ownership_ledger
allowed_importers =
    app.instance.binding_effect_lease
    app.instance.instance_state
    app.instance.runtime
    app.instance.scalar_binding_runtime
as_packages = False

[importlinter:contract:instance-storage-capability-protected]
name = Instance storage mutation capability is import-protected
type = protected
protected_modules =
    app.instance._storage_boundary
allowed_importers =
    app.instance.binding_effect_lease
    app.instance.local_operator_principal
    app.instance.ownership_ledger
    app.instance.runtime
    app.instance.scalar_binding_runtime
    app.instance.vault_registry
as_packages = False
