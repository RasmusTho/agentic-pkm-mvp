---
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: ws
      POSTGRES_USER: ws
      POSTGRES_DB: ws
    volumes:
      - db_data:/var/lib/postgresql/data
    ports: ["15432:5432"]

  api:
    image: python:3.12-slim
    working_dir: /app
    command: bash -lc "pip install fastapi uvicorn pyyaml && uvicorn app:app --host 0.0.0.0 --port 8000"
    environment:
      DATABASE_URL: postgresql://ws:ws@db:5432/ws
      WS_MODE: "true"
      USE_RERANKER: "false"
      BUS_IMPL: "inproc"
    volumes:
      - ./data:/app/data
      - ./golden:/app/golden
      - ./ingest:/app/ingest
      - ./scripts:/app/scripts
      - ./api:/app
    ports: ["18000:8000"]
    depends_on: [db]

volumes:
  db_data:
