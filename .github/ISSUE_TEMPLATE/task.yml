name: Task
description: Structured task contract for human and agent execution
title: "task: "
labels: ["type:task"]
body:
  - type: markdown
    attributes:
      value: |
        Use this form for implementation/delivery task contracts that can be executed by builders and coding agents.
        Docs-authoring PRs that remain docs-only do not need this form unless they are intentionally extracting backlog work.
        New backlog work must include stable source anchors so doc intent can be traced in GitHub
        without relying on unmerged inline `Tracked by` markers.
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Why this task exists and what repo/runtime/docs context matters.
      placeholder: Describe the relevant current-state context.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: Exact bounded work to perform.
      placeholder: List the bounded implementation/doc/test changes that are in scope.
    validations:
      required: true
  - type: textarea
    id: source_anchors
    attributes:
      label: Source Anchors
      description: Stable doc item identifiers that justify this issue.
      placeholder: |
        - docs/PANEL_AGENT.md :: PA2-FREEFORM
        - docs/ROADMAP.md :: PA2-ROLLUP
    validations:
      required: true
  - type: textarea
    id: sbs_impact
    attributes:
      label: SBS Impact
      description: Target System Breakdown Structure classification for routing, boundary review, and follow-up ownership.
      placeholder: |
        - Primary subsystem:
        - Secondary subsystem(s):
        - Write class:
        - Authority impact:
        - Persistence impact:
        - Derived/rebuildable impact:
        - Human knowledge impact:
        - Memory impact:
        - Retrieval/context impact:
        - Sync/deployment impact:
        - New or changed contract:
        - Boundary risk:
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Constraints
      description: Architectural, runtime, safety, or process constraints that must be respected.
      placeholder: Include boundaries such as no direct DB imports, preserve event contracts, docs-in-same-change, etc.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      description: |
        Concrete done conditions. Every item must carry an inline `Verify:` marker naming a concrete verification target:
        - Behavioral AC → test pointer: `Verify: tests/<path>::<test_name>` (the test may be new; the name is the commitment)
        - Non-behavioral AC → explicit target: doc writeback path plus anchor, roadmap diff, or runtime receipt
        ACs without a resolvable `Verify:` target are not executable and must be refined before the Issue is marked ready.
      placeholder: |
        - [ ] <behavioral outcome>
          Verify: `tests/<module>/test_<name>.py::test_<case>`
        - [ ] <doc/roadmap/receipt outcome>
          Verify: doc writeback at `docs/<PATH>.md :: <anchor>`
    validations:
      required: true
  - type: textarea
    id: out_of_scope
    attributes:
      label: Out of Scope
      description: Explicitly excluded work.
      placeholder: State what this task must not change.
    validations:
      required: true
  - type: textarea
    id: suggested_validation
    attributes:
      label: Suggested Validation
      description: |
        Exact commands or checks that execute the `Verify:` targets declared in Acceptance Criteria.
        This section is the procedural form of the AC verification plan — commands should resolve every Verify target, not duplicate them.
      placeholder: |
        - `pytest -q tests/<module>/test_<name>.py`
        - `python -m app.cli ...`
        - doc check: `docs/<PATH>.md :: <anchor>` present after change
    validations:
      required: true
  - type: textarea
    id: source_docs
    attributes:
      label: Source Docs
      description: Governing docs that define the current-state or forward-line basis.
      placeholder: |
        - docs/PANEL_AGENT.md
        - docs/ROADMAP.md
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - prio:high
        - prio:med
        - prio:low
      default: 1
    validations:
      required: true
  - type: dropdown
    id: agent_state
    attributes:
      label: Agent State
      options:
        - agent:needs-human
        - agent:ready
        - agent:blocked
      default: 0
    validations:
      required: true
