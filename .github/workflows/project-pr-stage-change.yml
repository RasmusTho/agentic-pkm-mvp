name: Optional Project Projection - PR Stage Change

on:
  pull_request:
    types: [ready_for_review, converted_to_draft, closed]

concurrency:
  # Optional legacy projection only; Issue/PR state remains authoritative.
  # Shared group with the other GitHub Project board workflows so only one board
  # writer runs at a time (prevents the multi-workflow GraphQL stampede).
  # `queue: max` keeps pending runs (FIFO, up to 100) so burst board events are
  # not dropped; the default `queue: single` would cancel all but the latest.
  group: github-project-board-reconcile
  cancel-in-progress: false
  queue: max

permissions:
  contents: read
  pull-requests: read

jobs:
  project-pr-projection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect board automation App configuration
        id: project-app-config
        shell: bash
        env:
          PROJECT_APP_ID: ${{ secrets.PROJECT_APP_ID }}
          PROJECT_APP_PRIVATE_KEY: ${{ secrets.PROJECT_APP_PRIVATE_KEY }}
        run: |
          if [[ -n "$PROJECT_APP_ID" && -n "$PROJECT_APP_PRIVATE_KEY" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Create board automation App token
        id: project-app-token
        if: ${{ steps.project-app-config.outputs.configured == 'true' }}
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.PROJECT_APP_ID }}
          private-key: ${{ secrets.PROJECT_APP_PRIVATE_KEY }}
          owner: Yggdrasil-PKM
          permission-organization-projects: write
          permission-issues: read
          permission-pull-requests: read
      - name: Project PR stage projection
        # Stage-change events are deterministic: ready -> Review,
        # draft -> In Progress, closed (merged or unmerged) -> Done. The closed
        # trigger makes terminal projection event-driven instead of relying on
        # the best-effort daily reconcile scan.
        env:
          # The App installation token isolates board automation from interactive
          # agent quota. Falls back to GITHUB_TOKEN (graceful no-op) when the App
          # secrets are absent.
          GH_TOKEN: ${{ steps.project-app-token.outputs.token || secrets.GITHUB_TOKEN }}
          REPO_GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/project_status.py \
            --repo "${{ github.repository }}" \
            --owner "Yggdrasil-PKM" \
            --pr "${{ github.event.pull_request.number }}" \
            --action "${{ github.event.action }}"
