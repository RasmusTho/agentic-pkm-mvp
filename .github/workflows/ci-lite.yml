name: ci-lite
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          pip install -r dev-requirements.txt || true
          pip install -r requirements.txt || true
      - name: Run unit tests (fast)
        run: pytest -q
