---
name: ci-lite
on:
  workflow_dispatch:
permissions: read-all

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://app:app@localhost:5432/app
      PYTHONPATH: ${{ github.workspace }}
      STORE_BACKEND: memory
      LLM_PROVIDER: mock
      REASONING_PROVIDER: mock
      PLANNER_PROVIDER: mock
      REASONING_ENABLE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r dev-requirements.txt
          pip install -r requirements.txt
      - name: Upgrade database
        run: alembic upgrade head || true
      - name: Run unit tests (fast)
        shell: bash
        run: |
          set -o pipefail
          pytest -q -m "not alpha_llm" | tee pytest.log
      - name: Run fitness report
        run: |
          set -euo pipefail
          mkdir -p tmp
          python -m app.fitness.report | tee tmp/ci_summary.log

      - name: Verify CI gates
        run: |
          python - <<'PY
          from pathlib import Path
          from app.fitness.report import parse_summary_lines, SUMMARY_LABELS

          lines = Path("tmp/ci_summary.log").read_text(encoding="utf-8").splitlines()
          parsed = parse_summary_lines(lines, required=SUMMARY_LABELS)
          if set(parsed.keys()) != set(SUMMARY_LABELS):
              missing = set(SUMMARY_LABELS) - set(parsed.keys())
              extra = set(parsed.keys()) - set(SUMMARY_LABELS)
              raise SystemExit(f"Unexpected CI summary labels. Missing: {missing}, extra: {extra}")
          gates = parsed.get("GATES") or {}
          ok_status = str(gates.get("ok", "false")).lower()
          reasons = gates.get("reasons")
          print(f"CI gates status: {ok_status} reasons={reasons}")
          if ok_status != "true":
              raise SystemExit(f"CI gates failed: {gates}")
          PY

      - name: Upload unit test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-lite-pytest
          path: pytest.log
