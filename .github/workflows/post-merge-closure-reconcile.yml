name: Post-Merge Closure Reconciliation

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      cursor:
        description: 'Opaque bounded recovery cursor from the previous artifact'
        required: false
        type: string
      window_end:
        description: 'Reuse the prior artifact window end when resuming its cursor'
        required: false
        type: string

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect bounded closed-PR pages
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RECOVERY_CURSOR: ${{ inputs.cursor }}
          WINDOW_END_INPUT: ${{ inputs.window_end }}
        run: |
          mkdir -p post-merge-closure-recovery/pages
          MAX_PAGES=3
          MAX_ITEMS_PER_PAGE=100
          MAX_BACKOFF_ATTEMPTS=3
          START_PAGE="$(python3 - <<'PY'
          import base64
          import json
          import os

          cursor = os.environ.get("RECOVERY_CURSOR", "")
          try:
              payload = json.loads(base64.urlsafe_b64decode(cursor + "=" * (-len(cursor) % 4)))
              page = payload.get("page", 1)
              print(page if isinstance(page, int) and page > 0 else 1)
          except (ValueError, TypeError, UnicodeError, json.JSONDecodeError):
              print(1)
          PY
          )"
          REST_ATTEMPT=0
          fetch_page() {
            local output="$1"
            local query="$2"
            local attempt=0
            while [ "${attempt}" -lt "${MAX_BACKOFF_ATTEMPTS}" ]; do
              if gh api "${query}" > "${output}"; then
                REST_ATTEMPT="${attempt}"
                return 0
              fi
              attempt=$((attempt + 1))
              if [ "${attempt}" -lt "${MAX_BACKOFF_ATTEMPTS}" ]; then
                sleep_seconds=$((2 ** (attempt - 1)))
                sleep "${sleep_seconds}"
              fi
            done
            REST_ATTEMPT="${MAX_BACKOFF_ATTEMPTS}"
            return 1
          }
          for relative_page in $(seq 0 $((MAX_PAGES - 1))); do
            page=$((START_PAGE + relative_page))
            if ! fetch_page \
              "post-merge-closure-recovery/pages/${page}.json" \
              "repos/${REPOSITORY}/pulls?state=closed&sort=updated&direction=desc&per_page=${MAX_ITEMS_PER_PAGE}&page=${page}"; then
              break
            fi
            count="$(jq 'length' "post-merge-closure-recovery/pages/${page}.json")"
            if [ "${count}" -lt "${MAX_ITEMS_PER_PAGE}" ]; then
              break
            fi
          done
          export START_PAGE REST_ATTEMPT
          python3 - <<'PY'
          import json
          import os
          from dataclasses import asdict
          from datetime import datetime, timezone
          from pathlib import Path

          from scripts.post_merge_docs_classifier import classify

          pages = []
          for path in sorted(Path("post-merge-closure-recovery/pages").glob("*.json")):
              value = json.loads(path.read_text())
              pages.append(value if isinstance(value, list) else [])
          classifications = {}
          for page in pages:
              for pr in page:
                  if pr.get("merged_at") and pr.get("merge_commit_sha"):
                      result = classify(
                          pr=pr,
                          files_payload=[],
                          issue={},
                          comments_payload=[],
                          repository=os.environ["REPOSITORY"],
                      )
                      classifications[str(pr.get("number"))] = asdict(result)
          window_end = os.environ.get("WINDOW_END_INPUT") or datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z")
          payload = {
              "repository": os.environ["REPOSITORY"],
              "pages_start": int(os.environ.get("START_PAGE", "1")),
              "window_end": window_end,
              "window_start": None,
              "pages": pages,
              "classifications": classifications,
              "rest_attempt": int(os.environ.get("REST_ATTEMPT", "0")),
          }
          Path("post-merge-closure-recovery/input.json").write_text(
              json.dumps(payload, sort_keys=True) + "\n"
          )
          PY
      - name: Emit bounded recovery requests
        env:
          RECOVERY_CURSOR: ${{ inputs.cursor }}
        run: |
          args=(--input-json post-merge-closure-recovery/input.json --output-json post-merge-closure-recovery/result.json)
          if [ -n "${RECOVERY_CURSOR}" ]; then args+=(--cursor "${RECOVERY_CURSOR}"); fi
          python3 -m scripts.reconcile_post_merge_closure "${args[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: post-merge-closure-recovery-${{ github.run_id }}
          path: post-merge-closure-recovery/result.json
