name: Issue and PR Governance

on:
  issues:
    types: [opened, edited, reopened, labeled, unlabeled, closed]
  pull_request:
    types: [opened, edited, reopened, synchronize, review_requested]

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  issue-agent-labels:
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const labels = (issue.labels || []).map(label => label.name);
            const agentLabels = labels.filter(name => name.startsWith("agent:"));
            if (agentLabels.length > 1) {
              core.setFailed(`Issue must not carry more than one agent label at once: ${agentLabels.join(", ")}`);
              return;
            }
            if (issue.state === "closed" && agentLabels.length) {
              for (const name of agentLabels) {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  name,
                });
              }
            }

  issue-shape:
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body || "";
            const required = [
              "Context",
              "Scope",
              "Source Anchors",
              "Constraints",
              "Acceptance Criteria",
              "Out of Scope",
              "Suggested Validation",
              "Source Docs"
            ];
            const missing = required.filter(section => {
              const escaped = section.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
              const pattern = new RegExp(`^#{2,6}\\s+${escaped}\\s*$`, "m");
              return !pattern.test(body);
            });
            if (missing.length) {
              core.setFailed(`Issue is missing required sections: ${missing.join(', ')}`);
            }

  issue-source-anchors:
    if: github.event_name == 'issues' && (contains(github.event.issue.labels.*.name, 'agent:ready') || contains(github.event.issue.labels.*.name, 'agent:blocked'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Source Anchors
        run: |
          python3 scripts/validate_source_anchors.py "${{ github.event.issue.body }}"

  pr-contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { data: pullRequest } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
            });
            const body = pullRequest.body || "";
            const issueLinkPattern = /(Fixes|Closes|Resolves)\s+#\d+/i;
            if (issueLinkPattern.test(body)) {
              return;
            }
            const docsAuthoringPattern = /^\-\s+\[x\]\s+Docs authoring lane\b/im;
            const governanceLanePattern = /^\-\s+\[x\]\s+Governance lane\b/im;
            const isDocsAuthoring = docsAuthoringPattern.test(body);
            const isGovernanceLane = governanceLanePattern.test(body);
            if (!isDocsAuthoring && !isGovernanceLane) {
              core.setFailed("PRs must link a GitHub Issue using `Fixes #<id>`, `Closes #<id>`, or `Resolves #<id>` unless the PR is explicitly classified as `Docs authoring lane` or `Governance lane`.");
              return;
            }
            const docsAllowedExact = new Set([
              "AGENTS.md",
              "CLAUDE.md",
              ".codex/AGENTS.md",
              ".github/github-governance.yml",
              ".github/pull_request_template.md",
              ".github/workflows/issue-pr-governance.yml",
            ]);
            const docsAllowedPrefixes = [
              "docs/",
              ".github/ISSUE_TEMPLATE/",
            ];
            const governanceAllowedExact = new Set([
              "AGENTS.md",
              "CLAUDE.md",
              ".codex/AGENTS.md",
              ".github/github-governance.yml",
              ".github/pull_request_template.md",
              ".github/workflows/issue-pr-governance.yml",
              "Makefile",
              "scripts/docs_guard.py",
              "scripts/install_skills.sh",
              "scripts/reconcile_project_status.py",
              "scripts/validate_source_anchors.py",
              "tests/ops/test_project_status_reconcile.py",
            ]);
            const governanceAllowedPrefixes = [
              "docs/",
              ".github/ISSUE_TEMPLATE/",
              ".codex/skills/",
            ];
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100,
            });
            const changedFiles = files.map(file => file.filename);
            const allowedExact = isGovernanceLane ? governanceAllowedExact : docsAllowedExact;
            const allowedPrefixes = isGovernanceLane ? governanceAllowedPrefixes : docsAllowedPrefixes;
            const disallowed = changedFiles.filter(filename => {
              if (allowedExact.has(filename)) {
                return false;
              }
              return !allowedPrefixes.some(prefix => filename.startsWith(prefix));
            });
            if (disallowed.length) {
              core.setFailed(
                `${isGovernanceLane ? "Governance-lane" : "Docs-authoring"} PRs may only change approved surfaces. Disallowed files: ` +
                disallowed.join(", ")
              );
            }
