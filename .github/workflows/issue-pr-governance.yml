name: Issue and PR Governance

on:
  issues:
    types: [opened, edited, reopened]
  pull_request:
    types: [opened, edited, reopened, synchronize, review_requested]

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  issue-shape:
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body || "";
            const required = [
              "Context",
              "Scope",
              "Source Anchors",
              "Constraints",
              "Acceptance Criteria",
              "Out of Scope",
              "Suggested Validation",
              "Source Docs"
            ];
            const missing = required.filter(section => {
              const escaped = section.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
              const pattern = new RegExp(`^#{2,6}\\s+${escaped}\\s*$`, "m");
              return !pattern.test(body);
            });
            if (missing.length) {
              core.setFailed(`Issue is missing required sections: ${missing.join(', ')}`);
            }

  issue-source-anchors:
    if: github.event_name == 'issues' && (contains(github.event.issue.labels.*.name, 'agent:ready') || contains(github.event.issue.labels.*.name, 'agent:blocked'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Source Anchors
        run: |
          python3 scripts/validate_source_anchors.py "${{ github.event.issue.body }}"

  pr-contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { data: pullRequest } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
            });
            const body = pullRequest.body || "";
            const issueLinkPattern = /(Fixes|Closes|Resolves)\s+#\d+/i;
            if (issueLinkPattern.test(body)) {
              return;
            }
            const docsAuthoringPattern = /^\-\s+\[x\]\s+Docs authoring lane\b/im;
            if (!docsAuthoringPattern.test(body)) {
              core.setFailed("PRs must link a GitHub Issue using `Fixes #<id>`, `Closes #<id>`, or `Resolves #<id>` unless the PR is explicitly classified as `Docs authoring lane`.");
              return;
            }
            const allowedExact = new Set([
              "AGENTS.md",
              "CLAUDE.md",
              ".codex/AGENTS.md",
              ".github/github-governance.yml",
              ".github/pull_request_template.md",
              ".github/workflows/issue-pr-governance.yml",
            ]);
            const allowedPrefixes = [
              "docs/",
              ".github/ISSUE_TEMPLATE/",
            ];
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100,
            });
            const changedFiles = files.map(file => file.filename);
            const disallowed = changedFiles.filter(filename => {
              if (allowedExact.has(filename)) {
                return false;
              }
              return !allowedPrefixes.some(prefix => filename.startsWith(prefix));
            });
            if (disallowed.length) {
              core.setFailed(
                "Docs-authoring PRs may only change approved docs-authoring surfaces. Disallowed files: " +
                disallowed.join(", ")
              );
            }
