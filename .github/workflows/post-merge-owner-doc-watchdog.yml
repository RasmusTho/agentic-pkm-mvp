name: Post-Merge Owner Doc Watchdog

on:
  pull_request:
    types: [closed]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  check-receipt:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const crypto = require("crypto");
            const prNumber = context.payload.pull_request.number;
            const repository = `${context.repo.owner}/${context.repo.repo}`;
            const NUDGE_PREFIX = "post-merge owner-doc watchdog:";

            // owner-doc-watchdog-helpers:start
            const resolveIssueAuthority = (candidateBody) => {
              if (typeof candidateBody !== "string" || /\r(?!\n)|[\u2028\u2029]/.test(candidateBody)) {
                return null;
              }
              const canonicalBody = candidateBody.replace(/\r\n/g, "\n");
              const governingKeyword = "[Gg][Oo][Vv][Ee][Rr][Nn][Ii][Nn][Gg]-[Ii][Ss][Ss][Uu][Ee]";
              const closingKeyword = "(?:[Ff][Ii][Xx](?:[Ee][Ss]|[Ee][Dd])?|[Cc][Ll][Oo][Ss][Ee](?:[Ss]|[Dd])?|[Rr][Ee][Ss][Oo][Ll][Vv][Ee](?:[Ss]|[Dd])?)";
              const issueTokenPrefix = "(?:^|[^0-9A-Za-z_])";
              const issueTokenTerminator = "(?=$|[ \\t\\r\\n.,;:)\\]}])";
              const asciiClosingSeparator = "(?:[ \\t]+|[ \\t]*:[ \\t]*)";
              const explicitWhitespace = "[ \\t\\n\\v\\f\\r\\x85\\u00a0\\u1680\\u2000-\\u200a\\u2028\\u2029\\u202f\\u205f\\u3000\\ufeff]";
              const closingAttemptSeparator = `(?:${explicitWhitespace}+|${explicitWhitespace}*:${explicitWhitespace}*)`;
              const githubIssueUrlTarget = "[Hh][Tt][Tt][Pp][Ss]?://[Gg][Ii][Tt][Hh][Uu][Bb][.][Cc][Oo][Mm]/[0-9A-Za-z_.-]+/[0-9A-Za-z_.-]+/[Ii][Ss][Ss][Uu][Ee][Ss]/";
              const closingAttemptTarget = `(?:#|[0-9A-Za-z_.-]+/[0-9A-Za-z_.-]+#|${githubIssueUrlTarget})`;
              const governingLines = canonicalBody.match(
                new RegExp(`^[ \\t]*${governingKeyword}[ \\t]*:.*$`, "gm")
              ) || [];
              const exactGoverning = [...canonicalBody.matchAll(
                new RegExp(`^[ \\t]*${governingKeyword}:[ \\t]*#([1-9][0-9]*)[ \\t]*$`, "gm")
              )];
              const closingMentions = canonicalBody.match(
                new RegExp(`${issueTokenPrefix}${closingKeyword}${closingAttemptSeparator}${closingAttemptTarget}`, "gm")
              ) || [];
              const closingMatches = canonicalBody.match(
                new RegExp(`${issueTokenPrefix}${closingKeyword}${asciiClosingSeparator}#[1-9][0-9]*${issueTokenTerminator}`, "gm")
              ) || [];
              const refsMatches = canonicalBody.match(
                new RegExp(`${issueTokenPrefix}[Rr][Ee][Ff][Ss][ \\t]+#[1-9][0-9]*${issueTokenTerminator}`, "gm")
              ) || [];
              const neutralizedLines = canonicalBody.match(
                /^[ \t]*Verified-Closing-Issues[ \t]*:.*$/gm
              ) || [];
              const exactNeutralized = canonicalBody.match(
                /^[ \t]*Verified-Closing-Issues:[ \t]*#[1-9][0-9]*(?:,[ \t]*#[1-9][0-9]*)*[ \t]*$/gm
              ) || [];
              if (governingLines.length !== 1 || exactGoverning.length !== 1) return null;
              const governingIssue = Number(exactGoverning[0][1]);
              const issueNumber = match => {
                const token = match.match(/#([1-9][0-9]*)(?=$|[ \t\r\n.,;:)\]}])/);
                return token ? Number(token[1]) : 0;
              };
              const supportingIssues = [...new Set(
                [...closingMatches, ...refsMatches]
                  .map(issueNumber)
                  .filter(number => number > 0 && number !== governingIssue)
              )].sort((a, b) => a - b);
              const canonicalClosing = [...new Set(closingMatches.map(issueNumber))]
                .filter(number => number > 0)
                .sort((a, b) => a - b);
              const neutralizedClosing = exactNeutralized.length === 1
                ? exactNeutralized[0]
                    .split(":", 2)[1]
                    .split(",")
                    .map(token => Number(token.trim().slice(1)))
                : [];
              const canonicalValid =
                neutralizedLines.length === 0 &&
                closingMatches.length > 0 &&
                closingMentions.length === closingMatches.length &&
                canonicalClosing.length <= 10;
              const referenced = new Set([governingIssue, ...supportingIssues]);
              const neutralizedValid =
                closingMentions.length === 0 &&
                neutralizedLines.length === 1 &&
                exactNeutralized.length === 1 &&
                neutralizedClosing.length > 0 &&
                neutralizedClosing.length <= 10 &&
                new Set(neutralizedClosing).size === neutralizedClosing.length &&
                neutralizedClosing.every((number, index) =>
                  Number.isInteger(number) && number > 0 &&
                  (index === 0 || neutralizedClosing[index - 1] < number) &&
                  referenced.has(number)
                );
              if (!canonicalValid && !neutralizedValid) return null;
              return {
                governing_issue: governingIssue,
                closing_issues: canonicalValid ? canonicalClosing : neutralizedClosing,
                supporting_issues: supportingIssues,
                mode: canonicalValid ? "canonical" : "neutralized",
              };
            };

            const resolveGoverningIssue = candidateBody => {
              if (typeof candidateBody !== "string" || /\r(?!\n)|[\u2028\u2029]/.test(candidateBody)) {
                return null;
              }
              const canonicalBody = candidateBody.replace(/\r\n/g, "\n");
              const keyword = "[Gg][Oo][Vv][Ee][Rr][Nn][Ii][Nn][Gg]-[Ii][Ss][Ss][Uu][Ee]";
              const lines = canonicalBody.match(new RegExp(`^[ \\t]*${keyword}[ \\t]*:.*$`, "gm")) || [];
              const exact = [...canonicalBody.matchAll(
                new RegExp(`^[ \\t]*${keyword}:[ \\t]*#([1-9][0-9]*)[ \\t]*$`, "gm")
              )];
              return lines.length === 1 && exact.length === 1 ? Number(exact[0][1]) : null;
            };

            const bodySha256 = (body) => crypto.createHash("sha256").update(body, "utf8").digest("hex");

            const resolveAuthorityReceipt = (comments, livePr, expectedRepository) => {
              const trusted = new Set(["OWNER", "MEMBER", "COLLABORATOR"]);
              const liveAuthority = resolveIssueAuthority(livePr.body || "");
              const digest = bodySha256(livePr.body || "");
              const arraysEqual = (left, right) =>
                left.length === right.length && left.every((value, index) => value === right[index]);
              const receipts = [];
              for (const comment of comments) {
                if (!trusted.has(comment.author_association) || typeof comment.body !== "string") continue;
                const match = comment.body.match(
                  /verified issue-set merge authority:\s*```json\s*([\s\S]*?)\s*```/m
                );
                if (!match) continue;
                let receipt;
                try { receipt = JSON.parse(match[1]); } catch { continue; }
                const closing = receipt.closing_issues;
                const supporting = receipt.authenticated_supporting_issues;
                const liveSupporting = receipt.live_supporting_issues;
                if (
                  receipt.contract !== "verified_issue_set_merge_authority.v1" ||
                  receipt.repository !== expectedRepository ||
                  receipt.pr_number !== livePr.number ||
                  receipt.head_sha !== livePr.head.sha ||
                  liveAuthority === null ||
                  liveAuthority.governing_issue !== receipt.governing_issue ||
                  !Array.isArray(closing) || closing.length === 0 || closing.length > 10 ||
                  closing.some(n => !Number.isInteger(n) || n <= 0) ||
                  new Set(closing).size !== closing.length ||
                  closing.some((n, index) => index > 0 && closing[index - 1] >= n) ||
                  !Array.isArray(supporting) ||
                  supporting.some(n => !Number.isInteger(n) || n <= 0) ||
                  new Set(supporting).size !== supporting.length ||
                  supporting.some((n, index) => index > 0 && supporting[index - 1] >= n) ||
                  !Array.isArray(liveSupporting) ||
                  liveSupporting.some(n => !Number.isInteger(n) || n <= 0) ||
                  new Set(liveSupporting).size !== liveSupporting.length ||
                  liveSupporting.some((n, index) => index > 0 && liveSupporting[index - 1] >= n) ||
                  !arraysEqual(closing, liveAuthority.closing_issues) ||
                  !arraysEqual(liveSupporting, liveAuthority.supporting_issues) ||
                  supporting.some(n => !liveSupporting.includes(n)) ||
                  closing.some(n => n !== receipt.governing_issue && !supporting.includes(n)) ||
                  ![receipt.body_sha256, receipt.neutralized_body_sha256].includes(digest) ||
                  typeof receipt.run_id !== "string" || receipt.run_id.length === 0 ||
                  typeof receipt.repair_budget !== "object" || receipt.repair_budget === null
                ) continue;
                receipts.push(receipt);
              }
              if (receipts.length === 0) return null;
              const authorityKey = receipt => JSON.stringify([
                receipt.contract,
                receipt.repository,
                receipt.pr_number,
                receipt.head_sha,
                receipt.body_sha256,
                receipt.neutralized_body_sha256,
                receipt.governing_issue,
                receipt.closing_issues,
                receipt.authenticated_supporting_issues,
                receipt.live_supporting_issues,
                receipt.run_id,
              ]);
              const keys = new Set(receipts.map(authorityKey));
              return keys.size === 1 ? receipts[receipts.length - 1] : null;
            };

            const receiptTargets = ({closingIssues, governingIssue, governingState}) => {
              const targets = new Set(closingIssues);
              if (
                Number.isInteger(governingIssue) && governingIssue > 0 &&
                !targets.has(governingIssue) && governingState === "open"
              ) targets.add(governingIssue);
              return [...targets].sort((a, b) => a - b);
            };

            const hasReceiptForPr = (comments, number) => {
              const prefix = `post-merge owner-doc check: PR #${number};`;
              return comments.some(comment =>
                typeof comment.body === "string" &&
                comment.body.split(/\r?\n/).some(line => line.startsWith(prefix))
              );
            };
            // owner-doc-watchdog-helpers:end

            const { data: livePr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });
            const prComments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });

            let linkedIssues = [];
            let cursor = null;
            do {
              const result = await github.graphql(`
                query($owner: String!, $repo: String!, $pr: Int!, $cursor: String) {
                  repository(owner: $owner, name: $repo) {
                    pullRequest(number: $pr) {
                      closingIssuesReferences(first: 100, after: $cursor) {
                        nodes { number }
                        pageInfo { hasNextPage endCursor }
                      }
                    }
                  }
                }
              `, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pr: prNumber,
                cursor,
              });
              const conn = result.repository.pullRequest.closingIssuesReferences;
              linkedIssues = linkedIssues.concat(conn.nodes.map(node => node.number));
              cursor = conn.pageInfo.hasNextPage ? conn.pageInfo.endCursor : null;
            } while (cursor !== null);
            linkedIssues = [...new Set(linkedIssues)].sort((a, b) => a - b);

            const authorityReceipt = resolveAuthorityReceipt(prComments, livePr, repository);
            const liveAuthority = resolveIssueAuthority(livePr.body || "");
            const canonicalLiveAuthority = liveAuthority?.mode === "canonical" ? liveAuthority : null;
            const authoritativeClosing = authorityReceipt
              ? authorityReceipt.closing_issues
              : (canonicalLiveAuthority ? canonicalLiveAuthority.closing_issues : linkedIssues);
            const governingIssue = authorityReceipt
              ? authorityReceipt.governing_issue
              : (canonicalLiveAuthority ? canonicalLiveAuthority.governing_issue : null);
            let governingState = null;
            if (governingIssue && !authoritativeClosing.includes(governingIssue)) {
              const { data: governing } = await github.rest.issues.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: governingIssue,
              });
              governingState = governing.state;
            }
            const targets = receiptTargets({
              closingIssues: authoritativeClosing,
              governingIssue,
              governingState,
            });

            const NUDGE = `${NUDGE_PREFIX} check not yet run for PR #${prNumber}.\n\nInvoke \`$post-merge-owner-doc\` on PR #${prNumber} to complete the delivery feedback loop. The skill must leave a PR-specific receipt on every authenticated closed issue and on a distinct open governing parent; issue-free lanes use the PR thread.`;

            if (targets.length === 0) {
              if (!hasReceiptForPr(prComments, prNumber)) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: prNumber,
                  body: NUDGE,
                });
              }
              return;
            }

            for (const issueNumber of targets) {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
              });
              if (!hasReceiptForPr(comments, prNumber)) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  body: NUDGE,
                });
              }
            }
