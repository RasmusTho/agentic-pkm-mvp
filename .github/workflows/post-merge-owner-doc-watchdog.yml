name: Post-Merge Owner Doc Watchdog

on:
  pull_request:
    types: [closed]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  check-receipt:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const crypto = require("crypto");
            const prNumber = context.payload.pull_request.number;
            const repository = `${context.repo.owner}/${context.repo.repo}`;
            const NUDGE_PREFIX = "post-merge owner-doc watchdog:";

            // owner-doc-watchdog-helpers:start
            const resolveIssueAuthority = (candidateBody) => {
              if (typeof candidateBody !== "string" || /\r(?!\n)|[\u2028\u2029]/.test(candidateBody)) {
                return null;
              }
              const canonicalBody = candidateBody.replace(/\r\n/g, "\n");
              const governingKeyword = "[Gg][Oo][Vv][Ee][Rr][Nn][Ii][Nn][Gg]-[Ii][Ss][Ss][Uu][Ee]";
              const closingKeyword = "(?:[Ff][Ii][Xx](?:[Ee][Ss]|[Ee][Dd])?|[Cc][Ll][Oo][Ss][Ee](?:[Ss]|[Dd])?|[Rr][Ee][Ss][Oo][Ll][Vv][Ee](?:[Ss]|[Dd])?)";
              const issueTokenPrefix = "(?:^|[^0-9A-Za-z_])";
              const issueTokenTerminator = "(?=$|[ \\t\\r\\n.,;:)\\]}])";
              const asciiClosingSeparator = "(?:[ \\t]+|[ \\t]*:[ \\t]*)";
              const explicitWhitespace = "[ \\t\\n\\v\\f\\r\\x85\\u00a0\\u1680\\u2000-\\u200a\\u2028\\u2029\\u202f\\u205f\\u3000\\ufeff]";
              const closingAttemptSeparator = `(?:${explicitWhitespace}+|${explicitWhitespace}*:${explicitWhitespace}*)`;
              const githubIssueUrlTarget = "[Hh][Tt][Tt][Pp][Ss]?://[Gg][Ii][Tt][Hh][Uu][Bb][.][Cc][Oo][Mm]/[0-9A-Za-z_.-]+/[0-9A-Za-z_.-]+/[Ii][Ss][Ss][Uu][Ee][Ss]/";
              const closingAttemptTarget = `(?:#|[0-9A-Za-z_.-]+/[0-9A-Za-z_.-]+#|${githubIssueUrlTarget})`;
              const governingLines = canonicalBody.match(
                new RegExp(`^[ \\t]*${governingKeyword}[ \\t]*:.*$`, "gm")
              ) || [];
              const exactGoverning = [...canonicalBody.matchAll(
                new RegExp(`^[ \\t]*${governingKeyword}:[ \\t]*#([1-9][0-9]*)[ \\t]*$`, "gm")
              )];
              const closingMentions = canonicalBody.match(
                new RegExp(`${issueTokenPrefix}${closingKeyword}${closingAttemptSeparator}${closingAttemptTarget}`, "gm")
              ) || [];
              const closingMatches = canonicalBody.match(
                new RegExp(`${issueTokenPrefix}${closingKeyword}${asciiClosingSeparator}#[1-9][0-9]*${issueTokenTerminator}`, "gm")
              ) || [];
              const refsMatches = canonicalBody.match(
                new RegExp(`${issueTokenPrefix}[Rr][Ee][Ff][Ss][ \\t]+#[1-9][0-9]*${issueTokenTerminator}`, "gm")
              ) || [];
              const neutralizedLines = canonicalBody.match(
                /^[ \t]*Verified-Closing-Issues[ \t]*:.*$/gm
              ) || [];
              const exactNeutralized = canonicalBody.match(
                /^[ \t]*Verified-Closing-Issues:[ \t]*#[1-9][0-9]*(?:,[ \t]*#[1-9][0-9]*)*[ \t]*$/gm
              ) || [];
              if (governingLines.length !== 1 || exactGoverning.length !== 1) return null;
              const governingIssue = Number(exactGoverning[0][1]);
              const issueNumber = match => {
                const token = match.match(/#([1-9][0-9]*)(?=$|[ \t\r\n.,;:)\]}])/);
                return token ? Number(token[1]) : 0;
              };
              const supportingIssues = [...new Set(
                [...closingMatches, ...refsMatches]
                  .map(issueNumber)
                  .filter(number => number > 0 && number !== governingIssue)
              )].sort((a, b) => a - b);
              const canonicalClosing = [...new Set(closingMatches.map(issueNumber))]
                .filter(number => number > 0)
                .sort((a, b) => a - b);
              const neutralizedClosing = exactNeutralized.length === 1
                ? exactNeutralized[0]
                    .split(":", 2)[1]
                    .split(",")
                    .map(token => Number(token.trim().slice(1)))
                : [];
              const canonicalValid =
                neutralizedLines.length === 0 &&
                closingMatches.length > 0 &&
                closingMentions.length === closingMatches.length &&
                canonicalClosing.length <= 10;
              const referenced = new Set([governingIssue, ...supportingIssues]);
              const neutralizedValid =
                closingMentions.length === 0 &&
                neutralizedLines.length === 1 &&
                exactNeutralized.length === 1 &&
                neutralizedClosing.length > 0 &&
                neutralizedClosing.length <= 10 &&
                new Set(neutralizedClosing).size === neutralizedClosing.length &&
                neutralizedClosing.every((number, index) =>
                  Number.isInteger(number) && number > 0 &&
                  (index === 0 || neutralizedClosing[index - 1] < number) &&
                  referenced.has(number)
                );
              if (!canonicalValid && !neutralizedValid) return null;
              return {
                governing_issue: governingIssue,
                closing_issues: canonicalValid ? canonicalClosing : neutralizedClosing,
                supporting_issues: supportingIssues,
                mode: canonicalValid ? "canonical" : "neutralized",
              };
            };

            const resolveGoverningIssue = candidateBody => {
              if (typeof candidateBody !== "string" || /\r(?!\n)|[\u2028\u2029]/.test(candidateBody)) {
                return null;
              }
              const canonicalBody = candidateBody.replace(/\r\n/g, "\n");
              const keyword = "[Gg][Oo][Vv][Ee][Rr][Nn][Ii][Nn][Gg]-[Ii][Ss][Ss][Uu][Ee]";
              const lines = canonicalBody.match(new RegExp(`^[ \\t]*${keyword}[ \\t]*:.*$`, "gm")) || [];
              const exact = [...canonicalBody.matchAll(
                new RegExp(`^[ \\t]*${keyword}:[ \\t]*#([1-9][0-9]*)[ \\t]*$`, "gm")
              )];
              return lines.length === 1 && exact.length === 1 ? Number(exact[0][1]) : null;
            };

            const sha256 = value => crypto.createHash("sha256").update(value, "utf8").digest("hex");
            const bodySha256 = body => {
              const canonicalBody = body.endsWith("\n") ? body.slice(0, -1) : body;
              return sha256(canonicalBody);
            };

            const TRUSTED_ASSOCIATIONS = new Set(["OWNER", "MEMBER", "COLLABORATOR"]);
            const AUTHORITY_MARKER = "verified issue-set merge authority:";
            const CONVERGENCE_MARKER = "verified merge closing projection convergence:";
            const PHASE_MARKER = "verified issue-set merge phase:";
            const PHASES = ["prepared", "merged", "reconciled", "restored"];
            const AUTHORITY_FIELDS = [
              "authenticated_supporting_issues", "body_sha256", "closing_issues", "contract",
              "governing_issue", "head_sha", "live_supporting_issues", "neutralized_body_sha256",
              "pr_number", "repair_budget", "repository", "run_id",
            ].sort();
            const PHASE_FIELDS = [
              "authority_sha256", "body_sha256", "closed_issues", "contract",
              "final_projection_observation_sha256", "head_sha", "merge_commit_sha", "phase",
              "pr_number", "projection_convergence_sha256", "reopened_unauthorized_issues",
              "repository", "run_id",
            ].sort();
            const CONVERGENCE_FIELDS = [
              "authority_sha256", "base_ref", "body_edit", "contract",
              "default_branch_sha", "final_projection_observation", "head_sha", "head_ref",
              "neutralized_body_sha256", "observation_policy", "observations", "pr_contract",
              "pr_number", "pull_request_node_id", "receipt_sha256", "repository", "run_id", "title",
            ].sort();
            const PR_CONTRACT_FIELDS = [
              "authority_sha256", "base_ref", "body_edit", "check_run_id", "check_suite_id",
              "completed_at", "conclusion", "created_at", "default_branch", "default_branch_sha",
              "event", "head_ref", "head_sha", "name", "neutralized_body_sha256", "pr_number",
              "pull_request_node_id", "repository", "started_at", "status", "title", "workflow_run_id",
            ].sort();
            const CONVERGENCE_OBSERVATION_FIELDS = [
              "base_ref", "closing_issues", "default_branch_sha", "head_ref", "latest_body_edit",
              "neutralized_body_sha256", "observed_at", "pull_request_node_id", "rate_limit",
              "snapshot_sha256", "title",
            ].sort();
            const RAW_OBSERVATION_FIELDS = [
              "errors", "observed_at", "pull_request", "rate_limit", "repository",
            ].sort();
            const RAW_REPOSITORY_FIELDS = [
              "default_branch", "default_branch_sha", "name_with_owner",
            ].sort();
            const RAW_PULL_FIELDS = [
              "base_ref", "body", "body_edits_page_info", "closing_issues",
              "closing_issues_page_info", "draft", "head_ref", "head_sha", "last_edited_at",
              "latest_body_edit", "node_id", "number", "state", "title",
            ].sort();

            const arraysEqual = (left, right) =>
              left.length === right.length && left.every((value, index) => value === right[index]);
            const hasExactFields = (value, fields) =>
              value !== null && typeof value === "object" && !Array.isArray(value) &&
              arraysEqual(Object.keys(value).sort(), fields);
            const isSortedIssueArray = (value, {allowEmpty = true, maximum = null} = {}) =>
              Array.isArray(value) && (allowEmpty || value.length > 0) &&
              (maximum === null || value.length <= maximum) &&
              value.every((number, index) =>
                Number.isInteger(number) && number > 0 &&
                (index === 0 || value[index - 1] < number)
              );
            const canonicalJson = value => {
              if (Array.isArray(value)) return `[${value.map(canonicalJson).join(",")}]`;
              if (value !== null && typeof value === "object") {
                return `{${Object.keys(value).sort().map(key =>
                  `${JSON.stringify(key)}:${canonicalJson(value[key])}`
                ).join(",")}}`;
              }
              return JSON.stringify(value);
            };
            const canonicalSha256 = value => sha256(canonicalJson(value));
            const LEGACY_TERMINAL_LF_CUTOFF = Date.parse("2026-07-21T16:32:11Z");
            const canonicalUtcInstant = value => {
              if (
                typeof value !== "string" ||
                !/^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$/.test(value) ||
                value.startsWith("0000-")
              ) return null;
              const instant = Date.parse(value);
              return Number.isFinite(instant) &&
                new Date(instant).toISOString() === `${value.slice(0, -1)}.000Z`
                ? instant
                : null;
            };
            const legacyAuthorityEligible = comment => {
              const created = canonicalUtcInstant(comment.created_at);
              const updated = canonicalUtcInstant(comment.updated_at);
              return created !== null && updated !== null &&
                created <= updated &&
                created < LEGACY_TERMINAL_LF_CUTOFF && updated < LEGACY_TERMINAL_LF_CUTOFF;
            };
            const rawTerminalLfDigest = body => sha256(`${body}\n`);
            const matchesStoredBodyDigest = (body, storedDigest, {allowLegacy = false} = {}) => {
              if (typeof storedDigest !== "string" || !/^[0-9a-f]{64}$/.test(storedDigest)) return false;
              if (bodySha256(body) === storedDigest) return true;
              return allowLegacy && !body.endsWith("\n") && !body.includes("\r") &&
                rawTerminalLfDigest(body) === storedDigest;
            };
            const commentReceipts = (comments, marker) => {
              const escaped = marker.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
              const pattern = new RegExp(
                `${escaped}[\\t ]*\\r?\\n(?<fence>\`{3,})json[\\t ]*\\r?\\n` +
                `(?<payload>[\\s\\S]*?)\\r?\\n\\k<fence>(?!\`)`,
                "gm"
              );
              const receipts = [];
              for (const comment of comments) {
                if (!TRUSTED_ASSOCIATIONS.has(comment.author_association) || typeof comment.body !== "string") continue;
                const matches = [...comment.body.matchAll(pattern)];
                if (matches.length !== 1) continue;
                let receipt;
                try { receipt = JSON.parse(matches[0].groups.payload); } catch { continue; }
                if (receipt !== null && typeof receipt === "object" && !Array.isArray(receipt)) {
                  receipts.push(receipt);
                }
              }
              return receipts;
            };
            const structuralMarkerOccurrences = (body, marker) => {
              const escaped = marker.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
              const outsideFences = body.replace(/```[^\r\n]*\r?\n[\s\S]*?```/g, "");
              return [...outsideFences.matchAll(
                new RegExp(`^${escaped}[\\t ]*(?:\\r?\\n|$)`, "gm")
              )].length;
            };
            const hasClosingIssueAttempt = candidate =>
              typeof candidate === "string" &&
              /(?:^|[^0-9A-Za-z_])(?:fix(?:es|ed)?|close(?:s|d)?|resolve(?:s|d)?)(?:[ \t\n\v\f\r\x85\u00a0\u1680\u2000-\u200a\u2028\u2029\u202f\u205f\u3000\ufeff]+|[ \t\n\v\f\r\x85\u00a0\u1680\u2000-\u200a\u2028\u2029\u202f\u205f\u3000\ufeff]*:[ \t\n\v\f\r\x85\u00a0\u1680\u2000-\u200a\u2028\u2029\u202f\u205f\u3000\ufeff]*)(?:#|[0-9A-Za-z_.-]+\/[0-9A-Za-z_.-]+#|https?:\/\/github\.com\/[0-9A-Za-z_.-]+\/[0-9A-Za-z_.-]+\/issues\/)/i.test(candidate);
            const hasTrustedAuthorityAttempt = comments => comments.some(comment =>
              TRUSTED_ASSOCIATIONS.has(comment.author_association) &&
              typeof comment.body === "string" && comment.body.includes(AUTHORITY_MARKER)
            );
            const hasCompleteMergedIdentity = livePr =>
              livePr.state === "closed" && livePr.merged === true &&
              canonicalUtcInstant(livePr.merged_at) !== null &&
              typeof livePr.merge_commit_sha === "string" && /^[0-9a-f]{40}$/.test(livePr.merge_commit_sha);

            const validAuthorityReceipt = (
              receipt, livePr, expectedRepository,
              {requireLiveBody = true, allowLegacy = false} = {}
            ) => {
              const closing = receipt.closing_issues;
              const supporting = receipt.authenticated_supporting_issues;
              const liveSupporting = receipt.live_supporting_issues;
              const liveAuthority = resolveIssueAuthority(livePr.body || "");
              if (
                !hasExactFields(receipt, AUTHORITY_FIELDS) ||
                receipt.contract !== "verified_issue_set_merge_authority.v1" ||
                receipt.repository !== expectedRepository || receipt.pr_number !== livePr.number ||
                receipt.head_sha !== livePr.head?.sha ||
                typeof receipt.head_sha !== "string" || !/^[0-9a-f]{40}$/.test(receipt.head_sha) ||
                typeof receipt.run_id !== "string" || receipt.run_id.length === 0 ||
                receipt.repair_budget === null || typeof receipt.repair_budget !== "object" ||
                Array.isArray(receipt.repair_budget) ||
                !Number.isInteger(receipt.governing_issue) || receipt.governing_issue <= 0 ||
                !isSortedIssueArray(closing, {allowEmpty: false, maximum: 10}) ||
                !isSortedIssueArray(supporting) || !isSortedIssueArray(liveSupporting) ||
                supporting.some(number => !liveSupporting.includes(number)) ||
                closing.some(number =>
                  number !== receipt.governing_issue && !supporting.includes(number)
                ) ||
                typeof receipt.body_sha256 !== "string" || !/^[0-9a-f]{64}$/.test(receipt.body_sha256) ||
                typeof receipt.neutralized_body_sha256 !== "string" ||
                !/^[0-9a-f]{64}$/.test(receipt.neutralized_body_sha256) ||
                receipt.body_sha256 === receipt.neutralized_body_sha256
              ) return false;
              if (!requireLiveBody) return true;
              return liveAuthority !== null &&
                liveAuthority.governing_issue === receipt.governing_issue &&
                arraysEqual(closing, liveAuthority.closing_issues) &&
                arraysEqual(liveSupporting, liveAuthority.supporting_issues) &&
                supporting.every(number => liveAuthority.supporting_issues.includes(number)) &&
                [receipt.body_sha256, receipt.neutralized_body_sha256]
                  .some(storedDigest => matchesStoredBodyDigest(
                    livePr.body || "", storedDigest, {allowLegacy}
                  ));
            };

            const validRateLimit = rateLimit =>
              hasExactFields(rateLimit, ["cost", "kill_switch_active", "remaining", "reset_at"].sort()) &&
              Number.isInteger(rateLimit.cost) && rateLimit.cost >= 0 &&
              rateLimit.kill_switch_active === false &&
              Number.isInteger(rateLimit.remaining) && rateLimit.remaining >= 0 &&
              canonicalUtcInstant(rateLimit.reset_at) !== null;

            const validDurableFinalObservation = (observation, receipt, authorityReceipt, {allowLegacy = false} = {}) => {
              if (!hasExactFields(observation, RAW_OBSERVATION_FIELDS) ||
                  !Array.isArray(observation.errors) || !arraysEqual(observation.errors, []) ||
                  !validRateLimit(observation.rate_limit) ||
                  !hasExactFields(observation.repository, RAW_REPOSITORY_FIELDS) ||
                  !hasExactFields(observation.pull_request, RAW_PULL_FIELDS)) return false;
              const repository = observation.repository;
              const pull = observation.pull_request;
              const observedAt = canonicalUtcInstant(observation.observed_at);
              const quorumAt = canonicalUtcInstant(receipt.observations?.[1]?.observed_at);
              return observedAt !== null && quorumAt !== null && observedAt > quorumAt &&
                repository.name_with_owner === authorityReceipt.repository &&
                repository.default_branch === "main" &&
                repository.default_branch_sha === receipt.default_branch_sha &&
                pull.node_id === receipt.pull_request_node_id && pull.number === authorityReceipt.pr_number &&
                pull.head_sha === authorityReceipt.head_sha && pull.head_ref === receipt.head_ref &&
                pull.base_ref === receipt.base_ref && pull.state === "OPEN" && pull.draft === false &&
                pull.title === receipt.title && pull.latest_body_edit !== null &&
                canonicalJson(pull.latest_body_edit) === canonicalJson(receipt.body_edit) &&
                pull.last_edited_at === receipt.body_edit.edited_at &&
                TRUSTED_ASSOCIATIONS.has(pull.latest_body_edit.editor_association) &&
                hasExactFields(pull.body_edits_page_info, ["has_next_page"]) &&
                typeof pull.body_edits_page_info.has_next_page === "boolean" &&
                Array.isArray(pull.closing_issues) && arraysEqual(pull.closing_issues, []) &&
                hasExactFields(pull.closing_issues_page_info, ["has_next_page"]) &&
                pull.closing_issues_page_info.has_next_page === false &&
                typeof pull.body === "string" &&
                matchesStoredBodyDigest(pull.body, authorityReceipt.neutralized_body_sha256, {allowLegacy});
            };

            const validProjectionPrContract = (contract, receipt, authorityReceipt) => {
              const bodyEdit = contract?.body_edit;
              return hasExactFields(contract, PR_CONTRACT_FIELDS) &&
                contract.name === "pr-contract" && contract.status === "completed" &&
                contract.conclusion === "success" && contract.event === "pull_request" &&
                contract.authority_sha256 === receipt.authority_sha256 &&
                contract.neutralized_body_sha256 === receipt.neutralized_body_sha256 &&
                contract.repository === receipt.repository && contract.pr_number === receipt.pr_number &&
                contract.pull_request_node_id === receipt.pull_request_node_id &&
                contract.head_sha === receipt.head_sha && contract.head_ref === receipt.head_ref &&
                contract.base_ref === receipt.base_ref && contract.title === receipt.title &&
                contract.default_branch === "main" && contract.default_branch_sha === receipt.default_branch_sha &&
                Number.isInteger(contract.workflow_run_id) && contract.workflow_run_id > 0 &&
                Number.isInteger(contract.check_run_id) && contract.check_run_id > 0 &&
                Number.isInteger(contract.check_suite_id) && contract.check_suite_id > 0 &&
                typeof contract.pull_request_node_id === "string" && contract.pull_request_node_id.length > 0 &&
                typeof contract.head_ref === "string" && contract.head_ref.length > 0 &&
                typeof contract.default_branch_sha === "string" && /^[0-9a-f]{40}$/.test(contract.default_branch_sha) &&
                typeof contract.title === "string" && contract.title.length > 0 &&
                !hasClosingIssueAttempt(contract.title) &&
                hasExactFields(bodyEdit, ["edited_at", "editor_association", "editor_login", "node_id"].sort()) &&
                TRUSTED_ASSOCIATIONS.has(bodyEdit.editor_association) &&
                typeof bodyEdit.node_id === "string" && bodyEdit.node_id.length > 0 &&
                typeof bodyEdit.editor_login === "string" && bodyEdit.editor_login.length > 0 &&
                canonicalJson(bodyEdit) === canonicalJson(receipt.body_edit);
            };

            const validConvergenceReceipt = (receipt, authorityReceipt, {allowLegacy = false} = {}) => {
              if (!hasExactFields(receipt, CONVERGENCE_FIELDS)) return false;
              const digestInput = {...receipt};
              delete digestInput.receipt_sha256;
              const policy = receipt.observation_policy;
              const contract = receipt.pr_contract;
              const observations = receipt.observations;
              if (receipt.contract !== "verified-merge-closing-projection-convergence.v1" ||
                  typeof receipt.receipt_sha256 !== "string" ||
                  !/^[0-9a-f]{64}$/.test(receipt.receipt_sha256) ||
                  canonicalSha256(digestInput) !== receipt.receipt_sha256 ||
                  receipt.authority_sha256 !== canonicalSha256(authorityReceipt) ||
                  receipt.repository !== authorityReceipt.repository ||
                  receipt.pr_number !== authorityReceipt.pr_number ||
                  receipt.head_sha !== authorityReceipt.head_sha || receipt.run_id !== authorityReceipt.run_id ||
                  receipt.neutralized_body_sha256 !== authorityReceipt.neutralized_body_sha256 ||
                  receipt.base_ref !== "main" || typeof receipt.head_ref !== "string" || !receipt.head_ref ||
                  !hasExactFields(policy, ["minimum_backoff_seconds", "required_empty_observations"].sort()) ||
                  !Number.isInteger(policy.minimum_backoff_seconds) || policy.minimum_backoff_seconds < 1 ||
                  policy.required_empty_observations !== 2 || !Array.isArray(observations) ||
                  observations.length !== 2 || !validProjectionPrContract(contract, receipt, authorityReceipt)) return false;
              const editAt = canonicalUtcInstant(receipt.body_edit?.edited_at);
              const createdAt = canonicalUtcInstant(contract.created_at);
              const startedAt = canonicalUtcInstant(contract.started_at);
              const completedAt = canonicalUtcInstant(contract.completed_at);
              const observedTimes = observations.map(row => canonicalUtcInstant(row?.observed_at));
              if (editAt === null || createdAt === null || startedAt === null || completedAt === null ||
                  observedTimes.some(value => value === null) || editAt > createdAt ||
                  createdAt > startedAt || startedAt > completedAt || completedAt > observedTimes[0] ||
                  observedTimes[1] - observedTimes[0] < policy.minimum_backoff_seconds * 1000) return false;
              for (const row of observations) {
                if (!hasExactFields(row, CONVERGENCE_OBSERVATION_FIELDS) ||
                    !Array.isArray(row.closing_issues) || !arraysEqual(row.closing_issues, []) ||
                    !validRateLimit(row.rate_limit) ||
                    row.base_ref !== receipt.base_ref || row.default_branch_sha !== receipt.default_branch_sha ||
                    row.head_ref !== receipt.head_ref || row.pull_request_node_id !== receipt.pull_request_node_id ||
                    row.neutralized_body_sha256 !== receipt.neutralized_body_sha256 || row.title !== receipt.title ||
                    canonicalJson(row.latest_body_edit) !== canonicalJson(receipt.body_edit) ||
                    typeof row.snapshot_sha256 !== "string" || !/^[0-9a-f]{64}$/.test(row.snapshot_sha256)) {
                  return false;
                }
              }
              return validDurableFinalObservation(
                receipt.final_projection_observation, receipt, authorityReceipt, {allowLegacy}
              );
            };

            // Standalone github-script has no Python carrier. Mirror the shared
            // verified_merge.py owner and prove parity for every retained phase.
            const validProjectionPhase = (phase, authorityReceipt, convergence) => {
              const name = phase.phase;
              if (!PHASES.includes(name) || !hasExactFields(phase, PHASE_FIELDS)) return false;
              const reconciled = ["reconciled", "restored"].includes(name);
              const closed = phase.closed_issues;
              const reopened = phase.reopened_unauthorized_issues;
              if (!isSortedIssueArray(closed) || !isSortedIssueArray(reopened) ||
                  (reconciled && !arraysEqual(closed, authorityReceipt.closing_issues)) ||
                  (!reconciled && (closed.length > 0 || reopened.length > 0)) ||
                  closed.some(number => reopened.includes(number)) ||
                  (name === "prepared" ? phase.merge_commit_sha !== null :
                    typeof phase.merge_commit_sha !== "string" || !/^[0-9a-f]{40}$/.test(phase.merge_commit_sha))) return false;
              return canonicalJson(phase) === canonicalJson({
                authority_sha256: canonicalSha256(authorityReceipt),
                body_sha256: name === "restored" ? authorityReceipt.body_sha256 : authorityReceipt.neutralized_body_sha256,
                closed_issues: closed, contract: "verified_issue_set_merge_phase.v1",
                final_projection_observation_sha256: name === "prepared"
                  ? canonicalSha256(convergence.final_projection_observation) : null,
                head_sha: authorityReceipt.head_sha, merge_commit_sha: phase.merge_commit_sha,
                phase: name, pr_number: authorityReceipt.pr_number,
                projection_convergence_sha256: convergence.receipt_sha256,
                reopened_unauthorized_issues: reopened, repository: authorityReceipt.repository,
                run_id: authorityReceipt.run_id,
              });
            };

            const resolveDurableConvergences = (comments, authorityReceipt) => {
              const attempts = comments.filter(comment =>
                TRUSTED_ASSOCIATIONS.has(comment.author_association) &&
                typeof comment.body === "string" && comment.body.includes(CONVERGENCE_MARKER)
              );
              if (attempts.length === 0) return new Map();
              const receipts = commentReceipts(attempts, CONVERGENCE_MARKER);
              const markerAttempts = attempts.reduce(
                (count, comment) => count + structuralMarkerOccurrences(
                  comment.body, CONVERGENCE_MARKER
                ),
                0
              );
              if (markerAttempts === 0) return new Map();
              if (receipts.length !== markerAttempts) return null;
              // Mirror verified_merge.py's shared history classification:
              // authenticate every candidate before selecting current proof.
              const authorities = commentReceipts(comments, AUTHORITY_MARKER);
              const currentDigest = canonicalSha256(authorityReceipt);
              const allowsLegacy = authority => comments.some(comment =>
                legacyAuthorityEligible(comment) && commentReceipts([comment], AUTHORITY_MARKER)
                  .some(candidate => canonicalSha256(candidate) === canonicalSha256(authority))
              );
              const seenContracts = new Set();
              const byDigest = new Map();
              const history = new Map();
              for (const receipt of receipts) {
                let receiptAuthority = authorityReceipt;
                if (receipt.authority_sha256 !== currentDigest) {
                  const authorityAttempts = comments.reduce((count, comment) => count + (
                    TRUSTED_ASSOCIATIONS.has(comment.author_association) && typeof comment.body === "string"
                      ? structuralMarkerOccurrences(comment.body, AUTHORITY_MARKER) : 0
                  ), 0);
                  if (authorities.length !== authorityAttempts) return null;
                  const matching = authorities.filter(candidate =>
                    ["repository", "pr_number", "head_sha", "run_id"].every(
                      field => candidate[field] === receipt[field]
                    )
                  );
                  if (matching.length !== 1) return null;
                  receiptAuthority = matching[0];
                  const pull = receipt.final_projection_observation?.pull_request;
                  if (receipt.repository !== authorityReceipt.repository ||
                      receipt.pr_number !== authorityReceipt.pr_number ||
                      typeof receipt.head_sha !== "string" || !/^[0-9a-f]{40}$/.test(receipt.head_sha) ||
                      pull === null || typeof pull !== "object" ||
                      !validAuthorityReceipt(receiptAuthority, {
                        number: pull.number, head: {sha: pull.head_sha}, body: pull.body,
                      }, authorityReceipt.repository, {allowLegacy: allowsLegacy(receiptAuthority)})) return null;
                }
                if (!validConvergenceReceipt(receipt, receiptAuthority, {allowLegacy: allowsLegacy(receiptAuthority)})) return null;
                const contractIdentity = canonicalJson([
                  canonicalSha256(receiptAuthority), receipt.pr_contract,
                ]);
                if (seenContracts.has(contractIdentity)) return null;
                seenContracts.add(contractIdentity);
                if (receipt.authority_sha256 === currentDigest) {
                  byDigest.set(receipt.receipt_sha256, receipt);
                }
                history.set(receipt.receipt_sha256, [receiptAuthority, receipt]);
              }
              const phases = commentReceipts(comments, PHASE_MARKER);
              const phaseAttempts = comments.reduce((count, comment) => count + (
                TRUSTED_ASSOCIATIONS.has(comment.author_association) && typeof comment.body === "string"
                  ? structuralMarkerOccurrences(comment.body, PHASE_MARKER) : 0
              ), 0);
              if (phases.length !== phaseAttempts) return null;
              // Authenticate every phase and every chain before current selection.
              // An invalid non-selected chain is an error, never a null result to drop.
              const phasesByChain = new Map();
              for (const phase of phases) {
                const historical = history.get(phase.projection_convergence_sha256);
                if (historical === undefined) return null;
                const [phaseAuthority, convergence] = historical;
                if ((phase.authority_sha256 !== currentDigest && phase.phase !== "prepared") ||
                    !validProjectionPhase(phase, phaseAuthority, convergence)) return null;
                const digest = convergence.receipt_sha256;
                if (!phasesByChain.has(digest)) phasesByChain.set(digest, new Map());
                const chain = phasesByChain.get(digest);
                if (chain.has(phase.phase) && canonicalJson(chain.get(phase.phase)) !== canonicalJson(phase)) return null;
                chain.set(phase.phase, phase);
              }
              let deliveredChains = 0;
              for (const chain of phasesByChain.values()) {
                const last = Math.max(...[...chain.keys()].map(name => PHASES.indexOf(name)));
                if (PHASES.slice(0, last + 1).some(name => !chain.has(name))) return null;
                const merged = chain.get("merged");
                if (merged !== undefined) {
                  deliveredChains += 1;
                  if ([...chain.entries()].some(([name, phase]) =>
                    name !== "prepared" && phase.merge_commit_sha !== merged.merge_commit_sha
                  )) return null;
                }
                if (chain.has("restored") && ["closed_issues", "reopened_unauthorized_issues"].some(field =>
                  !arraysEqual(chain.get("restored")[field], chain.get("reconciled")[field])
                )) return null;
              }
              if (deliveredChains > 1) return null;
              return byDigest;
            };

            const resolveContinuousMergePhase = (comments, authorityReceipt, livePr) => {
              if (!hasCompleteMergedIdentity(livePr)) return null;
              const convergences = resolveDurableConvergences(comments, authorityReceipt);
              if (convergences === null || convergences.size === 0) return null;
              const currentDigest = canonicalSha256(authorityReceipt);
              let highest = null;
              // The classifier already proved all fields, phase continuity,
              // conflicts and uniqueness. Only the live merge binding remains.
              for (const phase of commentReceipts(comments, PHASE_MARKER)) {
                if (phase.authority_sha256 !== currentDigest || phase.phase === "prepared") continue;
                if (phase.merge_commit_sha !== livePr.merge_commit_sha) return null;
                if (highest === null || PHASES.indexOf(phase.phase) > PHASES.indexOf(highest.phase)) highest = phase;
              }
              return highest;
            };

            const resolveAuthorityReceipt = (comments, livePr, expectedRepository) => {
              const receipts = [];
              for (const comment of comments) {
                const parsed = commentReceipts([comment], AUTHORITY_MARKER);
                if (parsed.length !== 1) continue;
                const receipt = parsed[0];
                const allowLegacy = legacyAuthorityEligible(comment);
                if (validAuthorityReceipt(
                  receipt, livePr, expectedRepository, {allowLegacy}
                )) {
                  receipts.push(receipt);
                  continue;
                }
                if (
                  hasCompleteMergedIdentity(livePr) &&
                  ![receipt.body_sha256, receipt.neutralized_body_sha256]
                    .some(storedDigest => matchesStoredBodyDigest(
                      livePr.body || "", storedDigest, {allowLegacy}
                    )) &&
                  ![receipt.body_sha256, receipt.neutralized_body_sha256]
                    .some(storedDigest => !livePr.body?.endsWith("\n") &&
                      !(livePr.body || "").includes("\r") &&
                      rawTerminalLfDigest(livePr.body || "") === storedDigest) &&
                  validAuthorityReceipt(
                    receipt, livePr, expectedRepository, {requireLiveBody: false}
                  )
                ) receipts.push(receipt);
              }
              if (receipts.length === 0) return null;
              const keys = new Set(receipts.map(canonicalSha256));
              if (keys.size !== 1) return null;
              const authorityReceipt = receipts[receipts.length - 1];
              if (resolveDurableConvergences(comments, authorityReceipt) === null) return null;
              const hasConvergenceHistory = comments.some(comment =>
                TRUSTED_ASSOCIATIONS.has(comment.author_association) && typeof comment.body === "string" &&
                structuralMarkerOccurrences(comment.body, CONVERGENCE_MARKER) > 0
              );
              const allowLegacy = comments.some(comment =>
                legacyAuthorityEligible(comment) &&
                commentReceipts([comment], AUTHORITY_MARKER)
                  .some(receipt => canonicalSha256(receipt) === canonicalSha256(authorityReceipt))
              );
              if (
                (hasConvergenceHistory ||
                ![authorityReceipt.body_sha256, authorityReceipt.neutralized_body_sha256]
                  .some(storedDigest => matchesStoredBodyDigest(
                    livePr.body || "", storedDigest, {allowLegacy}
                  ))) &&
                resolveContinuousMergePhase(comments, authorityReceipt, livePr) === null
              ) return null;
              return authorityReceipt;
            };

            const selectWatchdogAuthority = ({
              comments, livePr, expectedRepository, linkedIssues,
            }) => {
              const authorityReceipt = resolveAuthorityReceipt(comments, livePr, expectedRepository);
              const liveAuthority = resolveIssueAuthority(livePr.body || "");
              const canonicalLiveAuthority = liveAuthority?.mode === "canonical" ? liveAuthority : null;
              if (authorityReceipt !== null) {
                return {
                  closing_issues: authorityReceipt.closing_issues,
                  governing_issue: authorityReceipt.governing_issue,
                  mode: "durable_receipt",
                };
              }
              if (hasTrustedAuthorityAttempt(comments)) {
                return {
                  closing_issues: [],
                  governing_issue: null,
                  mode: "trusted_receipt_invalid",
                };
              }
              if (canonicalLiveAuthority !== null) {
                return {
                  closing_issues: canonicalLiveAuthority.closing_issues,
                  governing_issue: canonicalLiveAuthority.governing_issue,
                  mode: "canonical_body",
                };
              }
              return {
                closing_issues: linkedIssues,
                governing_issue: null,
                mode: "linked_issues_compatibility",
              };
            };

            const receiptTargets = ({closingIssues, governingIssue, governingState}) => {
              const targets = new Set(closingIssues);
              if (
                Number.isInteger(governingIssue) && governingIssue > 0 &&
                !targets.has(governingIssue) && governingState === "open"
              ) targets.add(governingIssue);
              return [...targets].sort((a, b) => a - b);
            };

            const hasReceiptForPr = (comments, number) => {
              const prefix = `post-merge owner-doc check: PR #${number};`;
              return comments.some(comment =>
                TRUSTED_ASSOCIATIONS.has(comment.author_association) &&
                typeof comment.body === "string" &&
                comment.body.split(/\r?\n/).some(line => line.startsWith(prefix))
              );
            };
            // owner-doc-watchdog-helpers:end

            const { data: livePr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });
            const prComments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });

            let linkedIssues = [];
            let cursor = null;
            do {
              const result = await github.graphql(`
                query($owner: String!, $repo: String!, $pr: Int!, $cursor: String) {
                  repository(owner: $owner, name: $repo) {
                    pullRequest(number: $pr) {
                      closingIssuesReferences(first: 100, after: $cursor) {
                        nodes { number }
                        pageInfo { hasNextPage endCursor }
                      }
                    }
                  }
                }
              `, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pr: prNumber,
                cursor,
              });
              const conn = result.repository.pullRequest.closingIssuesReferences;
              linkedIssues = linkedIssues.concat(conn.nodes.map(node => node.number));
              cursor = conn.pageInfo.hasNextPage ? conn.pageInfo.endCursor : null;
            } while (cursor !== null);
            linkedIssues = [...new Set(linkedIssues)].sort((a, b) => a - b);

            const selectedAuthority = selectWatchdogAuthority({
              comments: prComments,
              livePr,
              expectedRepository: repository,
              linkedIssues,
            });
            const authoritativeClosing = selectedAuthority.closing_issues;
            const governingIssue = selectedAuthority.governing_issue;
            if (selectedAuthority.mode === "trusted_receipt_invalid") {
              core.warning("trusted verified-merge authority was present but could not be authenticated; owner-doc targets fail closed");
            }
            let governingState = null;
            if (governingIssue && !authoritativeClosing.includes(governingIssue)) {
              const { data: governing } = await github.rest.issues.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: governingIssue,
              });
              governingState = governing.state;
            }
            const targets = receiptTargets({
              closingIssues: authoritativeClosing,
              governingIssue,
              governingState,
            });

            const NUDGE = `${NUDGE_PREFIX} check not yet run for PR #${prNumber}.\n\nInvoke \`$post-merge-owner-doc\` on PR #${prNumber} to complete the delivery feedback loop. The skill must leave a PR-specific receipt on every authenticated closed issue and on a distinct open governing parent; issue-free lanes use the PR thread.`;

            if (targets.length === 0) {
              if (!hasReceiptForPr(prComments, prNumber)) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: prNumber,
                  body: NUDGE,
                });
              }
              return;
            }

            for (const issueNumber of targets) {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
              });
              if (!hasReceiptForPr(comments, prNumber)) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  body: NUDGE,
                });
              }
            }
