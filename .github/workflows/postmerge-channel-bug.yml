name: Post-merge channel bug
run-name: channel-bug/${{ inputs.channel }}/${{ fromJSON(inputs.evidence).verdict }}/${{ fromJSON(inputs.evidence).candidate.sha }}/${{ fromJSON(inputs.evidence).candidate.run_id }}/${{ fromJSON(inputs.evidence).candidate.run_attempt }}/${{ fromJSON(inputs.evidence).receipt_fingerprint }}
on:
  workflow_dispatch:
    inputs:
      channel:
        description: Native channel
        type: choice
        options: [dev, test]
        required: true
      evidence:
        description: Bounded terminal controller receipt
        required: true
        type: string

# One trusted-main writer serializes both channels. Scheduling can reorder or
# cancel requests: test requires the retained exact dev-green receipt, never
# queue order. Non-force updates also fence delayed/external ref movement.
concurrency:
  group: postmerge-channel-verdict
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

jobs:
  reconcile:
    if: github.repository == 'RasmusTho/agentic-pkm-mvp' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Reconcile the rolling channel bug
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ inputs.channel }}
          EVIDENCE: ${{ inputs.evidence }}
        run: python3 scripts/postmerge_channel_bug.py --channel "$CHANNEL" --evidence "$EVIDENCE"

  record-channel-ref:
    needs: reconcile
    if: >-
      github.repository == 'RasmusTho/agentic-pkm-mvp' &&
      github.ref == 'refs/heads/main' && github.actor == 'RasmusTho' &&
      fromJSON(inputs.evidence).verdict == 'passed'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
      issues: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Record exact green channel ref
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ inputs.channel }}
          EVIDENCE: ${{ inputs.evidence }}
        run: >-
          python3 scripts/postmerge_channel_bug.py --advance-ref --channel "$CHANNEL"
          --evidence "$EVIDENCE" --receipt-file channel-verdict.json
      - name: Publish exact green verdict receipt
        uses: actions/upload-artifact@v4
        with:
          name: postmerge-green-${{ inputs.channel }}-${{ fromJSON(inputs.evidence).candidate.run_id }}-${{ fromJSON(inputs.evidence).candidate.run_attempt }}-attempt-${{ github.run_attempt }}
          path: channel-verdict.json
          if-no-files-found: error
