name: integration-nightly

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  full-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.12"
            experimental: false
          - python-version: "3.13"
            experimental: true
    env:
      PYTHONPATH: ${{ github.workspace }}
      STORE_BACKEND: memory
      LLM_PROVIDER: mock
      REASONING_PROVIDER: mock
      PLANNER_PROVIDER: mock
      REASONING_ENABLE: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      KNOWLEDGE_PRIMARY_ADAPTER: fs_vault
      KNOWLEDGE_FALLBACK_ADAPTER: obsidian_cli
      KNOWLEDGE_STRICT_STARTUP: "0"
      KNOWLEDGE_ALLOW_FALLBACK: "0"
      INDEX_PERSIST_PATH: tmp/index.jsonl
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Python deps
        run: |
          python -m pip install -U pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f pyproject.toml ]; then pip install -e ".[dev]"; fi

      - name: Prepare tmp dir
        run: mkdir -p tmp

      - name: Deterministic acceptance coverage
        run: |
          pytest -c /dev/null -q \
            tests/quality_wave/test_uat_harness.py \
            tests/cli/test_uat_run_cli.py \
            -m "not pg"

      - name: Full test suite (memory, not pg)
        timeout-minutes: 20
        run: |
          pytest -c /dev/null -q \
            -m "not pg and not alpha_llm" \
            --durations=30 \
            | tee tmp/nightly-pytest.log

      - name: Report canary runtime
        run: |
          python - <<'PY'
          import platform
          print(f"runtime={platform.python_version()} experimental=${{ matrix.experimental }}")
          PY

      - name: Runtime contract regressions
        run: |
          pytest -c /dev/null -q \
            tests/e2e/test_runtime_contract_regressions.py \
            tests/cli/test_uat_run_cli.py \
            tests/test_alpha_e2e_invariants.py \
            tests/fitness/test_runtime_contract.py

      - name: Fitness report
        run: |
          python -m app.fitness.report | tee tmp/ci_summary.log

      - name: Verify CI gates
        run: |
          python - <<'PY'
          from pathlib import Path
          from app.fitness.report import parse_summary_lines, SUMMARY_LABELS

          lines = Path("tmp/ci_summary.log").read_text(encoding="utf-8").splitlines()
          parsed = parse_summary_lines(lines, required=SUMMARY_LABELS)
          gates = parsed.get("GATES") or {}
          ok_status = str(gates.get("ok", "false")).lower()
          reasons = gates.get("reasons")
          print(f"CI gates status: {ok_status} reasons={reasons}")
          if ok_status != "true":
              raise SystemExit(f"CI gates failed: {gates}")
          PY

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-pytest-log-py${{ matrix.python-version }}
          path: tmp/nightly-pytest.log

  pg-first-wave:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      PYTHONPATH: ${{ github.workspace }}
      STORE_BACKEND: memory
      DATABASE_URL: postgresql://app:app@localhost:5432/app
      DB_DSN: postgresql://app:app@localhost:5432/app
      LLM_PROVIDER: mock
      REASONING_PROVIDER: mock
      PLANNER_PROVIDER: mock
      REASONING_ENABLE: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      KNOWLEDGE_PRIMARY_ADAPTER: fs_vault
      KNOWLEDGE_FALLBACK_ADAPTER: obsidian_cli
      KNOWLEDGE_STRICT_STARTUP: "0"
      KNOWLEDGE_ALLOW_FALLBACK: "0"
      INDEX_PERSIST_PATH: tmp/index.jsonl
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: |
          python -m pip install -U pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f pyproject.toml ]; then pip install -e ".[dev]"; fi

      - name: Upgrade database
        run: alembic upgrade head

      - name: First bounded PG wave
        run: |
          pytest -c /dev/null -q \
            tests/api/test_status_store_pg.py \
            tests/runtime/test_panel_outbox_db.py \
            -m "pg"
