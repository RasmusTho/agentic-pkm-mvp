name: integration-nightly

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions: read-all

jobs:
  quality-wave-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}
      STORE_BACKEND: memory
      LLM_PROVIDER: mock
      REASONING_PROVIDER: mock
      PLANNER_PROVIDER: mock
      REASONING_ENABLE: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      KNOWLEDGE_PRIMARY_ADAPTER: fs_vault
      KNOWLEDGE_FALLBACK_ADAPTER: obsidian_cli
      KNOWLEDGE_STRICT_STARTUP: "0"
      KNOWLEDGE_ALLOW_FALLBACK: "0"
      INDEX_PERSIST_PATH: tmp/index.jsonl
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: |
          python -m pip install -U pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f pyproject.toml ]; then pip install -e ".[dev]"; fi

      - name: Prepare tmp dir
        run: mkdir -p tmp

      - name: Deterministic acceptance harness
        shell: bash
        run: |
          set -o pipefail
          pytest -q \
            tests/quality_wave/test_uat_harness.py \
            -m "not pg" \
            --tb=short \
            | tee tmp/nightly-uat-harness.log

      - name: Upload acceptance harness log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-uat-harness-log
          path: tmp/nightly-uat-harness.log

  full-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.12"
            experimental: false
          - python-version: "3.13"
            experimental: true
    env:
      PYTHONPATH: ${{ github.workspace }}
      STORE_BACKEND: memory
      LLM_PROVIDER: mock
      REASONING_PROVIDER: mock
      PLANNER_PROVIDER: mock
      REASONING_ENABLE: "1"
      KNOWLEDGE_PRIMARY_ADAPTER: fs_vault
      KNOWLEDGE_FALLBACK_ADAPTER: obsidian_cli
      KNOWLEDGE_STRICT_STARTUP: "0"
      KNOWLEDGE_ALLOW_FALLBACK: "0"
      INDEX_PERSIST_PATH: tmp/index.jsonl
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Python 3.13 currently builds the `av` dependency from source. Keep the
      # runner libraries explicit so the nightly suite reaches pytest instead
      # of failing during dependency installation.
      - name: Install media build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libavcodec-dev \
            libavdevice-dev \
            libavfilter-dev \
            libavformat-dev \
            libavutil-dev \
            libswresample-dev \
            libswscale-dev

      - name: Install Python deps
        run: |
          python -m pip install -U pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f pyproject.toml ]; then pip install -e ".[dev]"; fi

      - name: Prepare tmp dir
        run: mkdir -p tmp

      - name: Full test suite (memory, not pg)
        timeout-minutes: 20
        continue-on-error: ${{ matrix.experimental }}
        shell: bash
        run: |
          set -o pipefail
          pytest -q \
            -m "not pg and not alpha_llm" \
            --import-mode=importlib \
            --durations=30 \
            | tee tmp/nightly-pytest.log

      - name: Report canary runtime
        run: |
          python - <<'PY'
          import platform
          print(f"runtime={platform.python_version()} experimental=${{ matrix.experimental }}")
          PY

      - name: Runtime contract regressions
        run: |
          pytest -q \
            tests/e2e/test_runtime_contract_regressions.py \
            tests/cli/test_uat_run_cli.py \
            tests/test_alpha_e2e_invariants.py \
            tests/fitness/test_runtime_contract.py

      - name: Fitness report
        run: |
          python -m app.fitness.report | tee tmp/ci_summary.log

      - name: Verify CI gates
        run: |
          python - <<'PY'
          from pathlib import Path
          from app.fitness.report import parse_summary_lines, SUMMARY_LABELS

          lines = Path("tmp/ci_summary.log").read_text(encoding="utf-8").splitlines()
          parsed = parse_summary_lines(lines, required=SUMMARY_LABELS)
          gates = parsed.get("GATES") or {}
          ok_status = str(gates.get("ok", "false")).lower()
          reasons = gates.get("reasons")
          print(f"CI gates status: {ok_status} reasons={reasons}")
          if ok_status != "true":
              raise SystemExit(f"CI gates failed: {gates}")
          PY

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-pytest-log-py${{ matrix.python-version }}
          path: tmp/nightly-pytest.log

  pg-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://app:app@localhost:5432/app
      PYTHONPATH: ${{ github.workspace }}
      STORE_BACKEND: pg
      LLM_PROVIDER: mock
      REASONING_PROVIDER: mock
      PLANNER_PROVIDER: mock
      REASONING_ENABLE: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      KNOWLEDGE_PRIMARY_ADAPTER: fs_vault
      KNOWLEDGE_FALLBACK_ADAPTER: obsidian_cli
      KNOWLEDGE_STRICT_STARTUP: "0"
      KNOWLEDGE_ALLOW_FALLBACK: "0"
      INDEX_PERSIST_PATH: tmp/index.jsonl
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: |
          python -m pip install -U pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f pyproject.toml ]; then pip install -e ".[dev]"; fi

      - name: Enable pgvector extension
        run: |
          python -c "import os, psycopg; url = os.environ['DATABASE_URL'].replace('postgresql+psycopg://', 'postgresql://', 1); psycopg.connect(url, autocommit=True).execute('CREATE EXTENSION IF NOT EXISTS vector')"

      - name: Upgrade database
        run: alembic upgrade head

      - name: Prepare tmp dir
        run: mkdir -p tmp

      - name: Bounded PG verification lane
        shell: bash
        run: |
          set -o pipefail
          pytest -c /dev/null -q \
            tests/int/test_pg_backend.py \
            tests/api/test_status_store_pg.py \
            tests/indexer/test_outbox_roundtrip_pg.py \
            tests/heimdal/test_entity_review_operation_journal.py \
            tests/migrations/test_entity_review_operation_journal_schema_parity.py \
            tests/migrations/test_file_state_adoption.py \
            tests/instance/test_file_state_binding_key.py \
            tests/services/test_vault_sync_binding_scope.py \
            tests/integration/test_single_vault_compatibility.py \
            -m "pg" \
            --tb=short \
            | tee tmp/nightly-pg-contracts.log

      - name: Upload PG lane log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-pg-contracts-log
          path: tmp/nightly-pg-contracts.log

  k6-search:
    # Moved from the retired-by-strip architecture-ci.yaml (#3892): the k6
    # search load check is nightly-only by design — too heavy for the PR
    # path, still valuable as a scheduled regression probe.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://app:app@localhost:5432/app
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r dev-requirements.txt
      - name: Bootstrap database
        run: |
          python - <<'PY'
          from app.services.outbox import bootstrap
          bootstrap()
          PY
      - name: Seed search fixture
        run: |
          python - <<'PY'
          import os
          import psycopg
          from app.services.embedding import deterministic_embedding

          dsn = os.environ['DATABASE_URL']
          sample_id = '11111111-1111-1111-1111-111111111111'
          payload = 'smoke content for k6 search'
          with psycopg.connect(dsn, autocommit=True) as conn, conn.cursor() as cur:
              cur.execute(
                  "insert into objects(uuid,title,review_state,content,path) values(%s,%s,%s,%s,%s) on conflict (uuid) do update set title=excluded.title, review_state=excluded.review_state, content=excluded.content, path=excluded.path",
                  (sample_id, 'Smoke note', 'inbox', payload, 'Notes/smoke.md'),
              )
              vec = deterministic_embedding(payload)
              cur.execute(
                  "insert into objects_embeddings(uuid, dim, vector) values(%s,%s,%s) on conflict (uuid) do update set dim=excluded.dim, vector=excluded.vector",
                  (sample_id, len(vec), vec),
              )
          PY
      - name: Start API
        run: nohup python -m uvicorn app.api.app:app --host 0.0.0.0 --port 8000 >/tmp/api.log 2>&1 &
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
      - name: Wait for API readiness
        run: |
          deadline=$((SECONDS+90))
          while [ $SECONDS -lt $deadline ]; do
            if curl -fsS http://localhost:8000/docs >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          echo "API did not become ready"
          cat /tmp/api.log || true
          exit 1
      - name: Warm up search endpoint
        run: |
          curl -fsS -H "x-trace-id: warmup-k6" "http://localhost:8000/search?q=smoke"
      - name: Install k6
        run: |
          sudo apt-get update
          sudo apt-get install -y gpg
          curl -fsSL https://dl.k6.io/key.gpg | sudo gpg --dearmor -o /usr/share/keyrings/k6-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install -y k6
      - name: Run k6 smoke
        run: |
          export BASE_URL="http://localhost:8000"
          k6 run scripts/k6_search.js
