name: integration-nightly

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions: read-all

jobs:
  quality-wave-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}
      STORE_BACKEND: memory
      LLM_PROVIDER: mock
      REASONING_PROVIDER: mock
      PLANNER_PROVIDER: mock
      REASONING_ENABLE: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      KNOWLEDGE_PRIMARY_ADAPTER: fs_vault
      KNOWLEDGE_FALLBACK_ADAPTER: obsidian_cli
      KNOWLEDGE_STRICT_STARTUP: "0"
      KNOWLEDGE_ALLOW_FALLBACK: "0"
      INDEX_PERSIST_PATH: tmp/index.jsonl
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: |
          python -m pip install -U pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f pyproject.toml ]; then pip install -e ".[dev]"; fi

      - name: Prepare tmp dir
        run: mkdir -p tmp

      - name: Deterministic acceptance harness
        shell: bash
        run: |
          set -o pipefail
          pytest -q \
            tests/quality_wave/test_uat_harness.py \
            -m "not pg" \
            --tb=short \
            | tee tmp/nightly-uat-harness.log

      - name: Upload acceptance harness log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-uat-harness-log
          path: tmp/nightly-uat-harness.log

  full-suite:
    runs-on: ubuntu-latest
    # Reserve setup and upload time around the measured full-suite envelope.
    timeout-minutes: 60
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.12"
            experimental: false
          - python-version: "3.13"
            experimental: true
    env:
      PYTHONPATH: ${{ github.workspace }}
      # Keep nested Make/bootstrap producers on the matrix interpreter.  The
      # Makefile otherwise prefers a host-installed python3.12 on 3.13 runs.
      PYTHON: python
      STORE_BACKEND: memory
      LLM_PROVIDER: mock
      REASONING_PROVIDER: mock
      PLANNER_PROVIDER: mock
      REASONING_ENABLE: "1"
      KNOWLEDGE_PRIMARY_ADAPTER: fs_vault
      KNOWLEDGE_FALLBACK_ADAPTER: obsidian_cli
      KNOWLEDGE_STRICT_STARTUP: "0"
      KNOWLEDGE_ALLOW_FALLBACK: "0"
      INDEX_PERSIST_PATH: tmp/index.jsonl
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Provenance, promotion-fixture and review-gate tests inspect the
          # candidate's historical objects and parent; shallow tips cannot
          # provide that evidence.
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Python 3.13 currently builds the `av` dependency from source. Keep the
      # runner libraries explicit so the nightly suite reaches pytest instead
      # of failing during dependency installation.
      - name: Install media build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libavcodec-dev \
            libavdevice-dev \
            libavfilter-dev \
            libavformat-dev \
            libavutil-dev \
            libswresample-dev \
            libswscale-dev

      - name: Install Python deps
        run: |
          python -m pip install -U pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install -r dev-requirements.txt
          if [ -f pyproject.toml ]; then pip install -e ".[dev]"; fi

      - name: Install standalone sidecar test dependencies
        run: |
          pip install --requirement mimer-mcp-sidecar/requirements.txt
          pip install --no-deps --editable mimer-mcp-sidecar

      - name: Prepare tmp dir
        run: mkdir -p tmp

      - name: Full test suite (memory, not pg)
        # Complete current-source runs take about 40 minutes; retain finite
        # headroom for runner variability without relaxing the test watchdog.
        # Timeout or incomplete results remain failed full-suite evidence.
        timeout-minutes: 50
        continue-on-error: ${{ matrix.experimental }}
        shell: bash
        env:
          PYTEST_ADDOPTS: "--timeout=120 --timeout-method=thread"
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          marker='not pg and not alpha_llm and not eval'
          # Reuse the PR process-isolation pattern, retaining nightly E2E and
          # its original marker selection. Partial logs outlive a cancelled step.
          shard_root="$RUNNER_TEMP/pytest-nightly-shards"
          log_dir="$shard_root/logs"
          shard_list="$shard_root/shards"
          status_file="$shard_root/status"
          mkdir -p "$log_dir"
          : > "$status_file"
          : > tmp/nightly-pytest.log
          find tests -type f \( -name 'test_*.py' -o -name '*_test.py' \) -print |
            while IFS= read -r path; do
              case "$path" in
                tests/deploy/*) printf '%s\n' "$path" ;;
                tests/*/*)
                  relative="${path#tests/}"
                  printf 'tests/%s\n' "${relative%%/*}"
                  ;;
                tests/*) printf '%s\n' "$path" ;;
              esac
            done |
            LC_ALL=C sort -u |
            while IFS= read -r shard; do
              [[ "$shard" == tests/ops ]] || printf '%s\n' "$shard"
            done |
            # This measured long-running file starts with the first workers.
            # It remains in the same discovered inventory as every other file.
            awk '
              $0 == "tests/deploy/test_deploy_channel_script.py" { first = $0; next }
              { remaining[++count] = $0 }
              END {
                if (first != "") print first
                for (i = 1; i <= count; i++) print remaining[i]
              }
            ' > "$shard_list"
          if [[ ! -s "$shard_list" ]]; then
            echo "No collectible nightly process shards discovered" >&2
            exit 1
          fi

          # Require one completed status and consistent JUnit result per shard.
          # Exit 5 is valid only for a fully deselected shard; an empty whole
          # selection, missing/duplicate status, or missing result fails closed.
          validate_shards() {
            python - "$shard_root" "$1" "$2" <<'PY'
          from pathlib import Path
          import re
          import sys
          import xml.etree.ElementTree as ET

          root = Path(sys.argv[1])
          phase = sys.argv[2]
          expected = (root / "shards").read_text().splitlines()
          if phase == "complete":
              expected.append("host-sensitive")
          logs = {shard: root / "logs" / (shard.replace("/", "_") + ".log") for shard in expected}
          aggregate = "".join(path.read_text() for path in logs.values() if path.exists())
          Path("tmp/nightly-pytest.log").write_text(aggregate)
          rows = [line.split(" ", 1) for line in (root / "status").read_text().splitlines()]
          if (int(sys.argv[3]) != 0 or any(len(row) != 2 for row in rows)
                  or len(rows) != len(expected) or {row[1] for row in rows} != set(expected)):
              raise SystemExit(f"Nightly process runner incomplete: expected={len(expected)} actual={len(rows)} launcher={sys.argv[3]}")
          failed = False
          selected = 0
          for raw_rc, shard in rows:
              log = logs[shard]
              try:
                  rc = int(raw_rc)
                  text = log.read_text()
                  report = ET.parse(log.with_suffix(".xml")).getroot()
                  suites = list(report.iter("testsuite"))
                  cases = list(report.iter("testcase"))
                  declared = sum(int(suite.attrib["tests"]) for suite in suites)
                  if not suites or declared != len(cases):
                      raise ValueError("JUnit result count differs from testcase inventory")
                  selected += declared
                  result_failed = any(case.find("failure") is not None or case.find("error") is not None for case in cases)
                  empty = (rc == 5 and declared == 0 and not re.search(r"FAILED|ERROR", text)
                           and re.search(r"no tests ran|[0-9]+ deselected", text))
                  if (rc != 0 and not empty) or result_failed:
                      print(f"SHARD FAILED ({rc}): {shard}\n{text}", file=sys.stderr)
                      failed = True
              except (OSError, ValueError, KeyError, ET.ParseError) as exc:
                  print(f"Nightly shard result incomplete: {shard} (exit={raw_rc}): {exc}", file=sys.stderr)
                  if log.exists():
                      print(log.read_text(), file=sys.stderr)
                  failed = True
          if phase == "complete" and selected == 0:
              print("Nightly selection executed no test results", file=sys.stderr)
              failed = True
          print(f"Nightly {phase}: shards={len(rows)} reported_tests={selected}")
          raise SystemExit(1 if failed else 0)
          PY
          }

          export marker log_dir status_file
          set +e
          while IFS= read -r shard; do printf '%s\0' "$shard"; done < "$shard_list" |
            xargs -0 -r -n 1 -P 4 bash -c '
              shard="$1"
              safe="${shard//\//_}"
              started=$SECONDS
              echo "SHARD START: $shard"
              python -u -m pytest -v -m "$marker" "$shard" \
                --import-mode=importlib --durations=30 --tb=short \
                --junitxml="$log_dir/$safe.xml" \
                --ignore=tests/invariants/test_vault_multiwriter.py > "$log_dir/$safe.log" 2>&1
              rc=$?
              echo "SHARD FINISHED ($rc): $shard in $((SECONDS - started))s"
              printf "%s %s\n" "$rc" "$shard" >> "$status_file"
              exit 0
            ' _
          xargs_status=$?
          set -e
          if (( xargs_status != 0 )); then
            # An interrupted launcher cannot prove that its pytest children
            # exited. Retain incomplete evidence without starting the serial lane.
            validate_shards parallel "$xargs_status"
            exit 1
          fi

          # xargs has waited for every parallel process. Only now run tests
          # that inspect host/process-global state or exact descriptor counts.
          # Ordinary parallel failures remain in status; run the serial coverage
          # before validating both phases together, as the original nightly did.
          started=$SECONDS
          set +e
          python -u -m pytest -v -m "$marker" \
            tests/ops tests/invariants/test_vault_multiwriter.py \
            --import-mode=importlib --durations=30 --tb=short \
            --junitxml="$log_dir/host-sensitive.xml" > "$log_dir/host-sensitive.log" 2>&1
          rc=$?
          set -e
          echo "SHARD FINISHED ($rc): host-sensitive in $((SECONDS - started))s"
          printf "%s host-sensitive\n" "$rc" >> "$status_file"
          validate_shards complete 0

      - name: Report canary runtime
        run: |
          python - <<'PY'
          import platform
          print(f"runtime={platform.python_version()} experimental=${{ matrix.experimental }}")
          PY

      - name: Runtime contract regressions
        run: |
          pytest -q \
            tests/e2e/test_runtime_contract_regressions.py \
            tests/cli/test_uat_run_cli.py \
            tests/test_alpha_e2e_invariants.py \
            tests/fitness/test_runtime_contract.py

      - name: Fitness report
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q -s -m "not pg" \
            tests/fitness/test_ci_fitness.py::test_ci_report_entrypoint_uses_scoped_product_gateway_fixture \
            2>&1 | tee tmp/ci_summary.log

      - name: Verify CI gates
        run: |
          python - <<'PY'
          from pathlib import Path
          from app.fitness.report import parse_summary_lines, SUMMARY_LABELS

          lines = Path("tmp/ci_summary.log").read_text(encoding="utf-8").splitlines()
          parsed = parse_summary_lines(lines, required=SUMMARY_LABELS)
          gates = parsed.get("GATES") or {}
          ok_status = str(gates.get("ok", "false")).lower()
          reasons = gates.get("reasons")
          print(f"CI gates status: {ok_status} reasons={reasons}")
          if ok_status != "true":
              raise SystemExit(f"CI gates failed: {gates}")
          PY

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-pytest-log-py${{ matrix.python-version }}
          path: |
            tmp/nightly-pytest.log
            tmp/ci_summary.log
            ${{ runner.temp }}/pytest-nightly-shards/

  pg-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://app:app@localhost:5432/app_test
      PYTHONPATH: ${{ github.workspace }}
      STORE_BACKEND: pg
      LLM_PROVIDER: mock
      REASONING_PROVIDER: mock
      PLANNER_PROVIDER: mock
      REASONING_ENABLE: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      KNOWLEDGE_PRIMARY_ADAPTER: fs_vault
      KNOWLEDGE_FALLBACK_ADAPTER: obsidian_cli
      KNOWLEDGE_STRICT_STARTUP: "0"
      KNOWLEDGE_ALLOW_FALLBACK: "0"
      INDEX_PERSIST_PATH: tmp/index.jsonl
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: |
          python -m pip install -U pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f pyproject.toml ]; then pip install -e ".[dev]"; fi

      - name: Enable pgvector extension
        run: |
          python -c "import os, psycopg; url = os.environ['DATABASE_URL'].replace('postgresql+psycopg://', 'postgresql://', 1); psycopg.connect(url, autocommit=True).execute('CREATE EXTENSION IF NOT EXISTS vector')"

      - name: Upgrade database
        run: alembic upgrade head

      - name: Prepare tmp dir
        run: mkdir -p tmp

      - name: Bounded PG verification lane
        shell: bash
        run: |
          set -o pipefail
          python -m app.ops.pg_acceptance --ci --nightly \
            | tee tmp/nightly-pg-contracts.log

      - name: Upload PG lane log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-pg-contracts-log
          path: tmp/nightly-pg-contracts.log

  k6-search:
    # Moved from the retired-by-strip architecture-ci.yaml (#3892): the k6
    # search load check is nightly-only by design — too heavy for the PR
    # path, still valuable as a scheduled regression probe.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: k6_search
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://app:app@localhost:5432/k6_search
      PYTHONPATH: ${{ github.workspace }}
      STORE_BACKEND: pg
      EMBED_PROFILE: deterministic
      K6_FIXTURE_MANIFEST: /tmp/k6-search.json
      BASE_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r dev-requirements.txt
      - name: Prepare pgvector extension
        run: python -m scripts.k6_search_fixture prepare-extension
      - name: Apply migrations
        run: alembic upgrade head
      - name: Bootstrap database
        run: |
          python - <<'PY'
          from app.services.outbox import bootstrap
          bootstrap()
          PY
      - name: Seed search fixture
        run: |
          python -m scripts.k6_search_fixture seed --manifest "$K6_FIXTURE_MANIFEST"
      - name: Start API
        run: nohup python -m uvicorn app.api.app:app --host 0.0.0.0 --port 8000 >/tmp/api.log 2>&1 &
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
      - name: Wait for API readiness
        run: |
          python -m scripts.k6_search_fixture probe --base-url "$BASE_URL" --manifest "$K6_FIXTURE_MANIFEST" --wait-seconds 90
      - name: Warm up search endpoint
        run: |
          python -m scripts.k6_search_fixture probe --base-url "$BASE_URL" --manifest "$K6_FIXTURE_MANIFEST"
      - name: Install k6
        run: |
          sudo apt-get update
          sudo apt-get install -y gpg
          curl -fsSL https://dl.k6.io/key.gpg | sudo gpg --dearmor -o /usr/share/keyrings/k6-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install -y k6
      - name: Run k6 smoke
        run: |
          k6 run scripts/k6_search.js
