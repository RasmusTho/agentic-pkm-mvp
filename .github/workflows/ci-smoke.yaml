name: CI Smoke

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ci-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
      STORE_BACKEND: memory
      LLM_PROVIDER: mock
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      INDEX_PERSIST_PATH: tmp/index.jsonl
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python deps
        run: |
          python -m pip install -U pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f pyproject.toml ]; then pip install -e ".[dev]"; fi

      - name: Validate docs guardrails
        shell: bash
        run: |
          set -euo pipefail
          grep -q '```mermaid' docs/DIAGRAMS.md
          grep -q '<!-- DOCS-LINKS:BEGIN -->' README.md
          grep -q '<!-- DOCS-LINKS:END -->' README.md

      - name: Doc integrity
        run: |
          set -euo pipefail
          echo "Doc TODO scan"
          set +e
          grep -R -n -E "TODO|FIXME" README.md CHANGELOG.md docs --exclude-dir=legacy --exclude-dir=uml > /tmp/doc_todos.txt
          scan_status=$?
          set -e
          if [ "$scan_status" -eq 0 ]; then
            echo "Disallowed TODO/FIXME found in docs"
            cat /tmp/doc_todos.txt
            exit 1
          fi
          echo "Doc TODO scan clean"
          grep -q "## Fitness Functions" docs/ARCHITECTURE.md
          grep -q "Fitness Functions Enforced in CI" docs/ROADMAP.md
          grep -q "CI & Test Markers" docs/STATUS.md

      - name: Prepare tmp dir
        run: mkdir -p tmp

      - name: Pytest smoke (memory)
        run: pytest -q -c /dev/null -m "not pg"

      - name: Verify persisted vector index
        run: test -s "$INDEX_PERSIST_PATH"

      - name: Fitness report (QAS-003/QAS-010)
        run: python -m app.fitness.report

      - name: CLI smoke commands
        run: |
          python -m app.cli --help >/dev/null
          python -m app.cli health --json
