name: ci-smoke

on:
  push:
    branches:
      - chore/repo-hygiene+ci-guard
  pull_request:
    branches:
      - chore/repo-hygiene+ci-guard

jobs:
  test:
    name: test (${{ matrix.backend }})
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        backend: [memory, pg]

    services:
      postgres:
        if: ${{ matrix.backend == 'pg' }}
        image: postgres:16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U app -d app"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          if [ -f requirements-smoke.txt ]; then pip install -r requirements-smoke.txt; fi
          if [ -f dev-requirements.txt ]; then pip install -r dev-requirements.txt; fi
          if [ -f app/requirements.txt ]; then pip install -r app/requirements.txt; fi

      - name: Migrate (pg only)
        if: ${{ matrix.backend == 'pg' }}
        env:
          DATABASE_URL: postgresql+psycopg://app:app@localhost:5432/app
          PYTHONPATH: ${{ github.workspace }}
        run: |
          if command -v alembic >/dev/null 2>&1; then
            alembic upgrade head
          else
            echo "alembic not installed; skipping migrations"
          fi

      - name: Smoke tests
        env:
          PYTHONPATH: ${{ github.workspace }}
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: 1
          STORE_BACKEND: ${{ matrix.backend }}
          DATABASE_URL: ${{ matrix.backend == 'pg' && 'postgresql+psycopg://app:app@localhost:5432/app' || '' }}
        run: |
          python scripts/check_code_fences.py
          python -m pytest -q -c /dev/null -k "not slow"
