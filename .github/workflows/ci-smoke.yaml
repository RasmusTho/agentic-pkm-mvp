name: CI Smoke

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ci-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg ripgrep

      - name: Install Python deps
        run: |
          python -m pip install -U pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f pyproject.toml ]; then pip install -e ".[dev]"; fi

      - name: Validate docs guardrails
        run: |
          rg -q '```mermaid' docs/DIAGRAMS.md
          rg -q '<!-- DOCS-LINKS:BEGIN -->' README.md
          rg -q '<!-- DOCS-LINKS:END -->' README.md

      - name: Pytest smoke (mock)
        env:
          PYTHONPATH: ${{ github.workspace }}
          STORE_BACKEND: memory
          LLM_PROVIDER: mock
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          pytest -q -c /dev/null -m "not pg"

      - name: CLI smoke commands
        env:
          PYTHONPATH: ${{ github.workspace }}
          STORE_BACKEND: memory
          LLM_PROVIDER: mock
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          python -m app.cli --help >/dev/null
          python -m app.cli health --json
