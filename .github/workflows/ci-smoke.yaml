name: ci-smoke

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

concurrency:
  group: ci-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.backend }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        backend: [memory, pg]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports:
          - 15432:5432
        options: >-
          --health-cmd="pg_isready -U app -d app"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          if [ -f dev-requirements.txt ]; then pip install -r dev-requirements.txt; fi
          if [ -f app/requirements.txt ]; then pip install -r app/requirements.txt; fi

      - name: Code fence check
        run: python scripts/check_code_fences.py

      - name: Prepare DB (pg only)
        if: matrix.backend == 'pg'
        env:
          DATABASE_URL: postgresql+psycopg://app:app@127.0.0.1:15432/app
        run: alembic upgrade head

      - name: Pytest (memory)
        if: matrix.backend == 'memory'
        env:
          STORE_BACKEND: memory
          PYTHONPATH: ${{ github.workspace }}
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: 1
        run: pytest -q -c /dev/null tests -k "not slow and not e2e and not integration"

      - name: Pytest (pg)
        if: matrix.backend == 'pg'
        env:
          STORE_BACKEND: pg
          DATABASE_URL: postgresql+psycopg://app:app@127.0.0.1:15432/app
          PYTHONPATH: ${{ github.workspace }}
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: 1
        run: pytest -q -c /dev/null tests -k "not slow and not e2e and not integration"
