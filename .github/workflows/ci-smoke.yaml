---
name: CI Smoke

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    # Keep `edited` available so a base-ref retarget receives fresh CI. Job
    # guards below skip pure title/body metadata edits; Issue and PR Governance
    # remains their contract-validation path.
    types: [opened, synchronize, reopened, edited]

concurrency:
  # Pure metadata edits still trigger this workflow so a base-ref retarget can
  # be admitted, but they must not cancel a same-PR source/integration run.
  group: ci-smoke-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event.action == 'edited' && github.event.changes.base.ref.from == null && 'metadata' || 'code' }}
  cancel-in-progress: true

permissions: read-all

jobs:
  smoke:
    if: >-
      github.event_name != 'pull_request'
      || github.event.action != 'edited'
      || github.event.changes.base.ref.from != null
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}
      STORE_BACKEND: memory
      LLM_PROVIDER: mock
      REASONING_PROVIDER: mock
      PLANNER_PROVIDER: mock
      REASONING_ENABLE: "1"
      KNOWLEDGE_PRIMARY_ADAPTER: fs_vault
      KNOWLEDGE_FALLBACK_ADAPTER: obsidian_cli
      KNOWLEDGE_STRICT_STARTUP: "0"
      KNOWLEDGE_ALLOW_FALLBACK: "0"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      INDEX_PERSIST_PATH: tmp/index.jsonl
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # INV-EF1 compares the PR head with main and therefore needs a
          # merge base, not just the two shallow tip commits.
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            dev-requirements.txt
            pyproject.toml
            mimer-mcp-sidecar/requirements.txt
            mimer-mcp-sidecar/pyproject.toml

      - name: Detect heavy smoke surface
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            heavy_smoke:
              - 'app/**'
              - 'tests/**'
              - 'scripts/**'
              - 'config/**'
              - 'configs/**'
              - '.github/workflows/**'
              - 'pyproject.toml'
              - 'requirements*.txt'
              - 'Makefile'
              - 'Dockerfile'
              - 'docker-compose*.yaml'
              - 'docker-compose*.yml'
            # Agent-contract and doc surfaces. Deliberately NOT folded into
            # heavy_smoke: every step heavy_smoke gates is runtime-code-only
            # (tests/smoke, test_indexer, test_fs_watcher, the import/port/vault
            # contracts, the Quality Wave UAT harness) and none of them read
            # AGENTS.md, .codex/**, or docs/**, so widening heavy_smoke would buy
            # a docs typo ~20 minutes of irrelevant runtime tests and no coverage
            # (AGENTS.md :: Total Cost of Development). The governance and
            # architecture suites that DO assert on these paths are selected by
            # scripts/select_pr_tests.py in the `Unit tests (not pg)` job; this
            # filter exists for the docs guard below, which had no PR home.
            governance_docs:
              - 'AGENTS.md'
              - 'CLAUDE.md'
              - '.codex/**'
              - 'docs/**'

      - name: Install system deps (ffmpeg, ripgrep)
        if: github.event_name != 'pull_request' || steps.changes.outputs.heavy_smoke == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg ripgrep

      - name: Install Python deps
        run: |
          python -m pip install -U pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f pyproject.toml ]; then pip install -e ".[dev]"; fi
          pip install pytest-xdist
          pip install pytest-timeout==2.3.1
          python -c "import pytest_timeout"

      - name: Lint (ruff)
        run: |
          ruff check app tests companion-ui/companion-app

      # The public-seam gate compares the PR head with origin/main via a
      # three-dot diff (`origin/main...HEAD`), which needs the MERGE BASE
      # between the two — not just their tips. The `fetch-depth: 0` Checkout
      # above populates refs/remotes/origin/main with full history, but main
      # can advance between that checkout and this step, so we refresh the ref.
      # --force: a non-forced fetch of the newer tip is rejected as
      # "non-fast-forward" against the existing full-depth ref (observed on
      # PR #3514, CI Smoke run 29197410199). Do NOT pass --depth=1: that
      # re-shallows origin/main to a single commit, and once main has advanced
      # past this branch's merge point the merge base is no longer in the
      # shallow history, so `git diff origin/main...HEAD` fails with exit 128
      # ("no merge base"). Keep the fetch full-depth so the merge base is
      # always reachable. This only moves the local remote-tracking ref
      # forward — it fetches, never pushes, so it cannot lose remote data.
      - name: Fetch public-seam gate base
        run: git fetch --no-tags --force origin main:refs/remotes/origin/main

      - name: INV-EF1 public seam gate
        run: python3 scripts/public_seam_lint.py --mode gate

      - name: Validate settings
        run: |
          mkdir -p tmp
          python -m app.cli settings-validate --json | tee tmp/settings-validate.json
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("tmp/settings-validate.json").read_text(encoding="utf-8"))
          if not payload.get("ok", False):
              raise SystemExit(f"settings-validate failed: {payload}")
          PY

      - name: Validate docs guardrails
        shell: bash
        run: |
          set -euo pipefail
          grep -q '```mermaid' docs/DIAGRAMS.md
          grep -q '<!-- DOCS-LINKS:BEGIN -->' README.md
          grep -q '<!-- DOCS-LINKS:END -->' README.md
          grep -qF '\n' docs/DIAGRAMS.md && { echo "docs/DIAGRAMS.md must not contain literal \\n sequences"; exit 1; } || true
          grep -qE '^[[:space:]]+```mermaid' docs/DIAGRAMS.md && { echo "Mermaid fences must not be indented"; exit 1; } || true
          grep -qF '$begin:math:text$' docs/DIAGRAMS.md && { echo "Forbidden math fence syntax inside table detected"; exit 1; } || true

      # Kept here when the legacy `smoke` workflow is retired. This is
      # intentionally unconditional so governance-only PRs retain coverage.
      - name: Skills consistency lint
        run: python3 scripts/lint_skills_consistency.py

      # Full-repository and unconditional: implementation PRs may update docs
      # while the broader docs guard below intentionally stays off the runtime
      # surface. Product/vault content and multilingual test corpora are not
      # repository documentation and remain outside this policy.
      - name: Documentation language guard
        run: python3 scripts/docs_guard.py --language-only

      # Companion to the unconditional skills lint above. scripts/docs_guard.py
      # had no PR-triggered home at all: its only caller is architecture-ci.yaml,
      # which has been workflow_dispatch-only since #3892, so the docs-pairing
      # and temporal-owner-doc rules never ran on any pull request.
      #
      # Scoped to governance/docs-only PRs on purpose. The guard's first two
      # rules fire on app/**, scripts/**, and config/** changes, so running it
      # unconditionally would newly fail a large class of ordinary runtime PRs —
      # a separate decision from closing this coverage gap, and one that would
      # redden the queue rather than protect it. `heavy_smoke != 'true'` is the
      # exact complement: it already enumerates that runtime surface, so this
      # step can only fire on the docs/governance-only shape the guard was
      # written for, leaving every runtime PR's behavior untouched.
      - name: Docs guard (governance/docs-only PRs)
        if: >-
          github.event_name == 'pull_request'
          && steps.changes.outputs.governance_docs == 'true'
          && steps.changes.outputs.heavy_smoke != 'true'
        run: python3 scripts/docs_guard.py

      - name: Doc integrity
        run: |
          set -euo pipefail
          echo "Doc TODO scan"
          set +e
          files=(README.md docs)
          if [ -f CHANGELOG.md ]; then
            files+=(CHANGELOG.md)
          fi
          grep -R -n -E "TODO|FIXME" --exclude-dir=legacy --exclude-dir=uml --exclude-dir=archive --exclude=DOCS_INDEX.md "${files[@]}" > /tmp/doc_todos.txt
          scan_status=$?
          set -e
          if [ "$scan_status" -eq 0 ]; then
            echo "Disallowed TODO/FIXME found in docs"
            cat /tmp/doc_todos.txt
            exit 1
          fi
          echo "Doc TODO scan clean"
          grep -q "## Fitness Functions" docs/ARCHITECTURE.md
          grep -q "Fitness Functions Enforced in CI" docs/ROADMAP.md
          grep -q "CI & Test Markers" docs/STATUS.md

      - name: Prepare tmp dir
        run: mkdir -p tmp

      # Full-tree collection health gate (#3942). A module-level import error
      # in tests/api/ broke collection of the entire `not pg` suite on main
      # for two days with zero CI signal (#3941): every PR workflow runs
      # pytest against explicit path slices, so tree-wide ImportError/
      # SyntaxError/conftest breakage had no PR-time enforcement. This step
      # collects (never executes) the full `not pg` selection so any PR that
      # breaks collection anywhere under tests/ fails loud here. Exit code
      # gates directly — no pipes, no `|| echo`.
      - name: Pytest full-tree collection health (collect-only)
        if: github.event_name != 'pull_request' || steps.changes.outputs.heavy_smoke == 'true'
        timeout-minutes: 5
        run: |
          python -m pytest -q --collect-only -m "not pg and not alpha_llm" tests/

      - name: Pytest smoke baseline (memory, fail-fast)
        if: github.event_name != 'pull_request' || steps.changes.outputs.heavy_smoke == 'true'
        timeout-minutes: 12
        run: |
          pytest -p xdist.plugin -c /dev/null -m "not pg and not alpha_llm" \
            tests/smoke \
            tests/agents/test_indexer.py::test_indexer_builds_embeddings_and_fts \
            tests/watcher/test_fs_watcher.py \
            tests/architecture/test_import_rules.py \
            tests/architecture/test_obsidian_port_boundaries.py \
            tests/guard/test_no_direct_db_imports.py \
            tests/ports/test_vault_port_contract.py \
            tests/services/test_filesystem_vault_adapter.py \
            tests/services/test_vault_sync_lifecycle.py \
            --maxfail=1 -ra --durations=20 -n auto --dist=loadfile

      - name: Pytest Quality Wave smoke (memory, fail-fast)
        if: github.event_name != 'pull_request' || steps.changes.outputs.heavy_smoke == 'true'
        timeout-minutes: 8
        env:
          PYTEST_ADDOPTS: "-p pytest_timeout --timeout=120 --timeout-method=thread"
        run: |
          pytest -c /dev/null -m "not pg and not alpha_llm" \
            tests/quality_wave/test_uat_harness.py \
            --maxfail=1 -ra --durations=20

      - name: Skip heavy pytest smoke for docs-only PR
        if: github.event_name == 'pull_request' && steps.changes.outputs.heavy_smoke != 'true'
        run: |
          echo "Docs-only PR detected; skipping heavy pytest smoke slices."

      - name: Ensure persisted vector index artifact exists
        run: |
          mkdir -p "$(dirname "$INDEX_PERSIST_PATH")"
          if [ ! -s "$INDEX_PERSIST_PATH" ]; then
            echo '{"event":"smoke.index.persist.seed"}' > "$INDEX_PERSIST_PATH"
          fi

      - name: Verify persisted vector index
        run: test -s "$INDEX_PERSIST_PATH"

      - name: Fitness report (QAS-003/QAS-010)
        run: |
          python -m app.fitness.report | tee tmp/ci_summary.log

      - name: Verify CI summary lines
        run: |
          python - <<'PY'
          from pathlib import Path
          from app.fitness.report import parse_summary_lines, SUMMARY_LABELS

          lines = Path("tmp/ci_summary.log").read_text(encoding="utf-8").splitlines()
          parsed = parse_summary_lines(lines, required=SUMMARY_LABELS)
          if set(parsed.keys()) != set(SUMMARY_LABELS):
              missing = set(SUMMARY_LABELS) - set(parsed.keys())
              extra = set(parsed.keys()) - set(SUMMARY_LABELS)
              raise SystemExit(f"Unexpected CI summary labels. Missing: {missing}, extra: {extra}")
          gates = parsed.get("GATES") or {}
          ok_status = str(gates.get("ok", "false")).lower()
          reasons = gates.get("reasons")
          print(f"CI gates status: {ok_status} reasons={reasons}")
          if ok_status != "true":
              raise SystemExit(f"CI gates failed: {gates}")
          PY

      - name: CLI smoke commands
        run: |
          python -m app.cli --help >/dev/null
          python -m app.cli health --json || true

  smoke-docker:
    if: >-
      github.event_name != 'pull_request'
      || github.event.action != 'edited'
      || github.event.changes.base.ref.from != null
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LLM_PROVIDER: mock
      REASONING_PROVIDER: mock
      PLANNER_PROVIDER: mock
      REASONING_ENABLE: "1"
      KNOWLEDGE_PRIMARY_ADAPTER: fs_vault
      KNOWLEDGE_FALLBACK_ADAPTER: obsidian_cli
      KNOWLEDGE_STRICT_STARTUP: "0"
      KNOWLEDGE_ALLOW_FALLBACK: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect docker smoke surface
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            docker_smoke:
              - 'app/**'
              - 'scripts/**'
              - '.github/workflows/**'
              - 'Dockerfile'
              - 'docker-compose*.yaml'
              - 'docker-compose*.yml'
              - 'requirements*.txt'
              - 'pyproject.toml'

      - name: "Docker smoke: worker emits startup log"
        if: github.event_name != 'pull_request' || github.base_ref == 'stable'
        shell: bash
        run: |
          set -euo pipefail
          export WORKER_LOG_HEARTBEAT_SECONDS=0
          cat > /tmp/docker-compose.worker-ci.yaml <<'YAML'
          services:
            worker:
              environment:
                WORKER_LOG_HEARTBEAT_SECONDS: "${WORKER_LOG_HEARTBEAT_SECONDS}"
          YAML
          # MVR-01B launcher contract part 3/3: every compose invocation in this
          # step (including raw `up` and its instance-state-init dependency)
          # must chown/run as the runner identity, or the init service's
          # compose default LOCAL_UID:-0 root-owns the host bind and the next
          # step's chmod fails EPERM.
          export LOCAL_UID="$(id -u)"
          export LOCAL_GID="$(id -g)"
          source scripts/lib/instance_ownership_host_state.sh
          prepare_instance_ownership_host_state_dir
          compose_files="-f docker-compose.yaml -f /tmp/docker-compose.worker-ci.yaml"
          cleanup() {
            rc=$?
            trap - EXIT
            if [ "$rc" -ne 0 ]; then
              echo "docker compose ps"
              docker compose $compose_files ps || true
              echo "migrate logs (tail=200)"
              docker compose $compose_files logs --no-color --tail=200 migrate || true
              echo "worker logs (tail=200)"
              docker compose $compose_files logs --no-color --tail=200 worker || true
              echo "db logs (tail=120)"
              docker compose $compose_files logs --no-color --tail=120 db || true
            fi
            docker compose $compose_files down -v || true
            exit "$rc"
          }
          trap cleanup EXIT

          # MVR-01B: consumers fail loud unless the launcher prepared the
          # instance-state layout. Run the exact production producer, like
          # start_full_system.sh / deploy_channel.sh do.
          source scripts/lib/instance_state_deployment.sh
          run_ci_compose() { docker compose $compose_files "$@"; }
          prepare_ci_instance_state_deployment() {
            local attempt=1 max_attempts=3 attempt_rc stderr_path
            while :; do
              stderr_path="$(mktemp "${RUNNER_TEMP:-/tmp}/prepare-instance-state.XXXXXX")" || return $?
              if prepare_instance_state_deployment \
                run_ci_compose "${PKM_ENVIRONMENT:-dev}" 2>"$stderr_path"; then
                cat "$stderr_path" >&2
                rm -f "$stderr_path"
                return 0
              else
                attempt_rc=$?
              fi
              cat "$stderr_path" >&2
              if [ "$attempt" -ge "$max_attempts" ] \
                || ! grep -Fxq "native process enumeration failed" "$stderr_path"; then
                rm -f "$stderr_path"
                return "$attempt_rc"
              fi
              rm -f "$stderr_path"
              attempt=$((attempt + 1))
            done
          }
          run_ci_compose up -d --wait db
          prepare_ci_instance_state_deployment

          docker compose $compose_files up -d --build worker

          start_time=$SECONDS
          while [ $((SECONDS - start_time)) -lt 30 ]; do
            if docker compose $compose_files logs --no-color --tail=200 worker | grep -Fq "worker starting"; then
              echo "worker startup log found"
              docker compose $compose_files logs --no-color --tail=50 worker || true
              exit 0
            fi
            sleep 1
          done

          echo "::error::worker startup log not found after 30 seconds"
          exit 1

      - name: "CI gate: vaultwide panel verifier"
        if: github.event_name != 'pull_request' || github.base_ref == 'stable'
        shell: bash
        run: |
          set -euo pipefail
          export VAULT_ROOT="/tmp/ci-vault"
          # Base compose no longer binds /app/vault (#2386); the explicit
          # docker-compose.legacy-vault.yml overlay restores it from VAULT_HOST_ROOT.
          # The /Users + /Volumes same-path mounts (#2310) are macOS-only and absent
          # on the Linux CI runner, so the overlay is how the seeded vault reaches
          # the api/worker/watcher containers at /app/vault.
          export VAULT_HOST_ROOT="$VAULT_ROOT"
          rm -rf "$VAULT_ROOT"
          mkdir -p "$VAULT_ROOT/System" "$VAULT_ROOT/settings"
          cat > "$VAULT_ROOT/System/vault.layout.md" <<'EOF'
          ---
          version: '1'
          system_folder: 'System'
          inbox_folder: 'Input'
          desk_folder: 'Workbench'
          root_folders: []
          include_folders: []
          ignore_glob: []
          ---
          # layout
          EOF
          cat > "$VAULT_ROOT/settings/vault.md" <<'EOF'
          ---
          schema: design-handoff.vault.v1
          scope: vault-shared
          vaultId: vault-ci-smoke
          vaultName: ci-vault
          createdBy: ci-smoke
          settingsVersion: 1
          ---
          # Vault Settings
          EOF
          cat > "$VAULT_ROOT/settings/paths.md" <<'EOF'
          ---
          schema: design-handoff.paths.v1
          scope: vault-shared
          handoffFolder: Design Handoff
          assetsFolder: Design Handoff/Assets
          templatesFolder: Design Handoff/Templates
          archiveFolder: Design Handoff/Archive
          ---
          # Path Settings
          EOF
          cat > "$VAULT_ROOT/settings/workflow.md" <<'EOF'
          ---
          schema: design-handoff.workflow.v1
          scope: vault-shared
          defaultStatus: draft
          statuses:
            - draft
            - in-review
            - approved
            - archived
          ---
          # Workflow Settings
          EOF
          cat > "$VAULT_ROOT/settings/design-handoff.md" <<'EOF'
          ---
          schema: design-handoff.core.v1
          scope: vault-shared
          autoCreateAssetFolders: true
          preserveOriginalFileNames: true
          generateIndexOnChange: true
          ---
          # Design Handoff Settings
          EOF
          cat > "$VAULT_ROOT/settings/companion-ui.md" <<'EOF'
          ---
          schema: design-handoff.companion-ui.v1
          scope: vault-shared
          defaultView: handoff
          showAdvancedSettings: false
          autoRefresh: true
          ---
          # Companion UI Settings
          EOF
          cat > "$VAULT_ROOT/settings/local.md" <<'EOF'
          ---
          schema: design-handoff.local.v1
          scope: vault-local
          localInstanceId: local-ci-smoke
          machineRole: testNode
          syncRole: local
          enableVaultWatcher: true
          enableAutoIndexing: true
          allowWritesToVault: true
          allowSharedSettingsEdits: true
          allowLocalSettingsEdits: true
          localExportPath: null
          ---
          # Local Settings
          EOF
          cat > "$VAULT_ROOT/settings/.gitignore" <<'EOF'
          local.md
          *.local.md
          local/
          runtime/
          cache/
          EOF

          # MVR-01B launcher contract part 3/3: every compose invocation in this
          # step (including raw `up` and its instance-state-init dependency)
          # must chown/run as the runner identity, or the init service's
          # compose default LOCAL_UID:-0 root-owns the host bind and the next
          # step's chmod fails EPERM.
          export LOCAL_UID="$(id -u)"
          export LOCAL_GID="$(id -g)"
          source scripts/lib/instance_ownership_host_state.sh
          prepare_instance_ownership_host_state_dir
          VAULT_IDENTITY_OVERLAY_PATH="${RUNNER_TEMP}/ci-vault-identity.${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}.yml"
          # The watcher sees the CI fixture through the same-path bind while it
          # seeds the binding and finalizes it. Keep instance-state-init
          # mount-blind just like production; its host-side owner inventory is
          # the only authority for the retained root.
          cat > "$VAULT_IDENTITY_OVERLAY_PATH" <<EOF
          services:
            watcher:
              volumes:
                - type: bind
                  source: "$VAULT_ROOT"
                  target: "$VAULT_ROOT"
                  read_only: true
          EOF
          compose_files="-f docker-compose.yaml -f docker-compose.legacy-vault.yml -f $VAULT_IDENTITY_OVERLAY_PATH"
          # #4463: single source of truth for the verifier's artifact paths. The
          # diagnostic below used to read the script's workspace-relative tmp/
          # defaults while the invocation overrode them to absolute /tmp paths,
          # so a failing gate emitted no evidence at all. Declare once, and both
          # the writer and the reader stay on the same paths. The run-id/attempt
          # namespacing is deliberate: it stays precise under concurrent runs.
          VAULTWIDE_PANEL_LOG_PATH="/tmp/verify_vaultwide_panel.${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}.log"
          VAULTWIDE_PANEL_REPORT_PATH="/tmp/verify_vaultwide_panel.${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}.report"
          VAULT_BINDING_RECEIPT_PATH="/tmp/ci-vault-binding.${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}.json"
          VAULT_BINDING_ID_PATH="/tmp/ci-vault-binding.${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}.id"
          cleanup() {
            rc=$?
            trap - EXIT
            if [ "$rc" -ne 0 ]; then
              echo "docker compose ps"
              docker compose $compose_files ps || true
              echo "verifier artifacts"
              # No stderr suppression: when an artifact is absent, ls naming the
              # missing path is itself the evidence.
              ls -l "$VAULTWIDE_PANEL_REPORT_PATH" "$VAULTWIDE_PANEL_LOG_PATH" || true
              if [ -s "$VAULTWIDE_PANEL_REPORT_PATH" ]; then
                echo "=== REPORT $VAULTWIDE_PANEL_REPORT_PATH ==="
                cat "$VAULTWIDE_PANEL_REPORT_PATH" || true
              else
                echo "VAULTWIDE_PANEL_VERIFIER_ARTIFACT_MISSING report=$VAULTWIDE_PANEL_REPORT_PATH"
              fi
              if [ -s "$VAULTWIDE_PANEL_LOG_PATH" ]; then
                # The failing assertions are the point of the log, and they can
                # sit far above its tail, so surface them before the tail.
                echo "=== LOG FAILURES $VAULTWIDE_PANEL_LOG_PATH ==="
                grep -F "FAIL: " "$VAULTWIDE_PANEL_LOG_PATH" || echo "(no FAIL: lines in verifier log)"
                echo "=== LOG (tail 400) $VAULTWIDE_PANEL_LOG_PATH ==="
                tail -n 400 "$VAULTWIDE_PANEL_LOG_PATH" || true
              else
                echo "VAULTWIDE_PANEL_VERIFIER_ARTIFACT_MISSING log=$VAULTWIDE_PANEL_LOG_PATH"
              fi
              echo "migrate logs (tail=200)"
              docker compose $compose_files logs --no-color --tail=200 migrate || true
              echo "watcher logs (tail=200)"
              docker compose $compose_files logs --no-color --tail=200 watcher || true
              echo "worker logs (tail=200)"
              docker compose $compose_files logs --no-color --tail=200 worker || true
            fi
            rm -f "$VAULT_BINDING_RECEIPT_PATH" "$VAULT_BINDING_ID_PATH"
            docker compose $compose_files down -v || true
            rm -f "$VAULT_IDENTITY_OVERLAY_PATH"
            exit "$rc"
          }
          trap cleanup EXIT

          # MVR-01B: run the exact production launcher producer before raw compose up.
          source scripts/lib/instance_state_deployment.sh
          run_ci_compose() { docker compose $compose_files "$@"; }
          prepare_ci_instance_state_deployment() {
            local attempt=1 max_attempts=3 attempt_rc stderr_path
            while :; do
              stderr_path="$(mktemp "${RUNNER_TEMP:-/tmp}/prepare-instance-state.XXXXXX")" || return $?
              if prepare_instance_state_deployment \
                run_ci_compose "${PKM_ENVIRONMENT:-dev}" 2>"$stderr_path"; then
                cat "$stderr_path" >&2
                rm -f "$stderr_path"
                return 0
              else
                attempt_rc=$?
              fi
              cat "$stderr_path" >&2
              if [ "$attempt" -ge "$max_attempts" ] \
                || ! grep -Fxq "native process enumeration failed" "$stderr_path"; then
                rm -f "$stderr_path"
                return "$attempt_rc"
              fi
              rm -f "$stderr_path"
              attempt=$((attempt + 1))
            done
          }
          run_ci_compose up -d --wait db
          prepare_ci_instance_state_deployment

          # A fresh CI volume is intentionally dormant after mechanical state
          # preparation. Register the seeded fixture through the exact runtime
          # watcher preflight, then exercise the existing explicit MVR-01C and
          # MVR-03 production cutovers before asking the panel to emit governed
          # binding effects. This models an already-cut-over installation; it
          # does not teach ordinary deployment to infer authority activation.
          set +e
          run_ci_compose run --rm --no-deps -T -e VAULT_ROOT="$VAULT_ROOT" watcher \
            python -m app.instance.runtime preflight \
              --channel "${PKM_ENVIRONMENT:-dev}" \
              --instance-state-root /app/instance-state \
              --host-global-root /app/instance-ownership \
              --consumer watcher > "$VAULT_BINDING_RECEIPT_PATH"
          binding_registration_rc=$?
          set -e
          if [ "$binding_registration_rc" -ne 0 ]; then
            exit "$binding_registration_rc"
          fi
          set +e
          python3 - "$VAULT_BINDING_RECEIPT_PATH" "$VAULT_BINDING_ID_PATH" <<'PY'
          import json
          import sys
          from pathlib import Path

          receipt = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          binding_id = receipt.get("vault_binding_id")
          if not isinstance(binding_id, str) or not binding_id.strip():
              raise SystemExit("consumer preflight did not register the CI vault binding")
          Path(sys.argv[2]).write_text(binding_id.strip() + "\n", encoding="utf-8")
          PY
          binding_parse_rc=$?
          set -e
          if [ "$binding_parse_rc" -ne 0 ]; then
            exit "$binding_parse_rc"
          fi
          read -r MVR01C_ROLLBACK_VAULT_BINDING_ID < "$VAULT_BINDING_ID_PATH"
          # The fixture was seeded through the same host spelling used by the
          # finalizer, so its adopted binding remains comparable to the
          # host-produced owner inventory through cutover.
          export MVR01C_ROLLBACK_VAULT_BINDING_ID
          export MVR01C_ROLLBACK_VAULT_ROOT="$VAULT_ROOT"
          export MVR03_PRINCIPAL_CUTOVER=1
          export MVR03_PRINCIPAL_LOOPBACK_LISTENER=0
          prepare_ci_instance_state_deployment

          # The panel verifier exercises the watcher consumer only. Starting
          # api/worker here would create separate live global owners for this
          # single CI fixture root, which the ownership ledger must reject.
          docker compose $compose_files up -d --build db watcher
          LOG_PATH="$VAULTWIDE_PANEL_LOG_PATH" \
          REPORT_PATH="$VAULTWIDE_PANEL_REPORT_PATH" \
          bash scripts/verify_vaultwide_panel.sh

      - name: Skip docker smoke for docs-only PR
        if: github.event_name == 'pull_request' && github.base_ref != 'stable'
        run: |
          echo "Docker smoke is skipped only for ordinary pull requests."

  pr-unit-tests-not-pg:
    name: Unit tests (not pg)
    # Moved from the retired ci.yml (#3892) so the subsystem-scoped unit-test
    # lane, the mandatory repo-wide mypy gate, and the intent-classification
    # golden gate keep running on the PR path. Docs-only PRs skip the heavy
    # steps via the paths filter below.
    if: >-
      github.event_name == 'pull_request'
      && (github.event.action != 'edited'
      || github.event.changes.base.ref.from != null)
    runs-on: ubuntu-latest
    # Do not set PYTEST_DISABLE_PLUGIN_AUTOLOAD here. Disabling autoload
    # suppresses pytest-asyncio (and others), so every @pytest.mark.asyncio
    # test in tests/sync/* and tests/agents/* false-fails. This job must mirror
    # the nightly full suite, which autoloads plugins. See issue #2036.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect unit-test surface
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            code:
              - 'app/**'
              - 'tests/**'
              - 'scripts/**'
              - 'companion-ui/**'
              - 'config/**'
              - 'configs/**'
              - 'conftest.py'
              - 'sitecustomize.py'
              - 'pyproject.toml'
              - 'requirements*.txt'
              - 'dev-requirements.txt'
              - 'mypy.ini'
              - 'pytest.ini'
              - 'alembic.ini'
              - '.github/**'
              - 'mimer-mcp-sidecar/**'
              # GitHub governance, agent-contract, and doc surfaces have real
              # asserting coverage in tests/architecture, tests/governance,
              # and tests/ops (e.g.
              # test_agent_skill_entrypoints.py, test_pr_hot_path_governance.py,
              # test_review_before_ci_gate.py). Without these, a PR touching only
              # these paths skipped every real step yet still reported `success`
              # on this required check (#4281). scripts/select_pr_tests.py already
              # narrows docs-only/governance-only PRs to the owning test targets,
              # so this stays scoped rather than forcing the full suite.
              - 'AGENTS.md'
              - 'CLAUDE.md'
              - '.codex/**'
              - 'docs/**'

      - uses: actions/setup-python@v5
        if: steps.changes.outputs.code == 'true'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            dev-requirements.txt
            pyproject.toml
            mimer-mcp-sidecar/requirements.txt
            mimer-mcp-sidecar/pyproject.toml

      - name: Fetch PR base ref
        if: steps.changes.outputs.code == 'true'
        shell: bash
        # Never fetch the base ref shallow: the checkout above is fetch-depth 0
        # (full history), and a shallow fetch here cuts the base tip's parents
        # whenever the base branch advanced after checkout — merge-base(origin/<base>,
        # HEAD) then fails and `git diff base...HEAD` exits 128 in the selection
        # step (seen on PR #3499 reruns while main advanced under the run).
        run: git fetch --no-tags origin "${{ github.base_ref }}"

      - name: Select subsystem-scoped pytest targets
        if: steps.changes.outputs.code == 'true'
        id: select-tests
        shell: bash
        run: |
          python scripts/select_pr_tests.py \
            --base-ref "origin/${{ github.base_ref }}" \
            --head-ref HEAD \
            --github-output "$GITHUB_OUTPUT"

      - name: Install Linux ACL tools
        if: steps.changes.outputs.code == 'true' && steps.select-tests.outputs.runtime_checks == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y acl

      - name: Install dependencies
        if: steps.changes.outputs.code == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r dev-requirements.txt

      - name: Install standalone sidecar test dependencies
        if: steps.changes.outputs.code == 'true'
        run: |
          pip install --requirement mimer-mcp-sidecar/requirements.txt
          pip install --no-deps --editable mimer-mcp-sidecar

      - name: Intent-classification golden gate (KERNEL-13)
        # Explicit, named gate over the classification_case.v1 golden set
        # (docs/eval/classification_golden.yaml): per-class precision/recall,
        # confusion matrix, and the blocking mutation-side confusion hard
        # gate, driven through the real classifier path via the deterministic
        # replay fixture. Also runs inside the full not-pg suite below; the
        # dedicated step keeps the gate visible and fails fast with a named
        # signal when the classifier or dataset regresses (KERNEL-13, #2775).
        if: steps.changes.outputs.code == 'true' && steps.select-tests.outputs.runtime_checks == 'true'
        shell: bash
        env:
          PYTEST_ADDOPTS: "--timeout=120 --timeout-method=thread"
        run: |
          set -o pipefail
          pytest -q -m "not pg" tests/eval/test_classification_golden.py

      - name: Run mandatory repo-wide mypy gate
        if: steps.changes.outputs.code == 'true' && steps.select-tests.outputs.runtime_checks == 'true'
        run: mypy app

      - name: Run shared not-pg unit tests in process shards
        if: steps.changes.outputs.code == 'true' && steps.select-tests.outputs.full_suite == 'true'
        shell: bash
        # Workflow/test configuration changes select this full-suite lane.
        # The 120-second per-test timeout still catches individual hangs.
        timeout-minutes: 35
        env:
          PYTEST_ADDOPTS: "--timeout=120 --timeout-method=thread"
        run: |
          set -euo pipefail
          echo "Selected subsystems: ${{ steps.select-tests.outputs.subsystems }}"
          echo "Selection reason: ${{ steps.select-tests.outputs.reason }}"
          # xdist workers are separate pytest processes, but this suite also
          # contains tests that inspect host-wide process state and tests whose
          # fixtures intentionally retain process-global state. Run each
          # directory (or root-level test module) in its own serial process,
          # with bounded concurrency, then run the host/Fd-sensitive boundary
          # tests after every shard has exited.
          marker='not pg and not alpha_llm and not alpha_llm_live and not panel_llm_e2e and not eval and not browser_runtime and not human_uat and not uat_integrated_runtime'
          # Keep partial logs outside a temporary directory with an EXIT cleanup:
          # a cancelled step must still leave evidence for the always-run upload.
          shard_root="$RUNNER_TEMP/pytest-not-pg-shards"
          mkdir -p "$shard_root"
          shard_list="$shard_root/shards"
          status_file="$shard_root/status"
          log_dir="$shard_root/logs"
          mkdir -p "$log_dir"
          : > "$status_file"

          find tests -type f \( -name 'test_*.py' -o -name '*_test.py' \) -print |
            while IFS= read -r path; do
              case "$path" in
                tests/*/*)
                  # pytest recurses, so a nested directory cannot also be a shard.
                  relative="${path#tests/}"
                  printf 'tests/%s\n' "${relative%%/*}"
                  ;;
                tests/*) printf '%s\n' "$path" ;;
              esac
            done |
            LC_ALL=C sort -u |
            while IFS= read -r shard; do
              case "$shard" in
                tests/ops|tests/e2e|tests/e2e/*) continue ;;
              esac
              printf '%s\n' "$shard"
            done > "$shard_list"

          expected_shards="$(wc -l < "$shard_list")"
          if (( expected_shards == 0 )); then
            echo "No collectible not-pg process shards discovered" >&2
            exit 1
          fi

          export marker log_dir status_file
          set +e
          xargs -r -n 1 -P 4 bash -c '
            shard="$1"
            safe="${shard//\//_}"
            log="$log_dir/$safe.log"
            started=$SECONDS
            python -m pytest -q -m "$marker" "$shard" --durations=20 \
              --ignore=tests/invariants/test_vault_multiwriter.py > "$log" 2>&1
            rc=$?
            if [[ "$rc" -eq 5 ]] && ! grep -Eq "FAILED|ERROR" "$log" && \
              grep -Eq "no tests ran|[0-9]+ deselected" "$log"; then
              rc=0
            fi
            echo "SHARD FINISHED ($rc): $shard in $((SECONDS - started))s"
            printf "%s %s\n" "$rc" "$shard" >> "$status_file"
            exit 0
          ' _ < "$shard_list"
          xargs_status=$?
          set -e

          actual_shards="$(wc -l < "$status_file" 2>/dev/null || true)"
          if (( xargs_status != 0 || actual_shards != expected_shards )); then
            echo "Process-shard runner incomplete (xargs=$xargs_status, expected=$expected_shards, actual=$actual_shards)" >&2
            exit 1
          fi

          : > pytest-not-pg.log
          failed=0
          while IFS=' ' read -r rc shard; do
            cat "$log_dir/${shard//\//_}.log" >> pytest-not-pg.log
            if (( rc != 0 )); then
              echo "SHARD FAILED ($rc): $shard" >&2
              cat "$log_dir/${shard//\//_}.log" >&2
              failed=1
            fi
          done < "$status_file"
          if (( failed != 0 )); then
            exit 1
          fi

          # These tests must observe an otherwise-quiescent host and exact
          # descriptor state; run them only after all parallel processes exit.
          python -m pytest -q -m "$marker" \
            tests/ops tests/invariants/test_vault_multiwriter.py | tee -a pytest-not-pg.log

      - name: Run scoped not-pg unit tests
        if: steps.changes.outputs.code == 'true' && steps.select-tests.outputs.full_suite != 'true'
        shell: bash
        # Several independently selected subsystems run serially in this step.
        # The 120-second per-test timeout still catches individual hangs.
        timeout-minutes: 35
        env:
          PYTEST_ADDOPTS: "--timeout=120 --timeout-method=thread"
        run: |
          set -o pipefail
          echo "Selected subsystems: ${{ steps.select-tests.outputs.subsystems }}"
          echo "Selection reason: ${{ steps.select-tests.outputs.reason }}"
          pytest ${{ steps.select-tests.outputs.pytest_args }} --durations=20 | tee pytest-not-pg.log

      - name: Skip unit tests for docs-only PR
        if: steps.changes.outputs.code != 'true'
        run: echo "Docs-only PR detected; skipping the unit-test lane."

      - name: Upload test logs
        if: always() && steps.changes.outputs.code == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pytest-not-pg-logs
          path: pytest-not-pg.log

      - name: Upload process shard logs
        if: always() && steps.changes.outputs.code == 'true' && steps.select-tests.outputs.full_suite == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pytest-not-pg-shards
          path: ${{ runner.temp }}/pytest-not-pg-shards/

  contract-validation:
    # Activated dead gates (#3892): the non-PR import-boundary check plus
    # OpenAPI/AsyncAPI validation and YAML/JSON lint moved here from the retired
    # workflow_dispatch-only ci.yml (validate-context job) and
    # architecture-ci.yaml (validate-contracts + arch-imports jobs) so they
    # run automatically on every PR touching their surfaces. Docs-only PRs
    # skip every heavy step via the paths filters below.
    if: >-
      github.event_name != 'pull_request'
      || github.event.action != 'edited'
      || github.event.changes.base.ref.from != null
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect contract surfaces
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            openapi:
              - 'api/**'
              - 'app/api/**'
              - '.github/workflows/ci-smoke.yaml'
            asyncapi:
              - 'events/**'
            yaml_json:
              - '**/*.yaml'
              - '**/*.yml'
              - '**/*.json'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Pull requests use the dedicated import-linter workflow so this gate
      # has one PR owner. CI Smoke still owns push/tag verification, where the
      # dedicated pull_request workflow does not run.
      - name: Install import-linter (non-PR)
        if: github.event_name != 'pull_request'
        run: |
          python -m pip install --upgrade pip
          pip install import-linter==2.11

      - name: Lint imports (import-linter, blocking, non-PR)
        if: github.event_name != 'pull_request'
        # bare `lint-imports` cannot auto-discover importlinter.ini — must pass --config
        run: lint-imports --config importlinter.ini

      - name: Install contract lint dependencies
        if: github.event_name != 'pull_request' || steps.changes.outputs.yaml_json == 'true' || steps.changes.outputs.openapi == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install yamllint jsonschema openapi-spec-validator
          npm install -g jsonlint

      - name: Lint YAML and JSON
        if: github.event_name != 'pull_request' || steps.changes.outputs.yaml_json == 'true'
        shell: bash
        run: |
          set -euo pipefail
          yamllint -c .yamllint.yml .
          find data -name "*.json" -not -path "./node_modules/*" -print0 | xargs -0 -r jsonlint -q

      - name: Validate context JSON against schema
        if: github.event_name != 'pull_request' || steps.changes.outputs.yaml_json == 'true'
        run: |
          python - <<'PY'
          import os
          import subprocess
          import sys

          schema = 'data/context/schema.yaml'
          for root, _, files in os.walk('data'):
              for name in files:
                  if not name.endswith('.json'):
                      continue
                  path = os.path.join(root, name)
                  subprocess.run([sys.executable, '-m', 'jsonschema', '-i', path, schema], check=True)
          PY

      - name: Ensure required context files exist
        if: github.event_name != 'pull_request' || steps.changes.outputs.yaml_json == 'true'
        run: |
          test -f data/context/roadmap.yaml
          test -f data/context/retrieval.yaml
          test -f golden/note_evergreen.md

      - name: Validate OpenAPI document
        if: github.event_name != 'pull_request' || steps.changes.outputs.openapi == 'true'
        run: python -m openapi_spec_validator api/openapi.yaml

      - name: Lint OpenAPI (Redocly)
        if: github.event_name != 'pull_request' || steps.changes.outputs.openapi == 'true'
        run: npx --yes @redocly/cli@latest lint api/openapi.yaml

      - name: Validate AsyncAPI
        if: steps.changes.outputs.asyncapi == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [ -f events/asyncapi.yaml ]; then
            npx --yes @asyncapi/cli@latest validate events/asyncapi.yaml
          else
            echo "events/asyncapi.yaml not present; the AsyncAPI gate activates when the spec lands."
          fi
