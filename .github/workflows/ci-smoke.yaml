name: ci-smoke

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.backend }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U app -d app"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    strategy:
      fail-fast: false
      matrix:
        backend: [memory, pg]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f dev-requirements.txt ]; then pip install -r dev-requirements.txt; fi
          if [ -f app/requirements.txt ]; then pip install -r app/requirements.txt; fi

      - name: DB migrate (pg only)
        if: matrix.backend == 'pg'
        env:
          PYTHONPATH: ${{ github.workspace }}
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          STORE_BACKEND: pg
          DATABASE_URL: postgresql+psycopg://app:app@localhost:5432/app
        run: |
          python - <<'PY'
          import subprocess, sys
          # Run Alembic if available; ignore if not present
          try:
              subprocess.check_call([sys.executable, "-m", "alembic", "upgrade", "head"])
          except Exception:
              pass
          PY

      - name: Check docs code fences
        env:
          PYTHONPATH: ${{ github.workspace }}
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          python scripts/check_code_fences.py

      - name: Run smoke tests
        env:
          PYTHONPATH: ${{ github.workspace }}
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          STORE_BACKEND: ${{ matrix.backend }}
          DATABASE_URL: postgresql+psycopg://app:app@localhost:5432/app
        run: |
          python -m pytest -q -c /dev/null tests -k "not slow"
