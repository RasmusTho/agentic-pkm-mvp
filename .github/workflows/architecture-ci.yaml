---
name: architecture-ci

# Stripped in #3892 (activate dead CI gates): this workflow was
# workflow_dispatch-only, so its gates never ran automatically.
# - import-linter, API/AsyncAPI contract validation, and YAML/JSON lint moved
#   to the PR-triggered ci-smoke.yaml (contract-validation job).
# - The search load check moved to integration-nightly.yaml.
# - The PG full-suite job was dropped: PG coverage is owned by
#   integration-nightly.yaml (pg-contracts), and the dropped job swallowed
#   migration failures with a "|| true" suffix on the upgrade step.
# What remains below is dispatch-only work with no PR/nightly home yet:
# - qas-010: QAS-010 latency probe against a live API+worker pair — too
#   heavy for the PR path and not yet promoted to the nightly lane.
# - docs-guard: optional secret-gated Codex docs-guardian autofix plus the
#   ADR index and docs guard scripts, operator-triggered.

on:
  workflow_dispatch:

permissions: read-all

jobs:
  qas-010:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://app:app@localhost:5432/app
      PYTHONPATH: ${{ github.workspace }}
      TRACE_LOG_PATH: /tmp/trace.jsonl
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r dev-requirements.txt
      - name: Bootstrap database
        run: |
          python - <<'PY'
          import psycopg
          import os
          from app.services.outbox import bootstrap

          bootstrap()
          dsn = os.environ['DATABASE_URL']
          with psycopg.connect(dsn, autocommit=True) as conn, conn.cursor() as cur:
              cur.execute(
                  "create table if not exists file_state (path text primary key, uuid text, fm_hash text, body_hash text, mtime timestamptz, last_seen timestamptz default now())"
              )
          PY
      - name: Start API
        run: nohup python -m uvicorn app.api.app:app --host 0.0.0.0 --port 8000 >/tmp/api.log 2>&1 &
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          TRACE_LOG_PATH: ${{ env.TRACE_LOG_PATH }}
      - name: Start worker
        run: nohup python -m app.workers.outbox_worker >/tmp/worker.log 2>&1 &
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          TRACE_LOG_PATH: ${{ env.TRACE_LOG_PATH }}
      - name: Wait for readiness
        run: |
          deadline=$((SECONDS+90))
          while [ $SECONDS -lt $deadline ]; do
            if curl -fsS http://localhost:8000/docs >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          echo "API did not become ready"
          cat /tmp/api.log || true
          cat /tmp/worker.log || true
          exit 1
      - name: Warm up API
        run: |
          for i in $(seq 1 5); do
            curl -fsS http://localhost:8000/docs >/dev/null 2>&1 || true
            sleep 1
          done
      - name: Seed and check latency
        run: python scripts/qas010_check.py

  docs-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/adr_index.py
      - run: python scripts/docs_guard.py
