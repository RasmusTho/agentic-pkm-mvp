name: architecture-ci

on:
  push:
    paths:
      - 'docs/**'
      - 'api/openapi.yaml'
      - 'events/asyncapi.yaml'
      - '.github/workflows/architecture-ci.yaml'
      - 'app/**'
      - 'tests/**'
      - 'importlinter.ini'
  pull_request:
    paths:
      - 'docs/**'
      - 'api/openapi.yaml'
      - 'events/asyncapi.yaml'
      - '.github/workflows/architecture-ci.yaml'
      - 'app/**'
      - 'tests/**'
      - 'importlinter.ini'

jobs:
  validate-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm i -g @redocly/cli @asyncapi/cli
      - name: Lint OpenAPI
        run: redocly lint api/openapi.yaml
      - name: Lint AsyncAPI
        run: asyncapi validate events/asyncapi.yaml

  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports:
          - 15432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r app/requirements.txt
      - run: pip install pytest uvicorn requests
      - name: Run tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:15432/app
        run: pytest -q

  arch-imports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install import-linter
      - name: Lint imports
        run: lint-imports


  k6-search:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports:
          - 15432:5432
      api:
        image: python:3.12-slim
        env:
          DATABASE_URL: postgresql://postgres:postgres@db:5432/app
        ports:
          - 18000:8000
        options: >-
          --health-cmd "bash -lc 'python -m pip install fastapi uvicorn psycopg[binary] pydantic && python - <<PY
from app.services.outbox import bootstrap
bootstrap()
print("ready")
PY'"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r app/requirements.txt || true
      - run: pip install fastapi uvicorn psycopg[binary] pydantic requests
      - name: Seed data
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:15432/app
        run: |
          python - <<'PY'
          from app.services.outbox import bootstrap, insert_object_and_outbox
          from app.agent.events import INGEST_OBJECT_CREATED, new_trace_id
          bootstrap()
          insert_object_and_outbox({"uuid":"u-k6","title":"Seed","review_state":"inbox","content":"smoke content for k6 search"}, INGEST_OBJECT_CREATED, new_trace_id())
          print("seeded")
          PY
      - uses: grafana/setup-k6@v1
      - run: k6 run scripts/k6_search.js
        env:
          BASE_URL: http://localhost:18000


  qas-010:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports:
          - 15432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r app/requirements.txt || true
      - run: pip install fastapi uvicorn psycopg[binary] pydantic requests
      - name: Start API
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:15432/app
          TRACE_LOG_PATH: /tmp/trace.jsonl
        run: nohup python -m uvicorn app.api.app:app --host 0.0.0.0 --port 8000 &
      - name: Start worker
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:15432/app
          TRACE_LOG_PATH: /tmp/trace.jsonl
        run: nohup python -m app.workers.outbox_worker &
      - name: Seed and check latency
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:15432/app
          QAS010_N: 20
        run: |
          sleep 2
          python scripts/qas010_check.py


  docs-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/adr_index.py
      - run: python scripts/docs_guard.py
