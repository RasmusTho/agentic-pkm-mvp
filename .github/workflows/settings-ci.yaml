name: settings-ci

on:
  push:
    paths:
      - "vault/@Settings/**"
      - "app/settings/**"
      - "docs/settings/**"
      - "app/events/bus.py"
      - ".github/workflows/settings-ci.yaml"
  pull_request:
    paths:
      - "vault/@Settings/**"
      - "app/settings/**"
      - "docs/settings/**"
      - "app/events/bus.py"
      - ".github/workflows/settings-ci.yaml"

permissions: read-all

jobs:
  settings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: pip install -r app/requirements.txt -r dev-requirements.txt
      - name: Compile vault settings
        env:
          LLM_PROVIDER: mock
          REASONING_PROVIDER: mock
          PLANNER_PROVIDER: mock
        run: python -m app.cli settings compile
      - name: Run settings tests
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          STORE_BACKEND: memory
          LLM_PROVIDER: mock
          REASONING_PROVIDER: mock
          PLANNER_PROVIDER: mock
        run: pytest -q tests/settings/test_compile.py tests/settings/test_prompt_registry.py tests/settings/test_standards_registry.py
