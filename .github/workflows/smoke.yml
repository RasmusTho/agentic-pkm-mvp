name: smoke
on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install system deps (ffmpeg, ripgrep)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg ripgrep

      - name: Install Python deps
        run: |
          python -m pip install -U pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f pyproject.toml ]; then pip install -e ".[dev]"; fi
      - name: Validate docs guardrails
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          diagrams = Path('docs/DIAGRAMS.md').read_text(encoding='utf-8')
          readme = Path('README.md').read_text(encoding='utf-8')

          if '```mermaid' not in diagrams:
              raise SystemExit('docs/DIAGRAMS.md must contain at least one ```mermaid block')
          if '<!-- DOCS-LINKS:BEGIN -->' not in readme or '<!-- DOCS-LINKS:END -->' not in readme:
              raise SystemExit('README.md missing DOCS-LINKS markers')
          if re.search(r"\\n", diagrams):
              raise SystemExit('docs/DIAGRAMS.md must not contain literal \n sequences')
          if re.search(r"^[ \t]+```mermaid", diagrams, re.MULTILINE):
              raise SystemExit('Mermaid fences must not be indented')
          if re.search(r"->\|[^|]*\$begin:math:text\$[^|]*\$end:math:text\$\|", diagrams, re.MULTILINE):
              raise SystemExit('Forbidden math fence syntax inside table detected')
          PY

      - name: Run smoke tests (mock LLM, no PG, fail-fast)
        timeout-minutes: 12
        env:
          LLM_PROVIDER: mock
          REASONING_PROVIDER: mock
          PLANNER_PROVIDER: mock
          REASONING_ENABLE: "1"
          LLM_MOCK_RESPONSE: '{"type":"note","trust":"own","tags":["topic/test"],"confidence":0.95}'
          STORE_BACKEND: memory
          KNOWLEDGE_PRIMARY_ADAPTER: fs_vault
          KNOWLEDGE_FALLBACK_ADAPTER: obsidian_cli
          KNOWLEDGE_STRICT_STARTUP: "0"
          KNOWLEDGE_ALLOW_FALLBACK: "0"
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pytest -c /dev/null -m "not pg and not alpha_llm" \
            tests/smoke \
            tests/agents/test_indexer.py::test_indexer_builds_embeddings_and_fts \
            tests/watcher/test_fs_watcher.py \
            tests/e2e/test_watcher_registry_e2e.py \
            tests/architecture/test_import_rules.py \
            tests/architecture/test_obsidian_port_boundaries.py \
            tests/guard/test_no_direct_db_imports.py \
            tests/ports/test_vault_port_contract.py \
            tests/ports/test_deprecated_sink_compat.py \
            tests/services/test_filesystem_vault_adapter.py \
            tests/services/test_vault_sync_lifecycle.py \
            --maxfail=1 -ra --durations=20

      - name: Ensure persisted vector index artifact exists
        env:
          INDEX_PERSIST_PATH: tmp/index.jsonl
        run: |
          mkdir -p "$(dirname "$INDEX_PERSIST_PATH")"
          if [ ! -s "$INDEX_PERSIST_PATH" ]; then
            echo '{"event":"smoke.index.persist.seed"}' > "$INDEX_PERSIST_PATH"
          fi
      - name: CLI smoke commands
        env:
          PYTHONPATH: ${{ github.workspace }}
          STORE_BACKEND: memory
          LLM_PROVIDER: mock
          REASONING_PROVIDER: mock
          PLANNER_PROVIDER: mock
          KNOWLEDGE_PRIMARY_ADAPTER: fs_vault
          KNOWLEDGE_FALLBACK_ADAPTER: obsidian_cli
          KNOWLEDGE_STRICT_STARTUP: "0"
          KNOWLEDGE_ALLOW_FALLBACK: "0"
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          python -m app.cli --help >/dev/null
          python -m app.cli health --json
