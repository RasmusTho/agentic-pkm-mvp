name: smoke
on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt', '**/dev-requirements.txt', 'requirements-smoke.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          if [ -f dev-requirements.txt ]; then pip install -r dev-requirements.txt; fi
          if [ -f app/requirements.txt ]; then pip install -r app/requirements.txt; fi
          pip install -r requirements-smoke.txt

      - name: Run smoke
        env:
          STORE_BACKEND: memory
          SKIP_CLASSIFIER_TESTS: "1"
        run: |
          pytest -q tests/system/test_settings_schema.py tests/guard/test_no_direct_db_imports.py tests/test_agent_smoke.py

  automerge:
    needs: smoke
    if: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'automerge') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Merge PR (squash + delete branch)
        run: gh pr merge ${{ github.event.pull_request.number }} --squash --delete-branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
