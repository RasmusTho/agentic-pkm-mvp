name: smoke
on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install system deps (ffmpeg)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python deps
        run: |
          python -m pip install -U pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f pyproject.toml ]; then pip install -e ".[dev]"; fi
      - name: Validate docs guardrails
        run: |
          rg -q '```mermaid' docs/DIAGRAMS.md
          rg -q '<!-- DOCS-LINKS:BEGIN -->' README.md
          rg -q '<!-- DOCS-LINKS:END -->' README.md
          ! rg -n '\\n' docs/DIAGRAMS.md
          ! rg -n '^\s+```mermaid' docs/DIAGRAMS.md
          ! rg -n '->\|[^|]*\$begin:math:text$[^|]*\$end:math:text$\|' docs/DIAGRAMS.md || true

      - name: Run smoke tests (mock LLM, no PG)
        env:
          LLM_PROVIDER: mock
          LLM_MOCK_RESPONSE: '{"type":"note","trust":"own","tags":["topic/test"],"confidence":0.95}'
          STORE_BACKEND: memory
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pytest -q -c /dev/null -m "not pg"
      - name: CLI smoke commands
        env:
          PYTHONPATH: ${{ github.workspace }}
          STORE_BACKEND: memory
          LLM_PROVIDER: mock
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          python -m app.cli --help >/dev/null
          python -m app.cli health --json
