name: Smoke
on:
  push:
    branches: [ main, chore/**, feature/** ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install smoke deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-smoke.txt

      - name: Run smoke tests
        env:
          SKIP_CLASSIFIER_TESTS: "1"
          STORE_BACKEND: "memory"
        run: |
          pytest -q \
            tests/system/test_settings_schema.py \
            tests/guard/test_no_direct_db_imports.py \
            tests/test_agent_smoke.py
