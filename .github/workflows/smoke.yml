name: Smoke

on:
  push:
    branches: [ main, chore/**, feature/** ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      STORE_BACKEND: memory
      SKIP_CLASSIFIER_TESTS: "1"
      PIP_PREFER_BINARY: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: requirements-smoke.txt
      - name: Install smoke deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-smoke.txt
      - name: Run smoke tests
        env:
          SKIP_CLASSIFIER_TESTS: "1"
          STORE_BACKEND: "memory"
        run: |
          pytest -q \
            tests/system/test_settings_schema.py \
            tests/guard/test_no_direct_db_imports.py \
            tests/test_agent_smoke.py
