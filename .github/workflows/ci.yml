name: CI
on: [push, pull_request]
jobs:
  validate-context:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint YAML
        uses: ibiqlik/action-yamllint@v3
        with:
          config_file: .yamllint.yml
      - name: Ensure required files exist
        run: |
          test -f data/context/roadmap.yaml
          test -f data/context/retrieval.yaml
          test -f golden/note_evergreen.md
  ws-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker compose up -d --build
      - run: |
          # give API time to boot
          for i in $(seq 1 20); do curl -sf localhost:18000/query?q=hello && exit 0; sleep 1; done; exit 1
      - run: docker compose logs api
