---
name: CI
on:
  workflow_dispatch:
jobs:
  validate-context:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install lint dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yamllint jsonschema
          npm install -g jsonlint
      - name: Lint YAML and JSON
        run: |
          yamllint -c .yamllint.yml . | tee .yamllint.log
          : > .jsonlint.log
          find data -name "*.json" -not -path "./node_modules/*" -print0 | while IFS= read -r -d '' file; do
            echo "checking ${file}" >> .jsonlint.log
            jsonlint -q "${file}" >> .jsonlint.log 2>&1
          done
          python - <<'PY'
          import os
          import subprocess
          import sys
          schema = 'data/context/schema.yaml'
          for root, _, files in os.walk('data'):
              for name in files:
                  if name.endswith('.json'):
                      path = os.path.join(root, name)
                      subprocess.run([sys.executable, '-m', 'jsonschema', '-i', path, schema], check=True)
          PY
      - name: Upload lint logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validate-context-lint
          path: |
            .yamllint.log
            .jsonlint.log
      - name: Ensure required files exist
        run: |
          test -f data/context/roadmap.yaml
          test -f data/context/retrieval.yaml
          test -f golden/note_evergreen.md
  ws-smoke:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install API dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt
      - name: Start API
        run: nohup python -m uvicorn app.api.app:app --host 0.0.0.0 --port 8000 >/tmp/ws-api.log 2>&1 &
      - name: Wait for readiness
        run: |
          deadline=$((SECONDS+90))
          while [ $SECONDS -lt $deadline ]; do
            if curl -fsS "http://localhost:8000/docs" >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          echo "API did not become ready"
          cat /tmp/ws-api.log || true
          exit 1
      - name: Smoke query
        run: curl -fsS "http://localhost:8000/query?q=hello"
      - name: Dump API log on failure
        if: failure()
        run: cat /tmp/ws-api.log
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://app:app@localhost:5432/app
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt
          pip install -r dev-requirements.txt
      - name: Upgrade database
        run: alembic upgrade head || true
      - name: Run tests
        run: pytest -q | tee pytest.log
      - name: Run fitness report
        run: |
          mkdir -p tmp
          python -m app.fitness.report | tee tmp/ci_summary.log
      - name: Verify CI gates
        run: |
          python - <<'PY'
          from pathlib import Path
          from app.fitness.report import parse_summary_lines, SUMMARY_LABELS

          lines = Path("tmp/ci_summary.log").read_text(encoding="utf-8").splitlines()
          parsed = parse_summary_lines(lines, required=SUMMARY_LABELS)
          if set(parsed.keys()) != set(SUMMARY_LABELS):
              missing = set(SUMMARY_LABELS) - set(parsed.keys())
              extra = set(parsed.keys()) - set(SUMMARY_LABELS)
              raise SystemExit(f"Unexpected CI summary labels. Missing: {missing}, extra: {extra}")
          gates = parsed.get("GATES") or {}
          ok_status = str(gates.get("ok", "false")).lower()
          reasons = gates.get("reasons")
          print(f"CI gates status: {ok_status} reasons={reasons}")
          if ok_status != "true":
              raise SystemExit(f"CI gates failed: {gates}")
          PY
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-logs
          path: pytest.log
