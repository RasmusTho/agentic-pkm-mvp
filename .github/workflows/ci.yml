name: CI

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt
          if [ -f dev-requirements.txt ]; then pip install -r dev-requirements.txt; fi

      - name: Run Ruff
        run: |
          . .venv/bin/activate
          ruff check .

      - name: Run mypy
        run: |
          . .venv/bin/activate
          mypy app tests

      - name: Alembic upgrade dry-run
        run: |
          . .venv/bin/activate
          alembic -c app/alembic.ini upgrade head --sql > /tmp/alembic.sql

      - name: Run pytest
        run: |
          . .venv/bin/activate
          pytest
