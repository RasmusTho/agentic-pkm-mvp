---
name: App Image Build

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'app/**'
      - 'scripts/start_api.sh'
      - 'Dockerfile'
      - 'Dockerfile.builderops'
      - 'Dockerfile.builderops-postgres'
      - 'docker-compose.builderops.yml'
      - 'scripts/builderops/**'
      - 'requirements.txt'
      - 'requirements-tts.txt'
      - '.github/workflows/app-image-build.yml'

permissions:
  contents: read
  packages: write

jobs:
  build-app-image:
    name: Build SHA-tagged app image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute build identity
        id: build-identity
        shell: bash
        run: |
          set -euo pipefail
          vcs_ref="${GITHUB_SHA}"
          built_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          image="ghcr.io/${owner}/pkm-app:${vcs_ref}"

          echo "VCS_REF=${vcs_ref}" >> "${GITHUB_ENV}"
          echo "BUILT_AT=${built_at}" >> "${GITHUB_ENV}"
          echo "image=${image}" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      - name: Login to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build app image (PR validation)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          load: true
          push: false
          platforms: linux/amd64
          tags: ${{ steps.build-identity.outputs.image }}
          build-args: |
            VCS_REF=${{ env.VCS_REF }}
            BUILT_AT=${{ env.BUILT_AT }}

      - name: Build and push app image (main multi-arch)
        id: build-app-main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.build-identity.outputs.image }}
          platforms: linux/amd64,linux/arm64
          build-args: |
            VCS_REF=${{ env.VCS_REF }}
            BUILT_AT=${{ env.BUILT_AT }}

      - name: Verify image runtime version
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --entrypoint python \
            "${{ steps.build-identity.outputs.image }}" \
            -c 'from app.version import get_runtime_version; import os; version = get_runtime_version(); assert version["git_sha"] == os.environ["VCS_REF"], version; assert version["built_at"] == os.environ["BUILT_AT"], version'

      - name: Probe TTS engines in PR image
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --entrypoint sh \
            "${{ steps.build-identity.outputs.image }}" \
            -ec 'command -v piper >/dev/null; piper --help >/dev/null 2>&1; python -c "import asyncio; import kokoro_onnx; from app.api.routes.health_contract import healthz; from app.main import app; assert app is not None; assert asyncio.run(healthz()) == {\"ok\": True}"'

      - name: Verify pushed app image runtime, platforms, and TTS engines
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          image="${{ steps.build-identity.outputs.image }}"
          image_ref="${image%:*}@${{ steps.build-app-main.outputs.digest }}"
          manifest_json="$(mktemp)"
          proof_file="app-image-tts-engine-proof.json"
          docker buildx imagetools inspect --raw "${image_ref}" > "${manifest_json}"

          jq -n \
            --arg contract "app-image-tts-engine-proof.v1" \
            --arg candidate_sha "${GITHUB_SHA}" \
            --arg image "${image}" \
            --arg image_ref "${image_ref}" \
            --arg image_index_digest "${{ steps.build-app-main.outputs.digest }}" \
            --arg probe_scope "package_presence_cli_load_import_app_health" \
            '{contract: $contract, candidate_sha: $candidate_sha, image: $image, image_ref: $image_ref, image_index_digest: $image_index_digest, probe_scope: $probe_scope, platforms: []}' \
            > "${proof_file}"

          failures=0
          for platform in linux/amd64 linux/arm64; do
            architecture="${platform#linux/}"
            platform_digest="$(jq -er \
              --arg architecture "${architecture}" \
              '.manifests[] | select(.platform.os == "linux" and .platform.architecture == $architecture) | .digest' \
              "${manifest_json}")"
            platform_ref="${image%:*}@${platform_digest}"
            probe_result="pass"
            if ! docker run --rm \
              --platform "${platform}" \
              --entrypoint sh \
              "${platform_ref}" \
              -ec 'command -v piper >/dev/null; piper --help >/dev/null 2>&1; python -c "import asyncio; import kokoro_onnx; import os; from app.api.routes.health_contract import healthz; from app.main import app; from app.version import get_runtime_version; version = get_runtime_version(); assert app is not None; assert asyncio.run(healthz()) == {\"ok\": True}; assert version[\"git_sha\"] == os.environ[\"VCS_REF\"], version; assert version[\"built_at\"] == os.environ[\"BUILT_AT\"], version"'; then
              probe_result="fail"
              failures=$((failures + 1))
            fi

            jq \
              --arg platform "${platform}" \
              --arg platform_digest "${platform_digest}" \
              --arg probe_result "${probe_result}" \
              '.platforms += [{platform: $platform, platform_digest: $platform_digest, probe_result: $probe_result}]' \
              "${proof_file}" > "${proof_file}.tmp"
            mv "${proof_file}.tmp" "${proof_file}"
          done

          jq -e '
            .contract == "app-image-tts-engine-proof.v1" and
            (.candidate_sha | length == 40) and
            (.image_index_digest | startswith("sha256:")) and
            .probe_scope == "package_presence_cli_load_import_app_health" and
            ([.platforms[].platform] | sort == ["linux/amd64", "linux/arm64"]) and
            (all(.platforms[]; (.platform_digest | startswith("sha256:")) and .probe_result == "pass"))
          ' "${proof_file}"
          if [ "${failures}" -ne 0 ]; then
            exit 1
          fi

      - name: Upload TTS engine proof
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: app-image-tts-engine-proof-${{ github.sha }}
          path: app-image-tts-engine-proof.json
          if-no-files-found: error

  build-builderops-images:
    name: Build independent BuilderOps images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute immutable BuilderOps image identities
        id: images
        shell: bash
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "control_plane=ghcr.io/${owner}/builderops-control-plane:${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"
          echo "postgres=ghcr.io/${owner}/builderops-postgres:${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"
          echo "BUILT_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "${GITHUB_ENV}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      - name: Login to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build BuilderOps control-plane candidate image
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.builderops
          load: true
          push: false
          platforms: linux/amd64
          tags: ${{ steps.images.outputs.control_plane }}
          build-args: |
            VCS_REF=${{ github.sha }}
            BUILT_AT=${{ env.BUILT_AT }}

      - name: Build BuilderOps PostgreSQL plus WAL-G candidate image
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.builderops-postgres
          load: true
          push: false
          platforms: linux/amd64
          tags: ${{ steps.images.outputs.postgres }}

      - name: Verify BuilderOps image runtimes
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --entrypoint python \
            "${{ steps.images.outputs.control_plane }}" \
            -c 'from app.builderops.control_plane.service import production_app; assert callable(production_app)'
          docker run --rm --entrypoint wal-g \
            "${{ steps.images.outputs.postgres }}" --version

      - name: Prove encrypted full-backup plus archived-WAL restore
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        shell: bash
        run: |
          set -euo pipefail
          scripts/builderops/real_restore_selftest.sh \
            "${{ steps.images.outputs.control_plane }}" \
            "${{ steps.images.outputs.postgres }}"

      - name: Publish the exact restore-proved BuilderOps images
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          docker push "${{ steps.images.outputs.control_plane }}"
          docker push "${{ steps.images.outputs.postgres }}"

      - name: Write the restore-proved candidate pair receipt
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          control_digest="$(docker image inspect --format '{{index .RepoDigests 0}}' "${{ steps.images.outputs.control_plane }}")"
          postgres_digest="$(docker image inspect --format '{{index .RepoDigests 0}}' "${{ steps.images.outputs.postgres }}")"
          python3 scripts/builderops/write_candidate_pair_receipt.py \
            --output builderops-candidate-pair.json \
            --source-sha "${GITHUB_SHA}" \
            --control-plane-digest "${control_digest#*@}" \
            --postgres-walg-digest "${postgres_digest#*@}"

      - name: Upload the restore-proved candidate pair receipt
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: builderops-candidate-pair-${{ github.sha }}
          path: builderops-candidate-pair.json
          if-no-files-found: error

  attest-builderops-candidate-pair:
    name: Attest trusted BuilderOps candidate pair
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-builderops-images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download the restore-proved candidate pair receipt
        uses: actions/download-artifact@v4
        with:
          name: builderops-candidate-pair-${{ github.sha }}

      - name: Attest the restore-proved candidate pair receipt
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: builderops-candidate-pair.json
