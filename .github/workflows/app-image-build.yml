---
name: App Image Build

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'app/**'
      - 'scripts/start_api.sh'
      - 'Dockerfile'
      - 'requirements.txt'
      - 'requirements-tts.txt'
      - '.github/workflows/app-image-build.yml'

permissions:
  contents: read
  packages: write

jobs:
  build-app-image:
    name: Build SHA-tagged app image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute build identity
        id: build-identity
        shell: bash
        run: |
          set -euo pipefail
          vcs_ref="${GITHUB_SHA}"
          built_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          image="ghcr.io/${owner}/pkm-app:${vcs_ref}"

          echo "VCS_REF=${vcs_ref}" >> "${GITHUB_ENV}"
          echo "BUILT_AT=${built_at}" >> "${GITHUB_ENV}"
          echo "image=${image}" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      - name: Login to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build app image (PR validation)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          load: true
          push: false
          platforms: linux/amd64
          tags: ${{ steps.build-identity.outputs.image }}
          build-args: |
            VCS_REF=${{ env.VCS_REF }}
            BUILT_AT=${{ env.BUILT_AT }}

      - name: Build and push app image (main multi-arch)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.build-identity.outputs.image }}
          platforms: linux/amd64,linux/arm64
          build-args: |
            VCS_REF=${{ env.VCS_REF }}
            BUILT_AT=${{ env.BUILT_AT }}

      - name: Verify image runtime version
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --entrypoint python \
            "${{ steps.build-identity.outputs.image }}" \
            -c 'from app.version import get_runtime_version; import os; version = get_runtime_version(); assert version["git_sha"] == os.environ["VCS_REF"], version; assert version["built_at"] == os.environ["BUILT_AT"], version'

      - name: Verify pushed app image runtime version and platforms
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          image="${{ steps.build-identity.outputs.image }}"
          manifest_platforms="$(docker buildx imagetools inspect "${image}" | awk '
            $1 == "Platform:" {
              print $2
            }
          ' | sort -u)"
          echo "Discovered manifest platforms:"
          echo "${manifest_platforms}"
          for required_platform in linux/amd64 linux/arm64; do
            if ! echo "${manifest_platforms}" | grep -qx "${required_platform}"; then
              echo "missing required platform in image manifest: ${required_platform}"
              exit 1
            fi
          done
          docker run --rm \
            --platform linux/amd64 \
            --entrypoint python \
            "${image}" \
            -c 'from app.version import get_runtime_version; import os; version = get_runtime_version(); assert version["git_sha"] == os.environ["VCS_REF"], version; assert version["built_at"] == os.environ["BUILT_AT"], version'
