---
name: import-linter

# Blocking import-boundary check. Runs the directional import contract
# (importlinter.ini, governed by docs/adr/ADR-0013-code-dependency-direction.md)
# on every PR. Flipped from advisory to blocking in #2481: all known violations
# at adoption were fixed by the time this PR landed, so the contract runs clean
# (exit 0) and no allowlist is required.
#
# Any new backward/directional import from a non-interaction module into the
# interaction layer (app.api, app.chat, app.cli, app.web) will now FAIL the job
# and block merge.

on:
  pull_request:
  workflow_dispatch:

permissions: read-all

jobs:
  import-linter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install import-linter
        run: |
          python -m pip install --upgrade pip
          pip install import-linter==2.11
      - name: Lint imports (blocking)
        run: lint-imports --config importlinter.ini
