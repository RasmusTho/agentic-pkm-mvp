name: release-uat

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions: read-all

jobs:
  uat-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: ${{ github.workspace }}
      STORE_BACKEND: memory
      LLM_PROVIDER: mock
      REASONING_PROVIDER: mock
      PLANNER_PROVIDER: mock
      REASONING_ENABLE: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      KNOWLEDGE_PRIMARY_ADAPTER: fs_vault
      KNOWLEDGE_FALLBACK_ADAPTER: obsidian_cli
      KNOWLEDGE_STRICT_STARTUP: "0"
      KNOWLEDGE_ALLOW_FALLBACK: "0"
      INDEX_PERSIST_PATH: tmp/index.jsonl
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: |
          python -m pip install -U pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f pyproject.toml ]; then pip install -e ".[dev]"; fi

      - name: Prepare tmp dir
        run: mkdir -p tmp

      - name: "Quality Wave gate (UAT harness)"
        run: |
          pytest -c /dev/null -v \
            tests/quality_wave/test_uat_harness.py \
            -m "not pg" \
            --tb=short

      - name: "Golden vault snapshots"
        run: |
          pytest -c /dev/null -v \
            tests/quality_wave/test_golden_vault_snapshot.py \
            -m "not pg" \
            --tb=short

      - name: "Full Quality Wave suite"
        shell: bash
        run: |
          set -o pipefail
          pytest -c /dev/null -q \
            tests/quality_wave/ \
            -m "not pg" \
            --durations=10 \
            | tee tmp/uat-pytest.log

      - name: Fitness report
        run: |
          python -m app.fitness.report | tee tmp/ci_summary.log

      - name: Verify CI gates
        run: |
          python - <<'PY'
          from pathlib import Path
          from app.fitness.report import parse_summary_lines, SUMMARY_LABELS

          lines = Path("tmp/ci_summary.log").read_text(encoding="utf-8").splitlines()
          parsed = parse_summary_lines(lines, required=SUMMARY_LABELS)
          gates = parsed.get("GATES") or {}
          ok_status = str(gates.get("ok", "false")).lower()
          reasons = gates.get("reasons")
          print(f"CI gates status: {ok_status} reasons={reasons}")
          if ok_status != "true":
              raise SystemExit(f"CI gates failed: {gates}")
          PY

      - name: Upload UAT log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uat-pytest-log
          path: tmp/uat-pytest.log
