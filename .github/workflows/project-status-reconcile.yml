name: Project Status Reconcile

on:
  issues:
    types: [opened, reopened, closed, labeled, unlabeled]
  schedule:
    # Daily drift-catch only. The hourly scan was the dominant GraphQL drain
    # (full board re-paginated + every item re-read, 24x/day). During a
    # GraphQL-budget incident prefer a manual `workflow_dispatch` full scan.
    # See docs/audits/GITHUB_API_EXHAUSTION_2026-06-29.md :: GHAPI-C2.
    - cron: '17 7 * * *'
  workflow_dispatch:

concurrency:
  # Serialize every GitHub Project board reconcile/mutation workflow so only one
  # board writer runs at a time across this and the project-pr-* workflows
  # (prevents the multi-workflow GraphQL stampede). Queue, never cancel.
  group: github-project-board-reconcile
  cancel-in-progress: false

permissions:
  contents: read
  issues: read
  pull-requests: read
  repository-projects: write

jobs:
  reconcile-issue:
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconcile issue project status
        env:
          # GITHUB_TOKEN cannot write to a user-owned ProjectV2 board; a PAT/App
          # token with Projects read/write is required. Falls back to the default
          # token (graceful no-op) when PROJECT_TOKEN is unset.
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/reconcile_project_status.py \
            --repo "${{ github.repository }}" \
            --issue "${{ github.event.issue.number }}"

  reconcile-scan:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconcile existing project items
        env:
          # GITHUB_TOKEN cannot write to a user-owned ProjectV2 board; a PAT/App
          # token with Projects read/write is required. Falls back to the default
          # token (graceful no-op) when PROJECT_TOKEN is unset.
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/reconcile_project_status.py \
            --repo "${{ github.repository }}" \
            --scan
