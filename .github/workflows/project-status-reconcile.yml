name: Optional Project Projection Reconcile

on:
  issues:
    types: [opened, reopened, closed, labeled, unlabeled]
  schedule:
    # Daily drift-catch only. The hourly scan was the dominant GraphQL drain
    # (full board re-paginated + every item re-read, 24x/day). During a
    # GraphQL-budget incident prefer a manual `workflow_dispatch` full scan.
    # See issue #2681 (daily + budget-gated reconcile) for rationale.
    - cron: '17 7 * * *'
  workflow_dispatch:

concurrency:
  # Optional legacy projection only; Issue/PR state and labels remain authoritative.
  # Serialize every GitHub Project board reconcile/mutation workflow so only one
  # board writer runs at a time across this and the project-pr-* workflows
  # (prevents the multi-workflow GraphQL stampede). `queue: max` keeps up to 100
  # pending runs in FIFO order so bursts of board events are not dropped — the
  # default `queue: single` would cancel all but the latest pending run even with
  # cancel-in-progress:false.
  group: github-project-board-reconcile
  cancel-in-progress: false
  queue: max

permissions:
  contents: read
  issues: read
  pull-requests: read
  repository-projects: write

jobs:
  reconcile-issue:
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect board automation App configuration
        id: project-app-config
        shell: bash
        env:
          PROJECT_APP_ID: ${{ secrets.PROJECT_APP_ID }}
          PROJECT_APP_PRIVATE_KEY: ${{ secrets.PROJECT_APP_PRIVATE_KEY }}
        run: |
          if [[ -n "$PROJECT_APP_ID" && -n "$PROJECT_APP_PRIVATE_KEY" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Create board automation App token
        id: project-app-token
        if: ${{ steps.project-app-config.outputs.configured == 'true' }}
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.PROJECT_APP_ID }}
          private-key: ${{ secrets.PROJECT_APP_PRIVATE_KEY }}
          permission-repository-projects: write
          permission-issues: read
          permission-pull-requests: read
      - name: Reconcile issue project status
        env:
          # The App installation token isolates board automation from interactive
          # agent quota. Falls back to GITHUB_TOKEN (graceful no-op) when the App
          # secrets are absent.
          GH_TOKEN: ${{ steps.project-app-token.outputs.token || secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/reconcile_project_status.py \
            --repo "${{ github.repository }}" \
            --issue "${{ github.event.issue.number }}"

  reconcile-scan:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore scan watermark
        # Scheduled runs only: workflow_dispatch is the documented manual
        # full-scan escape hatch (see the schedule comment above and issue
        # #2681). Restoring the watermark on dispatch would make that path
        # skip the same stale items an operator is dispatching to repair.
        if: github.event_name == 'schedule'
        uses: actions/cache@v4
        with:
          path: runtime/dispatcher/project_status_reconcile_scan_watermark.json
          key: project-status-reconcile-scan-watermark-${{ github.run_id }}
          restore-keys: |
            project-status-reconcile-scan-watermark-
      - name: Detect board automation App configuration
        id: project-app-config
        shell: bash
        env:
          PROJECT_APP_ID: ${{ secrets.PROJECT_APP_ID }}
          PROJECT_APP_PRIVATE_KEY: ${{ secrets.PROJECT_APP_PRIVATE_KEY }}
        run: |
          if [[ -n "$PROJECT_APP_ID" && -n "$PROJECT_APP_PRIVATE_KEY" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Create board automation App token
        id: project-app-token
        if: ${{ steps.project-app-config.outputs.configured == 'true' }}
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.PROJECT_APP_ID }}
          private-key: ${{ secrets.PROJECT_APP_PRIVATE_KEY }}
          permission-repository-projects: write
          permission-issues: read
          permission-pull-requests: read
      - name: Reconcile existing project items
        env:
          # The App installation token isolates board automation from interactive
          # agent quota. Falls back to GITHUB_TOKEN (graceful no-op) when the App
          # secrets are absent.
          GH_TOKEN: ${{ steps.project-app-token.outputs.token || secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/reconcile_project_status.py \
            --repo "${{ github.repository }}" \
            --scan
