[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "workspace-agentic-ai"
version = "0.1.0"
description = "Agentisk AI MVP"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1,<9",
    "faster-whisper>=1.0.0",
    "yt-dlp>=2024.7.2",
    "rank-bm25>=0.2.2",
    "numpy>=1.26",
    "tqdm>=4.66",
    "httpx>=0.27",
    "pydantic>=2.7",
    "rapidfuzz>=3.0",
    "orjson>=3.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.9",
    "deepeval>=0.20.60",
    "ragas>=0.1.11",
    "datasets>=2.21.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "tests*"]
