[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "workspace-agentic-ai"
version = "0.1.0"
description = "Agentisk AI MVP"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # CLI / media / retrieval
    # Upper bound is load-bearing: Click 8.2 removed CliRunner's mix_stderr
    # kwarg (tests/_click_compat.py shims around it, but stay in the
    # validated range so `pip install -e .` matches requirements.txt).
    "click>=8.1,<8.2",
    "faster-whisper>=1.0.0",
    "yt-dlp>=2024.7.2",
    "bgutil-ytdlp-pot-provider>=1.3.1",
    "rank-bm25>=0.2.2",
    "numpy>=2.0",
    "tqdm>=4.66",
    "markdown-it-py>=4.0,<5",
    "regex>=2026.5,<2027",
    "httpx>=0.27",
    "pydantic>=2.7",
    "rapidfuzz>=3.0",
    "orjson>=3.11.6",
    "ormsgpack>=1.12",
    "xxhash>=3.6",
    "zstandard>=0.25",
    # Web / API layer
    "fastapi>=0.115,<1",
    "python-multipart>=0.0.20",
    "uvicorn>=0.30",
    # Upper bound is load-bearing: Starlette 1.3 wraps include_router()
    # sub-routers in an internal representation that breaks naive
    # app.routes walks (see tests/_route_introspection.py).
    "starlette>=1.0,<1.3",
    "slowapi>=0.1.9",
    "prometheus-fastapi-instrumentator>=6.0",
    "prometheus-client>=0.20",
    # Data / persistence
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "alembic>=1.13",
    "aiosqlite>=0.20",
    "redis>=5.0",
    "cryptography>=42.0",
    # Settings / config
    "pydantic-settings>=2.5",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
    "jsonschema>=4.23",
    # jsonschema's "date-time" format checker is a no-op without this validator
    # registered (app/standing_questions/question_store.py's format_checker).
    "rfc3339-validator>=0.1.4",
    # LangGraph / LangChain
    "langchain-core>=0.3",
    "langgraph>=0.2",
    "langgraph-checkpoint>=2.0",
    "langgraph-checkpoint-sqlite>=2.0",
    "langgraph-prebuilt>=0.3",
    "langgraph-sdk>=0.1",
    # Resilience / async
    "tenacity>=8.0",
    "watchfiles>=0.21",
    "websockets>=13.0",
    # HTTP / serialization utilities
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=1.4,<2",
    "pytest-xdist>=3.6",
    "ruff>=0.5",
    "mypy>=1.9,<2",
    # dev-requirements.txt (CI's pinned mypy install) carries this stub
    # package; without it here too, a fresh `pip install -e .[dev]` gets
    # 29 spurious "Library stubs not installed for yaml" mypy errors.
    "types-PyYAML>=6.0.12",
    "deepeval>=0.20.60",
    "ragas>=0.1.11",
    "datasets>=2.21.0",
    "hypothesis>=6.108.0",
]
browser = [
    "playwright>=1.48,<2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.package-data]
"app.settings" = ["*.yaml"]
"app.builderops.control_plane.migrations" = ["*.sql"]
