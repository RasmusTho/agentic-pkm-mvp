services:
  db:
    image: pgvector/pgvector:pg16
    env_file:
      - ./config/runtime.defaults.env
    ports:
      - "15432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\" -h \"$${POSTGRES_HEALTHCHECK_HOST}\""]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 10s

  ollama:
    image: ollama/ollama:latest
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama
    restart: unless-stopped

  api:
    build: .
    image: workspace-app
    working_dir: /app
    env_file:
      - ./config/runtime.defaults.env
      - path: ${WATCHER_RUNTIME_ENV_FILE:-./tmp/runtime.env}
        required: false
    user: "${LOCAL_UID:-0}:${LOCAL_GID:-0}"
    volumes:
      - ./:/app
      # Bind-mount source is the HOST vault path. VAULT_HOST_ROOT (from
      # tmp/runtime.env / start_full_system.sh) carries it so the container's
      # own VAULT_ROOT can be the in-container mount path /app/vault without
      # corrupting this source (issue #2141). VAULT_ROOT/./vault kept as fallback.
      - "${VAULT_HOST_ROOT:-${VAULT_ROOT:-./vault}}:/app/vault"
      # External-SSD TTS store (models/cache/logs) bind-mounted to a fixed container path.
      # Host root is machine-local (${TTS_HOST_ROOT} in .env.prod.local); defaults to a dev scratch dir.
      - "${TTS_HOST_ROOT:-./tmp/tts}:/data/tts"
    command: ["/bin/bash", "-c", "mkdir -p /app/tmp && bash /app/scripts/start_api.sh"]
    environment:
      VAULT_LAYOUT_NOTE_REL: ${VAULT_LAYOUT_NOTE_REL:-}
      VAULT_SYSTEM_DIR_REL: ${VAULT_SYSTEM_DIR_REL:-}
      VAULT_INBOX_DIR_REL: ${VAULT_INBOX_DIR_REL:-}
      VAULT_DESK_DIR_REL: ${VAULT_DESK_DIR_REL:-}
      LLM_PROVIDER: ${LLM_PROVIDER}
      # Agentic Lab canvas surface gate (app/api/routes/canvas.py). Default off so
      # prod stays disabled; export CANVAS_ENABLED=1 to enable for dev/UAT.
      CANVAS_ENABLED: ${CANVAS_ENABLED:-0}
      # Fixed in-container TTS paths — the SSD bind-mount lands at /data/tts regardless of host path.
      TTS_MODEL_DIR: /data/tts/models
      TTS_CACHE_DIR: /data/tts/cache
      TTS_LOG_DIR: /data/tts/logs
      # Read-back master switch. Compose interpolation only sees shell vars, a
      # default .env, or the --env-file passed by the start wrappers; the source
      # tmp/runtime.env is populated from .env by export_runtime_env.sh so an
      # operator's TTS_ENABLED=true actually reaches load_tts_config() (#2189).
      TTS_ENABLED: ${TTS_ENABLED:-false}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "18000:8000"
    depends_on:
      - db
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python - <<'PY'\nimport os, urllib.request, sys\ntry:\n    urllib.request.urlopen(os.environ['API_HEALTHCHECK_URL'], timeout=2)\n    sys.exit(0)\nexcept Exception:\n    sys.exit(1)\nPY"]
      interval: 10s
      timeout: 3s
      retries: 3

  worker:
    build: .
    image: workspace-app
    working_dir: /app
    env_file:
      - ./config/runtime.defaults.env
      - path: ${WATCHER_RUNTIME_ENV_FILE:-./tmp/runtime.env}
        required: false
    user: "${LOCAL_UID:-0}:${LOCAL_GID:-0}"
    volumes:
      - ./:/app
      - "${VAULT_HOST_ROOT:-${VAULT_ROOT:-./vault}}:/app/vault"
    command: ["/bin/bash", "-c", "mkdir -p /app/tmp && python -m app.workers.outbox_worker"]
    environment:
      VAULT_LAYOUT_NOTE_REL: ${VAULT_LAYOUT_NOTE_REL:-}
      VAULT_SYSTEM_DIR_REL: ${VAULT_SYSTEM_DIR_REL:-}
      VAULT_INBOX_DIR_REL: ${VAULT_INBOX_DIR_REL:-}
      VAULT_DESK_DIR_REL: ${VAULT_DESK_DIR_REL:-}
      LLM_PROVIDER: ${LLM_PROVIDER}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - db
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "test -s \"$${WORKER_HEARTBEAT_PATH}\""]
      interval: 20s
      timeout: 5s
      retries: 3

  watcher:
    build: .
    image: workspace-app
    working_dir: /app
    user: "${LOCAL_UID:-0}:${LOCAL_GID:-0}"
    env_file:
      - ./config/runtime.defaults.env
      - path: ${WATCHER_RUNTIME_ENV_FILE:-./tmp/runtime.env}
        required: false
    volumes:
      - ./:/app
      - "${VAULT_HOST_ROOT:-${VAULT_ROOT:-./vault}}:/app/vault"
    command: ["/bin/bash", "-c", "mkdir -p /app/tmp && python -m app.cli watcher run"]
    environment:
      - VAULT_LAYOUT_NOTE_REL=${VAULT_LAYOUT_NOTE_REL:-}
      - VAULT_SYSTEM_DIR_REL=${VAULT_SYSTEM_DIR_REL:-}
      - VAULT_INBOX_DIR_REL=${VAULT_INBOX_DIR_REL:-}
      - VAULT_DESK_DIR_REL=${VAULT_DESK_DIR_REL:-}
      - LLM_PROVIDER=${LLM_PROVIDER}
      - WATCHER_AUTO_EXEC=${WATCHER_AUTO_EXEC-1}
      - WATCHER_STATE_DIR=${WATCHER_STATE_DIR:-}
      - WATCHER_MAX_SCANNED_FILES_PER_TICK=${WATCHER_MAX_SCANNED_FILES_PER_TICK:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - db
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "test -s \"$${WATCHER_HEARTBEAT_PATH}\""]
      interval: 5s
      timeout: 2s
      retries: 10

volumes:
  ollama:
