services:
  db:
    image: pgvector/pgvector:pg16
    env_file:
      - ./config/runtime.defaults.env
    ports:
      - "15432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\" -h \"$${POSTGRES_HEALTHCHECK_HOST}\""]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 10s

  ollama:
    image: ollama/ollama:latest
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama
    restart: unless-stopped
    healthcheck:
      # Use the in-image `ollama` CLI (the image's entrypoint binary): it queries
      # the server's API and exits non-zero when ollama is down. The official
      # ollama/ollama image ships no python3/curl/wget, so an HTTP-tool probe
      # would report `not found` even while serving; and a hardcoded loopback
      # 11434 URL is forbidden by tests/guards/test_no_hardcoded_runtime_defaults.
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s

  # One-shot migration step (KERNEL-05, #2850): the single compose-stack schema
  # authority. Runs scripts/run_migrations.sh (DB wait + extensions +
  # `alembic upgrade head`) and exits. api/worker/watcher gate on
  # `service_completed_successfully`, so no runtime container can boot against
  # an unmigrated database — required now that outbox/store bootstrap paths are
  # assert-only outside tests instead of create-on-demand. `restart: "no"`
  # keeps it one-shot; every `docker compose up <service>` pulls it in via
  # depends_on (no producer runs `--no-deps`).
  migrate:
    build:
      context: .
      args:
        VCS_REF: ${VCS_REF:-unknown}
        BUILT_AT: ${BUILT_AT:-unknown}
    image: ${APP_IMAGE_REPOSITORY:-ghcr.io/rasmustho/pkm-app}:${APP_IMAGE_TAG:-dev-local}
    working_dir: /app
    env_file:
      - ./config/runtime.defaults.env
      - path: ${WATCHER_RUNTIME_ENV_FILE:-./tmp/runtime.env}
        required: false
    user: "${LOCAL_UID:-0}:${LOCAL_GID:-0}"
    command: ["/bin/bash", "/app/scripts/run_migrations.sh"]
    environment:
      # app/__init__.py runs ensure_provider() at import time and alembic's
      # env.py imports the app package; with LLM_PROVIDER_ENFORCE=1 (from
      # runtime.defaults.env) an unset LLM_PROVIDER is an import-time crash.
      # Mirror the api/worker/watcher wiring so migrate resolves the provider
      # exactly like the proven api alembic path does.
      LLM_PROVIDER: ${LLM_PROVIDER}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  # MVR-01B durable mechanical state producer. The channel registry uses a
  # project-scoped named volume; the ownership ledger uses one host bind shared
  # across dev/test/prod. Run as root only to establish private ownership, then
  # every long-lived consumer runs its own fail-loud preflight as LOCAL_UID.
  instance-state-init:
    build:
      context: .
      args:
        VCS_REF: ${VCS_REF:-unknown}
        BUILT_AT: ${BUILT_AT:-unknown}
    image: ${APP_IMAGE_REPOSITORY:-ghcr.io/rasmustho/pkm-app}:${APP_IMAGE_TAG:-dev-local}
    user: "0:0"
    volumes:
      - "instance-state:/app/instance-state"
      - type: bind
        source: ${INSTANCE_OWNERSHIP_HOST_STATE_DIR:?absolute host-global state directory must be resolved by the launcher}
        target: /app/instance-ownership
        bind:
          create_host_path: false
      - "runtime-tmp:/app/tmp"
      # MVR-01C roll-forward source. Only the one-shot deployment producer
      # mounts it; current long-lived services never receive this scalar fork.
      - "scalar-rollback-legacy:/app/scalar-rollback"
      # Host artifacts that Docker Compose actually activates. MVR-01C hashes
      # these mounted bytes instead of trusting image-local policy copies.
      - "./docker-compose.yaml:/run/scalar-rollback-policy/docker-compose.yaml:ro"
      - "./docker-compose.scalar-rollback.yml:/run/scalar-rollback-policy/docker-compose.scalar-rollback.yml:ro"
      - "./ops/scalar-rollback/nginx.conf:/run/scalar-rollback-policy/nginx.conf:ro"
      - "/Users:/Users"
      - "/Volumes:/Volumes"
    command:
      - /bin/bash
      - -c
      - >-
        test -d /app/instance-state -a -d /app/instance-ownership &&
        chown -R "$${LOCAL_UID}:$${LOCAL_GID}" /app/instance-state /app/instance-ownership &&
        chmod 0700 /app/instance-state /app/instance-ownership
    environment:
      LOCAL_UID: ${LOCAL_UID:-0}
      LOCAL_GID: ${LOCAL_GID:-0}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      DESIGN_HANDOFF_APP_LOCAL_SETTINGS: ${DESIGN_HANDOFF_APP_LOCAL_SETTINGS:-/app/tmp/agentic-pkm/app-local.md}
    restart: "no"

  api:
    build:
      context: .
      args:
        VCS_REF: ${VCS_REF:-unknown}
        BUILT_AT: ${BUILT_AT:-unknown}
    image: ${APP_IMAGE_REPOSITORY:-ghcr.io/rasmustho/pkm-app}:${APP_IMAGE_TAG:-dev-local}
    working_dir: /app
    env_file:
      - ./config/runtime.defaults.env
      - path: ${WATCHER_RUNTIME_ENV_FILE:-./tmp/runtime.env}
        required: false
      # Governed host-secret layer for the declared `api` consumer (#4422):
      # the deploy wrapper materializes the file from the Keychain and
      # re-exports its handle as HOST_SECRET_RUNTIME_ENV_FILE_API (distinct
      # from the capture-watch consumer's handle, which a nested bootstrap
      # scrubs). Delivers HEIMDAL_RAW_STORE_KEY so the shipped media/screen
      # ingress lanes can admit.
      #
      # This layer is also where the cockpit's `github-live` plane gets its
      # credential (#4484, corrected by #4489): the in-container `gh` transport
      # reads GITHUB_TOKEN from the environment. The file is bootstrap-owned, so
      # the token arrives by provisioning the declared *optional* identifier
      # `github.token` (consumer heimdal-api-ingress) in the Keychain — a
      # hand-written env file on this handle is rebuilt over. Optional means an
      # absent token never fails this consumer's bootstrap, so the media/screen
      # ingress lanes above are unaffected on hosts that have none; a present
      # but malformed token still fails closed. A repo-scoped read-only token is
      # sufficient; the plane performs GET requests only and persists nothing.
      - path: ${HOST_SECRET_RUNTIME_ENV_FILE_API:-/dev/null}
        required: false
    user: "${LOCAL_UID:-0}:${LOCAL_GID:-0}"
    volumes:
      # Dispatcher remains host-owned operational state. Mount its one shared
      # directory so the API Signboard routes and startup bootstrap use the
      # same SQLite projection source.
      # The full-stack launcher exports an absolute shared host path. Keep a
      # local fallback for Compose consumers such as the worker-only CI smoke,
      # which still parses the API service even though it does not start it.
      - "${DISPATCHER_HOST_STATE_DIR:-./runtime/dispatcher}:/app/runtime/dispatcher"
      # Legacy /app/vault compatibility mount removed from the base compose
      # (#2386, Slice 05D of #2311): a no-vault startup must not synthesize a
      # repo-local ./vault bind. The /app/vault compatibility mount now lives in
      # the explicit docker-compose.legacy-vault.yml overlay, included by
      # start_full_system.sh ONLY when a vault is bound (VAULT_HOST_ROOT set);
      # its source is the required-variable form so it cannot fall back to ./vault.
      # Full host filesystem for in-process vault selection (#2310): /Users
      # (internal SSD / iCloud Obsidian) and /Volumes (external disks, e.g. the
      # T7) at IDENTICAL container paths, so a selected host-absolute vault path
      # resolves transparently. Writes stay bounded to the selected vault
      # (write_note_from_absolute enforces relative_to(vault_root)). Requires
      # Colima to share /Users + /Volumes — see docs/ops/COLIMA_FULL_HOST_MOUNT.md.
      - "/Users:/Users"
      - "/Volumes:/Volumes"
      # External-SSD TTS store (models/cache/logs) bind-mounted to a fixed container path.
      # Host root is machine-local (${TTS_HOST_ROOT} in .env.prod.local); defaults to a dev scratch dir.
      - "${TTS_HOST_ROOT:-./tmp/tts}:/data/tts"
      # Shared runtime-artifact volume (#2991): api/worker/watcher each did their
      # own `mkdir -p /app/tmp`, so the three containers had NO shared filesystem
      # surface even though they all resolve the identical absolute heartbeat
      # paths from config/runtime.defaults.env (WATCHER_HEARTBEAT_PATH,
      # WORKER_HEARTBEAT_PATH, WATCHER_STATE_PATH, WATCHER_STOP_FILE,
      # INDEX_OUTBOX_PATH). The api container's health check read its own
      # container-local empty file and reported "not running (no heartbeat)"
      # even when watcher/worker were alive — a structural false negative
      # (issue #2991). This named volume is declared once in the base compose
      # and is automatically namespaced per compose *project* (pkm-dev,
      # pkm-test, pkm-prod each get their own independent volume instance), so
      # channel isolation holds without any extra wiring. Test-channel paths
      # move under /app/tmp-test (docker-compose.test.yml), which overrides
      # this mount target to the same volume.
      - "runtime-tmp:/app/tmp"
      - "instance-state:/app/instance-state"
      - type: bind
        source: ${INSTANCE_OWNERSHIP_HOST_STATE_DIR:?absolute host-global state directory must be resolved by the launcher}
        target: /app/instance-ownership
        bind:
          create_host_path: false
    command:
      - /bin/bash
      - -c
      - >-
        mkdir -p /app/tmp &&
        if python -c 'import importlib.util; raise SystemExit(0 if importlib.util.find_spec("app.instance.runtime") else 1)' >/dev/null 2>&1; then
          python -m app.instance.runtime preflight --channel "$${PKM_ENVIRONMENT:-dev}" --instance-state-root /app/instance-state --host-global-root /app/instance-ownership --consumer api;
        elif [ "$${INSTANCE_STATE_LEGACY_ROLLBACK:-0}" = 1 ]; then
          [ ! -e /app/instance-state/agentic-pkm/vault-registry.md.scalar-rollback-session.json ] || { echo 'legacy rollback requires the governed scalar overlay' >&2; exit 75; };
          [ ! -e /app/instance-ownership/deployment-public/deployment-host-global-lease.json ] || { echo 'legacy rollback blocked by host-global deployment lease' >&2; exit 75; };
          [ ! -e /app/instance-ownership/deployment-host-global-lease.json ] || { echo 'legacy rollback blocked by legacy host-global deployment lease' >&2; exit 75; };
          for deployment_fence in /app/instance-ownership/deployment-*-restart-fence.json; do [ ! -e "$${deployment_fence}" ] || { echo 'legacy rollback blocked by deployment restart fence' >&2; exit 75; }; done;
        else
          echo 'instance-state preflight module is unavailable outside an explicit rollback' >&2; exit 75;
        fi &&
        exec bash /app/scripts/start_api.sh
    environment:
      INSTANCE_STATE_LEGACY_ROLLBACK: ${INSTANCE_STATE_LEGACY_ROLLBACK:-0}
      INSTANCE_VAULT_REGISTRY_PATH: /app/instance-state/agentic-pkm/vault-registry.md
      INSTANCE_OWNERSHIP_ROOT: /app/instance-ownership
      DESIGN_HANDOFF_APP_LOCAL_SETTINGS: ${DESIGN_HANDOFF_APP_LOCAL_SETTINGS:-/app/tmp/agentic-pkm/app-local.md}
      VAULT_LAYOUT_NOTE_REL: ${VAULT_LAYOUT_NOTE_REL:-}
      VAULT_SYSTEM_DIR_REL: ${VAULT_SYSTEM_DIR_REL:-}
      VAULT_INBOX_DIR_REL: ${VAULT_INBOX_DIR_REL:-}
      VAULT_DESK_DIR_REL: ${VAULT_DESK_DIR_REL:-}
      LLM_PROVIDER: ${LLM_PROVIDER}
      # Trust the companion-ui container's own server-side proxy call to the
      # loopback/API-key-gated vault-selection routes (#3102). The browser never
      # reaches the api directly in this topology — the companion-ui container
      # relays over the bridge network and is never loopback, so onboarding 401'd.
      # The runtime resolves this compose service name to its bridge address and
      # trusts that immediate peer by construction (app/auth.py ::
      # _is_trusted_companion_ui_proxy). Override/clear it to opt out.
      COMPANION_UI_PROXY_HOSTS: ${COMPANION_UI_PROXY_HOSTS:-companion-ui}
      # Agentic Lab canvas surface gate (app/api/routes/canvas.py). Default off so
      # prod stays disabled; export CANVAS_ENABLED=1 to enable for dev/UAT.
      CANVAS_ENABLED: ${CANVAS_ENABLED:-0}
      # Fixed in-container TTS paths — the SSD bind-mount lands at /data/tts regardless of host path.
      TTS_MODEL_DIR: /data/tts/models
      TTS_CACHE_DIR: /data/tts/cache
      TTS_LOG_DIR: /data/tts/logs
      # Read-back master switch. Compose interpolation only sees shell vars, a
      # default .env, or the --env-file passed by the start wrappers; the source
      # tmp/runtime.env is populated from .env by export_runtime_env.sh so an
      # operator's TTS_ENABLED=true actually reaches load_tts_config() (#2189).
      TTS_ENABLED: ${TTS_ENABLED:-false}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "18000:8000"
    depends_on:
      db:
        condition: service_healthy
      # Serializes the two alembic invocations: start_api.sh re-runs
      # run_migrations.sh idempotently after the migrate one-shot completed.
      migrate:
        condition: service_completed_successfully
      instance-state-init:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python - <<'PY'\nimport os, urllib.request, sys\ntry:\n    urllib.request.urlopen(os.environ['API_HEALTHCHECK_URL'], timeout=2)\n    sys.exit(0)\nexcept Exception:\n    sys.exit(1)\nPY"]
      interval: 10s
      timeout: 3s
      retries: 3

  worker:
    build:
      context: .
      args:
        VCS_REF: ${VCS_REF:-unknown}
        BUILT_AT: ${BUILT_AT:-unknown}
    image: ${APP_IMAGE_REPOSITORY:-ghcr.io/rasmustho/pkm-app}:${APP_IMAGE_TAG:-dev-local}
    working_dir: /app
    env_file:
      - ./config/runtime.defaults.env
      - path: ${WATCHER_RUNTIME_ENV_FILE:-./tmp/runtime.env}
        required: false
    user: "${LOCAL_UID:-0}:${LOCAL_GID:-0}"
    volumes:
      # Legacy /app/vault compatibility mount moved to docker-compose.legacy-vault.yml
      # (#2386); included only for explicit-vault startups, never a no-vault ./vault fallback.
      # Full host filesystem for in-process vault selection (#2310): /Users
      # (internal SSD / iCloud Obsidian) and /Volumes (external disks, e.g. the
      # T7) at IDENTICAL container paths, so a selected host-absolute vault path
      # resolves transparently. Writes stay bounded to the selected vault
      # (write_note_from_absolute enforces relative_to(vault_root)). Requires
      # Colima to share /Users + /Volumes — see docs/ops/COLIMA_FULL_HOST_MOUNT.md.
      - "/Users:/Users"
      - "/Volumes:/Volumes"
      # Shared runtime-artifact volume (#2991) — see the `api` service comment
      # for the full rationale. Same named volume so worker's heartbeat/outbox
      # writes land where the api/watcher containers can see them.
      - "runtime-tmp:/app/tmp"
      - "instance-state:/app/instance-state"
      - type: bind
        source: ${INSTANCE_OWNERSHIP_HOST_STATE_DIR:?absolute host-global state directory must be resolved by the launcher}
        target: /app/instance-ownership
        bind:
          create_host_path: false
    command:
      - /bin/bash
      - -c
      - >-
        mkdir -p /app/tmp &&
        if python -c 'import importlib.util; raise SystemExit(0 if importlib.util.find_spec("app.instance.runtime") else 1)' >/dev/null 2>&1; then
          python -m app.instance.runtime preflight --channel "$${PKM_ENVIRONMENT:-dev}" --instance-state-root /app/instance-state --host-global-root /app/instance-ownership --consumer worker;
        elif [ "$${INSTANCE_STATE_LEGACY_ROLLBACK:-0}" = 1 ]; then
          [ ! -e /app/instance-state/agentic-pkm/vault-registry.md.scalar-rollback-session.json ] || { echo 'legacy rollback requires the governed scalar overlay' >&2; exit 75; };
          [ ! -e /app/instance-ownership/deployment-public/deployment-host-global-lease.json ] || { echo 'legacy rollback blocked by host-global deployment lease' >&2; exit 75; };
          [ ! -e /app/instance-ownership/deployment-host-global-lease.json ] || { echo 'legacy rollback blocked by legacy host-global deployment lease' >&2; exit 75; };
          for deployment_fence in /app/instance-ownership/deployment-*-restart-fence.json; do [ ! -e "$${deployment_fence}" ] || { echo 'legacy rollback blocked by deployment restart fence' >&2; exit 75; }; done;
        else
          echo 'instance-state preflight module is unavailable outside an explicit rollback' >&2; exit 75;
        fi &&
        exec python -m app.workers.outbox_worker
    environment:
      INSTANCE_STATE_LEGACY_ROLLBACK: ${INSTANCE_STATE_LEGACY_ROLLBACK:-0}
      INSTANCE_VAULT_REGISTRY_PATH: /app/instance-state/agentic-pkm/vault-registry.md
      INSTANCE_OWNERSHIP_ROOT: /app/instance-ownership
      DESIGN_HANDOFF_APP_LOCAL_SETTINGS: ${DESIGN_HANDOFF_APP_LOCAL_SETTINGS:-/app/tmp/agentic-pkm/app-local.md}
      VAULT_LAYOUT_NOTE_REL: ${VAULT_LAYOUT_NOTE_REL:-}
      VAULT_SYSTEM_DIR_REL: ${VAULT_SYSTEM_DIR_REL:-}
      VAULT_INBOX_DIR_REL: ${VAULT_INBOX_DIR_REL:-}
      VAULT_DESK_DIR_REL: ${VAULT_DESK_DIR_REL:-}
      LLM_PROVIDER: ${LLM_PROVIDER}
      # Opt-in worker /metrics endpoint (builder-ops-stability Issue 6):
      # empty/unset keeps it off; see ops/observability/prometheus.yml.
      WORKER_METRICS_PORT: ${WORKER_METRICS_PORT:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      # Worker bootstrap() is assert-only (KERNEL-05, #2850): the outbox schema
      # must exist before boot. The bounded bootstrap retry loop remains as
      # defense-in-depth only; this ordering is the actual guarantee.
      migrate:
        condition: service_completed_successfully
      instance-state-init:
        condition: service_completed_successfully
    restart: unless-stopped
    init: true
    healthcheck:
      test: ["CMD", "python", "-m", "app.runtime.health_probe", "worker"]
      interval: 20s
      timeout: 15s
      retries: 3

  watcher:
    build:
      context: .
      args:
        VCS_REF: ${VCS_REF:-unknown}
        BUILT_AT: ${BUILT_AT:-unknown}
    image: ${APP_IMAGE_REPOSITORY:-ghcr.io/rasmustho/pkm-app}:${APP_IMAGE_TAG:-dev-local}
    working_dir: /app
    user: "${LOCAL_UID:-0}:${LOCAL_GID:-0}"
    env_file:
      - ./config/runtime.defaults.env
      - path: ${WATCHER_RUNTIME_ENV_FILE:-./tmp/runtime.env}
        required: false
    volumes:
      # Legacy /app/vault compatibility mount moved to docker-compose.legacy-vault.yml
      # (#2386); included only for explicit-vault startups, never a no-vault ./vault fallback.
      # Full host filesystem for in-process vault selection (#2310): /Users
      # (internal SSD / iCloud Obsidian) and /Volumes (external disks, e.g. the
      # T7) at IDENTICAL container paths, so a selected host-absolute vault path
      # resolves transparently. Writes stay bounded to the selected vault
      # (write_note_from_absolute enforces relative_to(vault_root)). Requires
      # Colima to share /Users + /Volumes — see docs/ops/COLIMA_FULL_HOST_MOUNT.md.
      - "/Users:/Users"
      - "/Volumes:/Volumes"
      # Shared runtime-artifact volume (#2991) — see the `api` service comment
      # for the full rationale. Same named volume so watcher's heartbeat/state
      # writes land where the api/worker containers can see them.
      - "runtime-tmp:/app/tmp"
      - "instance-state:/app/instance-state"
      - type: bind
        source: ${INSTANCE_OWNERSHIP_HOST_STATE_DIR:?absolute host-global state directory must be resolved by the launcher}
        target: /app/instance-ownership
        bind:
          create_host_path: false
    command:
      - /bin/bash
      - -c
      - >-
        mkdir -p /app/tmp &&
        if python -c 'import importlib.util; raise SystemExit(0 if importlib.util.find_spec("app.instance.runtime") else 1)' >/dev/null 2>&1; then
          python -m app.instance.runtime preflight --channel "$${PKM_ENVIRONMENT:-dev}" --instance-state-root /app/instance-state --host-global-root /app/instance-ownership --consumer watcher;
        elif [ "$${INSTANCE_STATE_LEGACY_ROLLBACK:-0}" = 1 ]; then
          [ ! -e /app/instance-state/agentic-pkm/vault-registry.md.scalar-rollback-session.json ] || { echo 'legacy rollback requires the governed scalar overlay' >&2; exit 75; };
          [ ! -e /app/instance-ownership/deployment-public/deployment-host-global-lease.json ] || { echo 'legacy rollback blocked by host-global deployment lease' >&2; exit 75; };
          [ ! -e /app/instance-ownership/deployment-host-global-lease.json ] || { echo 'legacy rollback blocked by legacy host-global deployment lease' >&2; exit 75; };
          for deployment_fence in /app/instance-ownership/deployment-*-restart-fence.json; do [ ! -e "$${deployment_fence}" ] || { echo 'legacy rollback blocked by deployment restart fence' >&2; exit 75; }; done;
        else
          echo 'instance-state preflight module is unavailable outside an explicit rollback' >&2; exit 75;
        fi &&
        exec python -m app.cli watcher run
    environment:
      - INSTANCE_STATE_LEGACY_ROLLBACK=${INSTANCE_STATE_LEGACY_ROLLBACK:-0}
      - INSTANCE_VAULT_REGISTRY_PATH=/app/instance-state/agentic-pkm/vault-registry.md
      - INSTANCE_OWNERSHIP_ROOT=/app/instance-ownership
      - DESIGN_HANDOFF_APP_LOCAL_SETTINGS=${DESIGN_HANDOFF_APP_LOCAL_SETTINGS:-/app/tmp/agentic-pkm/app-local.md}
      - VAULT_LAYOUT_NOTE_REL=${VAULT_LAYOUT_NOTE_REL:-}
      - VAULT_SYSTEM_DIR_REL=${VAULT_SYSTEM_DIR_REL:-}
      - VAULT_INBOX_DIR_REL=${VAULT_INBOX_DIR_REL:-}
      - VAULT_DESK_DIR_REL=${VAULT_DESK_DIR_REL:-}
      # Bare base-stack startup gets this non-secret selector from .env/the
      # shell. deploy_channel_compose pins it from governed channel/runtime env.
      - LLM_PROVIDER=${LLM_PROVIDER}
      - WATCHER_AUTO_EXEC=${WATCHER_AUTO_EXEC-1}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      # Watcher emits outbox rows; gate on the migrated schema like worker/api.
      migrate:
        condition: service_completed_successfully
      instance-state-init:
        condition: service_completed_successfully
    restart: unless-stopped
    init: true
    healthcheck:
      test: ["CMD", "python", "-m", "app.runtime.health_probe", "watcher"]
      interval: 20s
      timeout: 15s
      retries: 10

  # Heimdal capture-watch (#3098, follow-up to #3094/#3025): drives the
  # voice-memo capture adapter against a real watched folder (an
  # iCloud-synced Shortcut destination). Same shape as `watcher` above —
  # full host-filesystem mount so the watched folder resolves at its native
  # host path, DB access for the raw-store write path, Compose-supervised
  # restart. Host-specific capture values are carried by the final
  # WATCHER_RUNTIME_ENV_FILE env_file layer. They must not be repeated under
  # `environment`: Compose would interpolate those entries from the CLI
  # environment and override the governed env_file values. Left unset, the
  # container fails loud at runtime, not at compose-parse time.
  heimdal-capture-watch:
    build:
      context: .
      args:
        VCS_REF: ${VCS_REF:-unknown}
        BUILT_AT: ${BUILT_AT:-unknown}
    image: ${APP_IMAGE_REPOSITORY:-ghcr.io/rasmustho/pkm-app}:${APP_IMAGE_TAG:-dev-local}
    working_dir: /app
    user: "${LOCAL_UID:-0}:${LOCAL_GID:-0}"
    env_file:
      - ./config/runtime.defaults.env
      - path: ${WATCHER_RUNTIME_ENV_FILE:-./tmp/runtime.env}
        required: false
      # Governed host-secret layer for the declared `heimdal-capture-watch`
      # consumer (#4362, following the `api` consumer's #4422 pattern below):
      # host_secret_contract.json declares this consumer for every channel
      # (dev/test/prod), but the layer used to be wired only in the dev
      # compose overlay -- test and prod deploys never received
      # HEIMDAL_RAW_STORE_KEY through the generated env at all, forcing an
      # ad-hoc shell export at compose time. Living in the base file makes
      # delivery deterministic across every channel without a per-overlay
      # opt-in. The deploy wrapper (scripts/lib/deploy_channel_compose.sh)
      # materializes this file from the Keychain and removes it after Compose
      # creates the container; a channel that never runs the wrapper (e.g. a
      # bare `docker compose up` outside the governed deploy path) simply
      # resolves this path to `/dev/null` and the layer contributes nothing.
      - path: ${HOST_SECRET_RUNTIME_ENV_FILE:-/dev/null}
        required: false
    volumes:
      - "/Users:/Users"
      - "/Volumes:/Volumes"
      - "runtime-tmp:/app/tmp"
      - "instance-state:/app/instance-state"
      - type: bind
        source: ${INSTANCE_OWNERSHIP_HOST_STATE_DIR:?absolute host-global state directory must be resolved by the launcher}
        target: /app/instance-ownership
        bind:
          create_host_path: false
    command:
      - /bin/bash
      - -c
      - >-
        mkdir -p /app/tmp &&
        if python -c 'import importlib.util; raise SystemExit(0 if importlib.util.find_spec("app.instance.runtime") else 1)' >/dev/null 2>&1; then
          python -m app.instance.runtime preflight --channel "$${PKM_ENVIRONMENT:-dev}" --instance-state-root /app/instance-state --host-global-root /app/instance-ownership --consumer heimdal-capture-watch;
        elif [ "$${INSTANCE_STATE_LEGACY_ROLLBACK:-0}" = 1 ]; then
          [ ! -e /app/instance-state/agentic-pkm/vault-registry.md.scalar-rollback-session.json ] || { echo 'legacy rollback requires the governed scalar overlay' >&2; exit 75; };
          [ ! -e /app/instance-ownership/deployment-public/deployment-host-global-lease.json ] || { echo 'legacy rollback blocked by host-global deployment lease' >&2; exit 75; };
          [ ! -e /app/instance-ownership/deployment-host-global-lease.json ] || { echo 'legacy rollback blocked by legacy host-global deployment lease' >&2; exit 75; };
          for deployment_fence in /app/instance-ownership/deployment-*-restart-fence.json; do [ ! -e "$${deployment_fence}" ] || { echo 'legacy rollback blocked by deployment restart fence' >&2; exit 75; }; done;
        else
          echo 'instance-state preflight module is unavailable outside an explicit rollback' >&2; exit 75;
        fi &&
        exec python -m app.cli heimdal capture-watch
    environment:
      INSTANCE_STATE_LEGACY_ROLLBACK: ${INSTANCE_STATE_LEGACY_ROLLBACK:-0}
      INSTANCE_VAULT_REGISTRY_PATH: /app/instance-state/agentic-pkm/vault-registry.md
      INSTANCE_OWNERSHIP_ROOT: /app/instance-ownership
      DESIGN_HANDOFF_APP_LOCAL_SETTINGS: ${DESIGN_HANDOFF_APP_LOCAL_SETTINGS:-/app/tmp/agentic-pkm/app-local.md}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      instance-state-init:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"from app.heimdal.capture_runtime import CaptureRuntimeConfig; from app.heimdal.raw_store import resolve_raw_store_key; CaptureRuntimeConfig.from_env(); resolve_raw_store_key()\""]
      interval: 30s
      timeout: 5s
      retries: 5

  companion-ui:
    build:
      context: .
      args:
        VCS_REF: ${VCS_REF:-unknown}
        BUILT_AT: ${BUILT_AT:-unknown}
    image: ${APP_IMAGE_REPOSITORY:-ghcr.io/rasmustho/pkm-app}:${APP_IMAGE_TAG:-dev-local}
    working_dir: /app/companion-ui/companion-app
    user: "${LOCAL_UID:-0}:${LOCAL_GID:-0}"
    command:
      - /bin/bash
      - -c
      - python -m "$${COMPANION_UI_SERVE_MODULE:-companion_ui.workspace.serve_dev_page}"
    environment:
      HOST: 0.0.0.0
      PORT: ${COMPANION_UI_PORT:-8111}
      COMPANION_API_BASE_URL: ${COMPANION_UI_API_BASE_URL:-http://api:8000}
      COMPANION_UI_SERVE_MODULE: ${COMPANION_UI_SERVE_MODULE:-companion_ui.workspace.serve_dev_page}
      PKM_ENVIRONMENT: ${PKM_ENVIRONMENT:-dev}
      PYTHONPATH: /app/companion-ui/companion-app:/app
    ports:
      - "${COMPANION_UI_BIND_HOST:-127.0.0.1}:${COMPANION_UI_HOST_PORT:-8111}:${COMPANION_UI_PORT:-8111}"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python - <<'PY'\nimport os, urllib.request, sys\nport = os.environ.get('PORT', '8111')\ntry:\n    urllib.request.urlopen(f'http://127.0.0.1:{port}/healthz', timeout=2)\n    sys.exit(0)\nexcept Exception:\n    sys.exit(1)\nPY"]
      interval: 10s
      timeout: 3s
      retries: 6

volumes:
  ollama:
  # Shared api/worker/watcher runtime-artifact surface (#2991). Namespaced per
  # compose project (pkm-dev, pkm-test, pkm-prod), so dev/test/prod each get
  # their own isolated volume instance automatically.
  runtime-tmp:
  # Durable channel-scoped MVR-01B registry state. Compose project namespacing
  # keeps dev/test/prod isolated while container recreation preserves state.
  instance-state:
  # Previous-image scalar fork, imported only by the fenced deployment helper.
  scalar-rollback-legacy:
