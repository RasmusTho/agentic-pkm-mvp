version: "3.9"

services:
  api:
    build: .
    image: agentic-pkm-api:latest
    env_file: .env
    environment:
      - DATABASE_URL=postgresql+psycopg://app:app@postgres:5432/appdb
      - RATE_LIMIT_REDIS_URL=redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=appdb
      - POSTGRES_USER=app
      - POSTGRES_PASSWORD=app
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres-data:
