services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - "15432:5432"

  api:
    build: .
    image: workspace-app
    working_dir: /app
    volumes:
      - ./:/app
    command: ["/bin/bash", "-c", "mkdir -p /app/tmp && /app/scripts/start_api.sh"]
    environment:
      DATABASE_URL: postgresql+psycopg://app:app@db:5432/app
      DB_DSN: postgresql+psycopg://app:app@db:5432/app
      STORE_BACKEND: pg
      LLM_PROVIDER: mock
      WATCHER_HEARTBEAT_PATH: /app/tmp/watcher_heartbeat.json
      INDEX_OUTBOX_PATH: /app/tmp/index-outbox.jsonl
    ports:
      - "18000:8000"
    depends_on:
      - db

  worker:
    build: .
    image: workspace-app
    working_dir: /app
    volumes:
      - ./:/app
    command: ["/bin/bash", "-c", "mkdir -p /app/tmp && python -m app.workers.outbox_worker"]
    environment:
      DATABASE_URL: postgresql+psycopg://app:app@db:5432/app
      DB_DSN: postgresql+psycopg://app:app@db:5432/app
      STORE_BACKEND: pg
      LLM_PROVIDER: mock
      WATCHER_HEARTBEAT_PATH: /app/tmp/watcher_heartbeat.json
      INDEX_OUTBOX_PATH: /app/tmp/index-outbox.jsonl
    depends_on:
      - db
