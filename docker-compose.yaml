services:
  db:
    image: pgvector/pgvector:pg16
    env_file:
      - ./config/runtime.defaults.env
    environment:
    ports:
      - "15432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\" -h \"$${POSTGRES_HEALTHCHECK_HOST}\""]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 10s

  ollama:
    image: ollama/ollama:latest
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama
    restart: unless-stopped

  api:
    build: .
    image: workspace-app
    working_dir: /app
    env_file:
      - ./config/runtime.defaults.env
      - path: ${WATCHER_RUNTIME_ENV_FILE:-./tmp/runtime.env}
        required: false
    user: "${LOCAL_UID:-0}:${LOCAL_GID:-0}"
    volumes:
      - ./:/app
      - "${VAULT_ROOT:-./vault}:/app/vault"
    command: ["/bin/bash", "-c", "mkdir -p /app/tmp && bash /app/scripts/start_api.sh"]
    environment:
      VAULT_LAYOUT_NOTE_REL: ${VAULT_LAYOUT_NOTE_REL:-}
      VAULT_SYSTEM_DIR_REL: ${VAULT_SYSTEM_DIR_REL:-}
      VAULT_INBOX_DIR_REL: ${VAULT_INBOX_DIR_REL:-}
      VAULT_DESK_DIR_REL: ${VAULT_DESK_DIR_REL:-}
      LLM_PROVIDER: ${LLM_PROVIDER}
    ports:
      - "18000:8000"
    depends_on:
      - db
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python - <<'PY'\nimport os, urllib.request, sys\ntry:\n    urllib.request.urlopen(os.environ['API_HEALTHCHECK_URL'], timeout=2)\n    sys.exit(0)\nexcept Exception:\n    sys.exit(1)\nPY"]
      interval: 10s
      timeout: 3s
      retries: 3

  worker:
    build: .
    image: workspace-app
    working_dir: /app
    env_file:
      - ./config/runtime.defaults.env
      - path: ${WATCHER_RUNTIME_ENV_FILE:-./tmp/runtime.env}
        required: false
    user: "${LOCAL_UID:-0}:${LOCAL_GID:-0}"
    volumes:
      - ./:/app
      - "${VAULT_ROOT:-./vault}:/app/vault"
    command: ["/bin/bash", "-c", "mkdir -p /app/tmp && python -m app.workers.outbox_worker"]
    environment:
      VAULT_LAYOUT_NOTE_REL: ${VAULT_LAYOUT_NOTE_REL:-}
      VAULT_SYSTEM_DIR_REL: ${VAULT_SYSTEM_DIR_REL:-}
      VAULT_INBOX_DIR_REL: ${VAULT_INBOX_DIR_REL:-}
      VAULT_DESK_DIR_REL: ${VAULT_DESK_DIR_REL:-}
      LLM_PROVIDER: ${LLM_PROVIDER}
    depends_on:
      - db
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "test -s \"$${WORKER_HEARTBEAT_PATH}\""]
      interval: 20s
      timeout: 5s
      retries: 3

  watcher:
    build: .
    image: workspace-app
    working_dir: /app
    user: "${LOCAL_UID:-0}:${LOCAL_GID:-0}"
    env_file:
      - ./config/runtime.defaults.env
      - path: ${WATCHER_RUNTIME_ENV_FILE:-./tmp/runtime.env}
        required: false
    volumes:
      - ./:/app
      - "${VAULT_ROOT:-./vault}:/app/vault"
    command: ["/bin/bash", "-c", "mkdir -p /app/tmp && python -m app.cli watcher run"]
    environment:
      - VAULT_LAYOUT_NOTE_REL=${VAULT_LAYOUT_NOTE_REL:-}
      - VAULT_SYSTEM_DIR_REL=${VAULT_SYSTEM_DIR_REL:-}
      - VAULT_INBOX_DIR_REL=${VAULT_INBOX_DIR_REL:-}
      - VAULT_DESK_DIR_REL=${VAULT_DESK_DIR_REL:-}
      - LLM_PROVIDER=${LLM_PROVIDER}
      - WATCHER_AUTO_EXEC=${WATCHER_AUTO_EXEC-1}
      - WATCHER_STATE_DIR=${WATCHER_STATE_DIR:-}
      - WATCHER_MAX_SCANNED_FILES_PER_TICK=${WATCHER_MAX_SCANNED_FILES_PER_TICK:-}
    depends_on:
      - db
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "test -s \"$${WATCHER_HEARTBEAT_PATH}\""]
      interval: 5s
      timeout: 2s
      retries: 10

volumes:
  ollama:
