services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - "15432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app -h 127.0.0.1 -p 5432"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  api:
    build: .
    image: workspace-app
    working_dir: /app
    user: "${LOCAL_UID:-0}:${LOCAL_GID:-0}"
    volumes:
      - ./:/app
      - "${VAULT_ROOT:-./vault}:/app/vault"
    command: ["/bin/bash", "-c", "mkdir -p /app/tmp && bash /app/scripts/start_api.sh"]
    environment:
      DATABASE_URL: postgresql+psycopg://app:app@db:5432/app
      DB_DSN: postgresql+psycopg://app:app@db:5432/app
      STORE_BACKEND: pg
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      LLM_MODEL: ${LLM_MODEL:-llama3.1:8b}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1:8b}
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text:latest}
      EMBED_MODEL: ${EMBED_MODEL:-nomic-embed-text:latest}
      EMBED_DIM: ${EMBED_DIM:-768}
      EMBED_NORMALIZE: ${EMBED_NORMALIZE:-1}
      WATCHER_HEARTBEAT_PATH: /app/tmp/watcher_heartbeat.json
      WORKER_HEARTBEAT_PATH: /app/tmp/worker_heartbeat.json
      INDEX_OUTBOX_PATH: /app/tmp/index-outbox.jsonl
    ports:
      - "18000:8000"
    depends_on:
      - db
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python - <<'PY'\nimport urllib.request, sys\ntry:\n    urllib.request.urlopen('http://127.0.0.1:8000/api/status', timeout=2)\n    sys.exit(0)\nexcept Exception:\n    sys.exit(1)\nPY"]
      interval: 10s
      timeout: 3s
      retries: 3

  worker:
    build: .
    image: workspace-app
    working_dir: /app
    user: "${LOCAL_UID:-0}:${LOCAL_GID:-0}"
    volumes:
      - ./:/app
      - "${VAULT_ROOT:-./vault}:/app/vault"
    command: ["/bin/bash", "-c", "mkdir -p /app/tmp && python -m app.workers.outbox_worker"]
    environment:
      DATABASE_URL: postgresql+psycopg://app:app@db:5432/app
      DB_DSN: postgresql+psycopg://app:app@db:5432/app
      STORE_BACKEND: pg
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      LLM_MODEL: ${LLM_MODEL:-llama3.1:8b}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1:8b}
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text:latest}
      EMBED_MODEL: ${EMBED_MODEL:-nomic-embed-text:latest}
      EMBED_DIM: ${EMBED_DIM:-768}
      EMBED_NORMALIZE: ${EMBED_NORMALIZE:-1}
      WORKER_HEARTBEAT_PATH: /app/tmp/worker_heartbeat.json
      WATCHER_HEARTBEAT_PATH: /app/tmp/watcher_heartbeat.json
      INDEX_OUTBOX_PATH: /app/tmp/index-outbox.jsonl
    depends_on:
      - db
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "test -s /app/tmp/worker_heartbeat.json"]
      interval: 20s
      timeout: 5s
      retries: 3

  watcher:
    build: .
    image: workspace-app
    working_dir: /app
    user: "${LOCAL_UID:-0}:${LOCAL_GID:-0}"
    volumes:
      - ./:/app
      - "${VAULT_ROOT:-./vault}:/app/vault"
    command: ["/bin/bash", "-c", "mkdir -p /app/tmp && python -m app.cli watcher run"]
    environment:
      DATABASE_URL: postgresql+psycopg://app:app@db:5432/app
      DB_DSN: postgresql+psycopg://app:app@db:5432/app
      STORE_BACKEND: pg
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      LLM_MODEL: ${LLM_MODEL:-llama3.1:8b}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1:8b}
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text:latest}
      EMBED_MODEL: ${EMBED_MODEL:-nomic-embed-text:latest}
      EMBED_DIM: ${EMBED_DIM:-768}
      EMBED_NORMALIZE: ${EMBED_NORMALIZE:-1}
      WATCHER_ENABLE: "1"
      WATCHER_SCOPE_GLOB: "${VAULT_INBOX_DIR_REL:-Inbox}/**"
      WATCHER_VAULT_PATH: /app/vault
      WATCHER_HEARTBEAT_PATH: /app/tmp/watcher_heartbeat.json
      WATCHER_STATE_PATH: /app/tmp/watcher_state.json
      WATCHER_STOP_FILE: /app/tmp/WATCHER_STOP
      INDEX_OUTBOX_PATH: /app/tmp/index-outbox.jsonl
      WORKER_HEARTBEAT_PATH: /app/tmp/worker_heartbeat.json
    depends_on:
      - db
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "test -s /app/tmp/watcher_heartbeat.json"]
      interval: 5s
      timeout: 2s
      retries: 10
