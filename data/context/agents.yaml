version: 1
bus: inproc     # WS on single node; can switch to redis later
agents:
  Ingestor:
    triggers: ["fs.watch:/ingest/raw"]
    out_events: ["ingest.normalized.request"]
  Normalizer:
    on: ["ingest.normalized.request"]
    actions: ["to_markdown_yaml","assign_uuid","stamp_created_updated"]
    out_events: ["ingest.classify.request"]
  Classifier:
    on: ["ingest.classify.request"]
    actions: ["type_detect","topic_tag","sensitivity","evidence","license_check"]
    out_events: ["ingest.chunk.request"]
  Chunker:
    on: ["ingest.chunk.request"]
    params: {max_tokens: 800, overlap: 120, strategy: "heading_first"}
    out_events: ["ingest.index.request"]
  Indexer:
    on: ["ingest.index.request"]
    actions: ["bm25_index","vector_embed","graph_edges"]
    out_events: ["curation.review.request"]
  Reviewer:
    on: ["curation.review.request"]
    gates_from: "maturity.yaml"
    actions: ["apply_gates","promote_or_feedback"]
