<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Companion UI — System Entry Point (prototype)</title>
<!--
  DESIGN PROTOTYPE — non-production. Visual/interaction guidance only.
  No network calls. No durable mutations. All backend effects are simulated
  with console.log. Governed by companion-ui/docs/DESIGN_HANDOFF_GOVERNANCE.md.
  Reuses Yggdrasil tokens from ./colors_and_type.css — no new visual language.
-->
<link rel="stylesheet" href="./colors_and_type.css" />
<style>
  html, body { height: 100%; overflow: hidden; }
  body { background: var(--bg-base); color: var(--fg-1); }

  /* Tron grid wash on the deepest layer only */
  .stage {
    position: fixed; inset: 0; overflow: hidden;
    background:
      radial-gradient(1200px 800px at 70% -10%, rgba(0,212,232,0.05), transparent 60%),
      var(--bg-base);
  }
  .stage::before {
    content: ""; position: absolute; inset: 0; pointer-events: none; opacity: 0.5;
    background-image:
      linear-gradient(rgba(0,212,232,0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,212,232,0.025) 1px, transparent 1px);
    background-size: 40px 40px;
  }

  button { font-family: var(--font-ui); cursor: pointer; color: inherit; }
  svg { width: 16px; height: 16px; flex: none; vertical-align: middle; }
  [hidden] { display: none !important; }
  .mono { font-family: var(--font-mono); }
  .hero-ic svg { width: 30px; height: 30px; }
  .eyebrow {
    font-family: var(--font-mono); font-size: var(--text-xs);
    letter-spacing: var(--tracking-wider); text-transform: uppercase; color: var(--fg-3);
  }

  /* ============================================================
     BOOT / HANDSHAKE
     ============================================================ */
  #boot {
    position: absolute; inset: 0; z-index: var(--z-modal);
    display: grid; place-items: center;
    background: var(--bg-base);
    transition: opacity var(--duration-slow) var(--ease);
  }
  .boot-inner { text-align: center; display: grid; gap: var(--space-5); justify-items: center; }
  .boot-mark { font-family: var(--font-display); font-size: var(--text-3xl); color: var(--fg-1); letter-spacing: var(--tracking-tight); }
  .boot-mark .ru { color: var(--accent); }
  .boot-line { display: flex; align-items: center; gap: var(--space-3); color: var(--fg-2); font-size: var(--text-sm); }
  .pulse-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--cyan); box-shadow: var(--cyan-glow); animation: breathe 1.4s var(--ease) infinite; }
  @keyframes breathe { 0%,100% { opacity: 0.35; } 50% { opacity: 1; } }

  /* ============================================================
     ENTRY LAYER (cold start / re-entry orientation)
     The active document sits faintly behind — orientation is felt
     at the periphery; cognition returns to the document, not the system.
     ============================================================ */
  #entry { position: absolute; inset: 0; z-index: var(--z-overlay); }
  #entry .entry-doc-ghost {
    position: absolute; inset: 0; padding: clamp(40px, 7vw, 120px);
    opacity: 0.16; filter: saturate(0.4); pointer-events: none;
    -webkit-mask-image: linear-gradient(180deg, transparent, #000 30%, #000 70%, transparent);
            mask-image: linear-gradient(180deg, transparent, #000 30%, #000 70%, transparent);
  }
  #entry .entry-doc-ghost h1 { font-family: var(--font-display); font-size: var(--text-3xl); margin-bottom: var(--space-4); }
  #entry .entry-doc-ghost p { max-width: 60ch; color: var(--fg-2); margin-bottom: var(--space-3); }

  /* warm atmospheric tint (Variant C) — gold for warm trajectory recall */
  .mist-tint {
    position: absolute; inset: 0; pointer-events: none; opacity: 0;
    background: radial-gradient(900px 600px at 50% 80%, rgba(212,168,67,0.10), transparent 70%);
    transition: opacity 1.2s var(--ease);
  }
  .mist-tint[data-on="1"] { opacity: 1; }
  .gravity-well {
    position: absolute; left: 50%; bottom: 6%; transform: translateX(-50%);
    width: 320px; height: 4px; border-radius: var(--radius-full); opacity: 0;
    background: radial-gradient(closest-side, rgba(212,168,67,0.5), transparent);
    transition: opacity 1s var(--ease);
  }
  .gravity-well[data-on="1"] { opacity: 1; }

  .entry-frame {
    position: relative; height: 100%; overflow: auto;
    display: grid; place-items: center; padding: max(4vh, var(--space-6)) var(--space-8) 120px;
  }

  /* Cold start (first contact / >14d) — minimal, no overlay claim */
  .cold-card {
    text-align: center; max-width: 460px; display: grid; gap: var(--space-5); justify-items: center;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .cold-card h1 { font-family: var(--font-display); font-size: var(--text-2xl); }
  .cold-card p { color: var(--fg-2); font-size: var(--text-base); }

  /* Re-entry card (full / long mist) — four fixed questions, peripheral */
  .reentry {
    position: relative; width: min(560px, 92vw);
    background: linear-gradient(180deg, rgba(17,26,46,0.92), rgba(12,18,32,0.92));
    border: 1px solid var(--border-strong); border-radius: var(--radius-xl);
    box-shadow: var(--shadow-lg); backdrop-filter: blur(6px);
    padding: var(--space-6) var(--space-6) var(--space-5);
  }
  .reentry .gold-spine { position: absolute; left: 0; top: 14px; bottom: 14px; width: 2px; border-radius: var(--radius-full); background: linear-gradient(180deg, var(--accent), transparent); }
  .reentry-head { display: flex; align-items: baseline; justify-content: space-between; gap: var(--space-3); margin-bottom: var(--space-4); }
  .reentry-head .traj { font-family: var(--font-display); font-size: var(--text-xl); color: var(--fg-1); }
  .reentry-head .traj-state {
    font-family: var(--font-mono); font-size: var(--text-xs); letter-spacing: var(--tracking-wide);
    color: var(--accent); border: 1px solid var(--accent-dim); border-radius: var(--radius-full);
    padding: 2px 8px; text-transform: uppercase;
  }
  .q { display: grid; grid-template-columns: 18px 1fr; gap: var(--space-3); padding: var(--space-2) 0; border-top: 1px solid var(--border); }
  .q:first-of-type { border-top: none; }
  .q .q-ix { font-family: var(--font-mono); font-size: var(--text-xs); color: var(--fg-3); padding-top: 3px; }
  .q .q-label { font-size: var(--text-xs); color: var(--fg-3); font-family: var(--font-mono); letter-spacing: var(--tracking-wide); text-transform: uppercase; margin-bottom: 3px; }
  .q .q-body { font-size: var(--text-base); color: var(--fg-1); }
  .q .q-body .frag { font-family: var(--font-mono); color: var(--fg-2); font-size: var(--text-sm); }
  .q .q-body .count { color: var(--amber); }
  .q .q-body .delta { color: var(--agent); }
  .reentry-actions { display: flex; gap: var(--space-3); margin-top: var(--space-5); }

  /* delta strip (3d–14d long mist) */
  .delta-strip { margin-top: var(--space-4); border-top: 1px dashed var(--border-strong); padding-top: var(--space-3); display: grid; gap: var(--space-2); }
  .delta-strip .di { display: flex; gap: var(--space-2); align-items: center; font-size: var(--text-sm); color: var(--fg-2); }
  .delta-strip .di .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--agent); flex: none; }

  /* whisper column (>14d residual) */
  .whisper-col { position: absolute; top: 12vh; right: clamp(16px, 4vw, 64px); width: 220px; display: grid; gap: var(--space-4); }
  .whisper-col .w { opacity: 1; }
  .whisper-col .w:nth-child(2){ animation-delay: 140ms; } .whisper-col .w:nth-child(3){ animation-delay: 280ms; } .whisper-col .w:nth-child(4){ animation-delay: 420ms; }
  @keyframes whisperIn { to { opacity: 1; transform: none; } }
  .whisper-col .w .wl { font-family: var(--font-mono); font-size: var(--text-xs); color: var(--fg-3); text-transform: uppercase; letter-spacing: var(--tracking-wide); }
  .whisper-col .w .wt { font-size: var(--text-sm); color: var(--fg-2); }

  /* ============================================================
     BUTTONS
     ============================================================ */
  .btn {
    font-size: var(--text-sm); font-weight: var(--weight-medium);
    padding: 9px 16px; border-radius: var(--radius-md);
    border: 1px solid var(--border-strong); background: var(--bg-raised); color: var(--fg-1);
    transition: background var(--duration-base) var(--ease), border-color var(--duration-base) var(--ease);
    display: inline-flex; align-items: center; gap: var(--space-2); white-space: nowrap;
  }
  .btn:hover { background: var(--bg-overlay); }
  .btn:active { box-shadow: var(--shadow-inset); }
  .btn--primary { background: var(--accent); color: var(--fg-inverse); border-color: var(--accent); font-weight: var(--weight-semibold); }
  .btn--primary:hover { background: #e2bb5a; }
  .btn--cyan { border-color: var(--cyan-dim); color: var(--cyan); background: var(--cyan-muted); }
  .btn--cyan:hover { border-color: var(--cyan); box-shadow: var(--cyan-glow); }
  .btn--ghost { background: transparent; border-color: var(--border); color: var(--fg-2); }
  .btn--ghost:hover { color: var(--fg-1); border-color: var(--border-strong); }
  .btn--sm { font-size: var(--text-xs); padding: 6px 10px; }
  .btn--vault { border-color: var(--vault-dim); color: var(--vault); background: var(--vault-muted); }

  /* ============================================================
     UNIFIED SHELL
     ============================================================ */
  #shell { position: absolute; inset: 0; z-index: var(--z-base); display: grid; grid-template-rows: auto 1fr; }

  .topbar {
    display: flex; align-items: center; gap: var(--space-4);
    padding: 10px var(--space-5); border-bottom: 1px solid var(--border);
    background: linear-gradient(180deg, var(--bg-surface), rgba(12,18,32,0.7));
    backdrop-filter: blur(8px); z-index: var(--z-sticky);
  }
  .topbar .wordmark { font-family: var(--font-display); font-size: var(--text-md); color: var(--fg-1); letter-spacing: var(--tracking-tight); }
  .topbar .wordmark .ru { color: var(--accent); }
  .anchor-pill {
    display: flex; align-items: center; gap: var(--space-2); white-space: nowrap;
    border: 1px solid var(--border); border-radius: var(--radius-md);
    padding: 5px 10px; background: var(--bg-raised); font-size: var(--text-sm); color: var(--fg-1);
  }
  .anchor-pill .ic { color: var(--fg-3); }
  .anchor-pill .path { font-family: var(--font-mono); font-size: var(--text-xs); color: var(--fg-2); }
  .posture-pill {
    display: flex; align-items: center; gap: var(--space-2); cursor: pointer;
    border: 1px solid var(--accent-dim); color: var(--accent); border-radius: var(--radius-full);
    padding: 4px 12px; font-size: var(--text-xs); font-family: var(--font-mono);
    letter-spacing: var(--tracking-wide); text-transform: uppercase; background: var(--accent-muted);
  }
  .posture-pill:hover { border-color: var(--accent); }
  .topbar-spacer { flex: 1; }
  .icon-btn {
    width: 34px; height: 34px; display: grid; place-items: center; border-radius: var(--radius-md);
    border: 1px solid var(--border); background: var(--bg-raised); color: var(--fg-2);
  }
  .icon-btn:hover { color: var(--fg-1); border-color: var(--border-strong); }
  .icon-btn svg { width: 17px; height: 17px; }
  .vault-status { display: flex; align-items: center; gap: var(--space-2); font-size: var(--text-xs); color: var(--fg-2); font-family: var(--font-mono); }
  .vault-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--vault); box-shadow: var(--vault-glow); }
  .vault-status[data-state="degraded"] .vault-dot { background: var(--amber); box-shadow: none; }
  .vault-status[data-state="unreachable"] .vault-dot { background: var(--destructive); box-shadow: none; }

  /* shell body: document anchor (primary) + margin rail */
  .shell-body { position: relative; display: grid; grid-template-columns: 1fr var(--rail-w, 0px); min-height: 0; transition: grid-template-columns var(--duration-slow) var(--ease); }
  .shell-body[data-rail="open"] { --rail-w: 380px; }

  .doc-scroll { overflow: auto; position: relative; }
  .doc-col { max-width: 760px; margin: 0 auto; padding: clamp(28px, 5vw, 64px) clamp(20px, 5vw, 56px) 160px; position: relative; }
  .doc-col h1 { font-family: var(--font-display); font-size: var(--text-3xl); margin-bottom: var(--space-3); letter-spacing: var(--tracking-tight); }
  .doc-meta { display: flex; gap: var(--space-3); flex-wrap: wrap; align-items: center; margin-bottom: var(--space-6); padding-bottom: var(--space-4); border-bottom: 1px solid var(--border); }
  .doc-meta .chip { font-family: var(--font-mono); font-size: var(--text-xs); color: var(--fg-2); border: 1px solid var(--border); border-radius: var(--radius-full); padding: 3px 9px; }
  .doc-meta .chip.vault { color: var(--vault); border-color: var(--vault-dim); }
  .doc-col h2 { font-family: var(--font-display); font-size: var(--text-xl); margin: var(--space-6) 0 var(--space-3); }
  .doc-col p { margin-bottom: var(--space-4); color: var(--fg-1); line-height: var(--leading-loose); }
  .doc-col p.dim { color: var(--fg-2); }
  .doc-col .frontmatter { font-family: var(--font-mono); font-size: var(--text-sm); background: var(--bg-surface); border: 1px solid var(--border); border-left: 2px solid var(--vault-dim); border-radius: var(--radius-md); padding: var(--space-4); margin-bottom: var(--space-6); color: var(--fg-2); white-space: pre; overflow-x: auto; }
  .doc-col .frontmatter .k { color: var(--vault); }

  /* residual ambient layer after re-entry mist dissolves */
  .caret-echo { display: inline-block; width: 2px; height: 1.1em; background: var(--accent); vertical-align: text-bottom; margin-left: 1px; animation: breathe 1.6s var(--ease) infinite; }
  .marginalia { position: absolute; left: -10px; width: 5px; height: 5px; border-radius: 50%; background: var(--accent); opacity: 0.45; }
  .resume-anchor { text-decoration: underline; text-decoration-color: var(--accent-dim); text-underline-offset: 3px; }

  /* staged suggestion block (Canvas suggestion flow — body-edit lane) */
  .suggestion-block {
    position: relative; border: 1px solid var(--amber-dim); border-left: 2px solid var(--amber);
    background: var(--amber-muted); border-radius: var(--radius-md);
    padding: var(--space-4); margin: var(--space-5) 0;
  }
  .suggestion-block .sg-label { font-family: var(--font-mono); font-size: var(--text-xs); text-transform: uppercase; letter-spacing: var(--tracking-wide); color: var(--amber); margin-bottom: var(--space-2); display: flex; align-items: center; gap: var(--space-2); }
  .suggestion-block p { color: var(--fg-1); margin-bottom: var(--space-3); }
  .suggestion-block .sg-diff { font-family: var(--font-mono); font-size: var(--text-xs); color: var(--fg-3); margin-bottom: var(--space-3); }
  .suggestion-block.applied { border-color: var(--vault-dim); border-left-color: var(--vault); background: var(--vault-muted); }
  .suggestion-block.applied .sg-label { color: var(--vault); }

  /* margin rail (Chat / Hugin — canvas surface, subordinate) */
  .rail { border-left: 1px solid var(--border); background: var(--bg-surface); display: flex; flex-direction: column; min-width: 0; overflow: hidden; }
  .shell-body:not([data-rail="open"]) .rail { border-left: none; }
  .rail-head { display: flex; align-items: center; gap: var(--space-2); padding: var(--space-3) var(--space-4); border-bottom: 1px solid var(--border); }
  .agent-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--agent); box-shadow: var(--agent-glow); }
  .rail-head .agent-name { font-family: var(--font-mono); font-size: var(--text-xs); letter-spacing: var(--tracking-wide); color: var(--agent); }
  .rail-head .turns { margin-left: auto; font-family: var(--font-mono); font-size: var(--text-xs); color: var(--fg-3); }
  .rail-thread { flex: 1; overflow: auto; padding: var(--space-4); display: flex; flex-direction: column; gap: var(--space-4); }
  .msg { font-size: var(--text-sm); line-height: var(--leading-normal); }
  .msg .who { font-family: var(--font-mono); font-size: var(--text-xs); text-transform: uppercase; letter-spacing: var(--tracking-wide); color: var(--fg-3); margin-bottom: 3px; }
  .msg.agent .who { color: var(--agent); }
  .msg.agent .bubble { color: var(--fg-1); }
  .msg .src { font-family: var(--font-mono); font-size: var(--text-xs); color: var(--cyan); margin-top: var(--space-2); cursor: pointer; }
  .msg .src:hover { text-decoration: underline; }
  .msg.human { padding-left: var(--space-4); border-left: 2px solid var(--border-strong); }
  .rail-composer { border-top: 1px solid var(--border); padding: var(--space-3); display: flex; gap: var(--space-2); }
  .rail-composer input { flex: 1; background: var(--bg-raised); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 8px 10px; color: var(--fg-1); font-family: var(--font-ui); font-size: var(--text-sm); }
  .rail-composer input:focus { outline: none; border-color: var(--cyan); box-shadow: var(--cyan-glow); }

  /* collapsed rail handle (when closed) */
  .rail-tab { position: absolute; top: 50%; right: 0; transform: translateY(-50%); writing-mode: vertical-rl; padding: var(--space-4) 8px; border: 1px solid var(--border); border-right: none; border-radius: var(--radius-md) 0 0 var(--radius-md); background: var(--bg-surface); color: var(--agent); font-family: var(--font-mono); font-size: var(--text-xs); letter-spacing: var(--tracking-wide); display: flex; align-items: center; gap: var(--space-2); }
  .rail-tab:hover { background: var(--bg-raised); }
  .rail-tab .badge { writing-mode: horizontal-tb; background: var(--agent); color: var(--fg-inverse); border-radius: var(--radius-full); font-size: 10px; padding: 1px 5px; }

  /* ============================================================
     OVERLAY LAYER (subordinate surfaces — all augment, never replace)
     ============================================================ */
  .scrim { position: absolute; inset: 0; z-index: var(--z-overlay); background: rgba(7,11,18,0.6); backdrop-filter: blur(3px); }
  .scrim[hidden] { display: none; }

  .ov { position: absolute; z-index: calc(var(--z-overlay) + 1); background: var(--bg-surface); border: 1px solid var(--border-strong); box-shadow: var(--shadow-lg); display: flex; flex-direction: column; }
  .ov-head { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-4) var(--space-5); border-bottom: 1px solid var(--border); }
  .ov-head .ov-title { font-family: var(--font-display); font-size: var(--text-lg); color: var(--fg-1); }
  .ov-head .ov-kicker { font-family: var(--font-mono); font-size: var(--text-xs); text-transform: uppercase; letter-spacing: var(--tracking-wide); color: var(--fg-3); }
  .ov-head .ov-mode { margin-left: auto; font-family: var(--font-mono); font-size: var(--text-xs); color: var(--cyan); border: 1px solid var(--cyan-dim); border-radius: var(--radius-full); padding: 2px 9px; text-transform: uppercase; letter-spacing: var(--tracking-wide); }
  .ov-body { padding: var(--space-5); overflow: auto; }
  .ov-foot { margin-top: auto; padding: var(--space-3) var(--space-5); border-top: 1px solid var(--border); display: flex; align-items: center; gap: var(--space-3); font-size: var(--text-xs); color: var(--fg-3); font-family: var(--font-mono); }

  /* command palette (Panel command surface) — centered modal */
  .ov-cmd { top: 64px; left: 50%; transform: translateX(-50%); width: min(620px, 92vw); max-height: 70vh; border-radius: var(--radius-lg); }
  /* vault browser — left drawer */
  .ov-vault { top: 0; bottom: 0; left: 0; width: min(420px, 86vw); border-top: none; border-bottom: none; border-left: none; }
  /* system map — large centered */
  .ov-map { top: 50%; left: 50%; transform: translate(-50%,-50%); width: min(960px, 94vw); max-height: 88vh; border-radius: var(--radius-lg); }
  /* memory review — right drawer */
  .ov-memory { top: 0; bottom: 0; right: 0; width: min(440px, 88vw); border-top: none; border-bottom: none; border-right: none; }
  /* source peek — small anchored popover */
  .ov-peek { width: min(380px, 86vw); border-radius: var(--radius-lg); }
  /* posture switch — centered small */
  .ov-posture { top: 50%; left: 50%; transform: translate(-50%,-50%); width: min(560px, 92vw); border-radius: var(--radius-lg); }
  /* settings — right drawer */
  .ov-settings { top:0; bottom:0; right:0; width: min(480px,92vw); border-top:none; border-bottom:none; border-right:none; }
  /* context lane — right drawer */
  .ov-context { top:0; bottom:0; right:0; width: min(440px,90vw); border-top:none; border-bottom:none; border-right:none; }
  /* capture — top modal */
  .ov-capture { top:64px; left:50%; transform:translateX(-50%); width:min(560px,92vw); border-radius:var(--radius-lg); }
  /* receipts — top modal */
  .ov-receipts { top:64px; left:50%; transform:translateX(-50%); width:min(620px,92vw); max-height:72vh; border-radius:var(--radius-lg); }
  /* tts read-back plan — small popover */
  .ov-tts { top:96px; left:50%; transform:translateX(-50%); width:min(440px,90vw); border-radius:var(--radius-lg); }

  .set-sec { margin-bottom: var(--space-6); }
  .set-sec h4 { font-family: var(--font-mono); font-size: var(--text-xs); text-transform: uppercase; letter-spacing: var(--tracking-wide); color: var(--fg-3); margin-bottom: var(--space-3); }
  .set-row { display:flex; align-items:center; justify-content:space-between; gap: var(--space-3); padding: var(--space-2) 0; }
  .set-row .sr-label { font-size: var(--text-sm); color: var(--fg-1); }
  .set-row .sr-sub { font-size: var(--text-xs); color: var(--fg-3); }
  .pseg { display:flex; gap:2px; background: var(--bg-base); border:1px solid var(--border); border-radius: var(--radius-full); padding:2px; flex:none; }
  .pseg button { font-family: var(--font-mono); font-size: 11px; padding: 4px 10px; border-radius: var(--radius-full); border:none; background:transparent; color: var(--fg-2); }
  .pseg button[aria-pressed="true"] { background: var(--accent-muted); color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent-dim); }
  .local-badge { font-family: var(--font-mono); font-size: var(--text-xs); color: var(--amber); border:1px solid var(--amber-dim); background: var(--amber-muted); border-radius: var(--radius-full); padding:2px 8px; }

  {ic:'gear', name:'Settings', mode:'Local UI', desc:'Display + listening preferences (byte-unchanged), guidance default, quiet hours, connection.', rel:'opens as right drawer → returns to anchor', intent:'settings.open'}
];
function openMap(){
  const nodes = MAP_NODES.map(n=>`
    <div class="map-node" data-intent="${n.intent}">
      <div class="mn-top"><span class="mn-ic">${ic(n.ic)}</span><span class="mn-name">${n.name}</span><span class="mn-mode">${n.mode}</span></div>
      <div class="mn-desc">${n.desc}</div>
      <div class="mn-rel">${ic('dot')} ${n.rel}</div>
    </div>`).join('');
  const body = `
    <div class="callout guidance">This is the front door. Everything is entered from the <strong>document anchor + orientation</strong> at the centre, opens as an overlay, and returns. No surface is a separate app; none re-classifies runtime; Chat, Panel, and Automation stay distinct.</div>
    <div class="map-center">
      <div class="mc-name">Entry point · the document anchor</div>
      <div class="mc-sub">cold start → orientation (latency ladder) → unified shell → any surface → back</div>
    </div>
    <div class="map-grid">${nodes}</div>`;
  openOverlay('map', {html: ovShell('ov-map', 'System map', 'Total system entry point', null, body,
    `${ic('compass')} server declares class & authority · the UI renders · low attentional load is a constraint`)});
}

/* ---- Settings (Local UI) --------------------------------------------------
   Display + listening preferences are local, non-authoritative, byte-unchanged
   (DISPLAY_PREFERENCE_LOCAL_STATE_CONTRACT.md). They re-render identical content. */
function prefsDiverged(){ const p=STATE.prefs; return p.theme!=='dark' || p.textSize!=='base' || p.spacing!=='normal'; }
function applyPrefs(){ $('#stage').dataset.textsize = STATE.prefs.textSize==='base' ? '' : STATE.prefs.textSize; }
function setPref(key, val){ STATE.prefs[key]=val; applyPrefs(); log('display/listening preference (local; byte-unchanged)', {key, val}); openSettings(); if(STATE.entryState==='shell_active') renderShell(); }
function pseg(key, opts){ return `<div class="pseg">${opts.map(o=>`<button data-intent="settings.set" data-key="${key}" data-val="${o}" aria-pressed="${STATE.prefs[key]===o}">${o}</button>`).join('')}</div>`; }
function openSettings(){
  const p = STATE.prefs;
  const body = `
    <div class="callout guidance">Settings are <strong>Local UI</strong> state. Display and listening preferences re-render identical content — the canonical Markdown hash is unchanged, and nothing here writes to the vault. A <span class="mono">local-only</span> badge appears on any diverging render.</div>
    <div class="set-sec"><h4>Display</h4>
      <div class="set-row"><span class="sr-label">Theme</span>${pseg('theme',['dark','dim','high-contrast'])}</div>
      <div class="set-row"><span class="sr-label">Text size</span>${pseg('textSize',['sm','base','lg'])}</div>
      <div class="set-row"><span class="sr-label">Spacing</span>${pseg('spacing',['tight','normal','relaxed'])}</div>
    </div>
    <div class="set-sec"><h4>Listening · local TTS</h4>
      <div class="set-row"><span class="sr-label">Modality</span>${pseg('listening',['read','listen','bimodal'])}</div>
      <div class="set-row"><span class="sr-label">Speed</span>${pseg('speed',['0.9×','1.0×','1.25×'])}</div>
      <div class="set-row"><span class="sr-sub">Read-back runs only after your action · no autoplay · Piper / Kokoro, local-only</span></div>
    </div>
    <div class="set-sec"><h4>Companion behaviour</h4>
      <div class="set-row"><span class="sr-label">Guidance layer default</span>${pseg('_guidance',[])}<button class="btn btn--ghost btn--sm" data-intent="guidance.toggle">${STATE.guidance?'on':'off'}</button></div>
      <div class="set-row"><span class="sr-label">Quiet hours / interruption</span>${pseg('quietHours',['off','meetings','always'])}</div>
      <div class="set-row"><span class="sr-sub">The context lane never pushes; quiet hours only further dampen ambient salience.</span></div>
    </div>
    <div class="set-sec"><h4>Connection · local-first</h4>
      <div class="set-row"><span class="sr-label">Runtime</span><span class="provenance"><span class="pv-dot" style="background:var(--vault)"></span> localhost · trusted device</span></div>
      <div class="set-row"><span class="sr-sub">Vault binding is owned by the runtime; the UI never selects or names a vault.</span></div>
    </div>
    <button class="btn btn--ghost btn--sm" data-intent="settings.reset">Reset display to canonical</button>`;
  openOverlay('settings', {html: ovShell('ov-settings', 'Settings', 'Local UI', 'byte-unchanged', body,
    `${ic('gear')} preferences never reach a save endpoint · reset-to-canonical always available`)});
}

/* ---- Read-back (local TTS, small footprint) -------------------------------
   LOCAL_FIRST_TTS_CONTRACT.md: plan inspected before synthesis, after a human
   action, no autoplay, never routed through a mutation endpoint. */
function openTTS(){
  log('POST /api/companion/tts/plan (simulated)');
  const body = `
    <div class="callout guidance">Read-back is <strong>local-only</strong> and runs only because you asked. The plan is shown before any audio; code blocks are skipped; nothing routes through a save, Panel, or workspace endpoint.</div>
    <div class="tts-meta"><span class="tm">locale en-US</span><span class="tm">provider Kokoro</span><span class="tm">voice af_heart</span><span class="tm">cache miss</span><span class="tm">2 segments</span></div>
    <div class="tts-plan">${DOC.title}. The active document is the cognitive anchor… Two authority lanes carry agent contributions. The body-edit lane applies directly… <span style="color:var(--fg-3)">[fenced code skipped]</span></div>
    <div style="display:flex;gap:8px"><button class="btn btn--sm btn--cyan" data-intent="tts.play">${ic('play')} Play</button><button class="btn btn--sm btn--ghost" data-intent="overlay.dismiss">Not now</button></div>`;
  openOverlay('tts', {html: ovShell('ov-tts', 'Read aloud', 'Listening · Local UI', 'read-only', body,
    `${ic('volume')} SpeechPlan inspected before synthesis · no autoplay`)});
}

/* ---- Context lane: time + place (Reorient) --------------------------------
   Time/place are ambient SALIENCE signals feeding resurfacing why-now — not a
   calendar app, task list, or notification feed. No owner-doc grounds a calendar
   or location source yet, so this is a PROPOSAL / placeholder. */
function openContext(){
  const placeBand = STATE.prefs.location==='on' ? `
    <div class="band place"><div class="b-when">${ic('pin')} place · near</div>
      <div class="b-title">Järnia hardware shop</div>
      <div class="why-now">why now · you are near a place tagged in <span class="mono">Lists/workshop-shopping.md</span></div>
      <div class="provenance"><span class="pv-dot"></span> source: manual place tag · authority_role: derived · read-only</div>
    </div>` : `
    <div class="band place"><div class="b-when">${ic('pin')} place</div>
      <div class="b-title" style="color:var(--fg-2)">Location focus is off</div>
      <div class="why-now" style="color:var(--fg-3)">opt-in, local-first, manual place tags — placeholder</div>
      <button class="btn btn--sm btn--vault" data-intent="location.enable" style="margin-top:8px">Enable location focus</button>
    </div>`;
  const body = `
    <div class="callout guidance">Time and place raise <strong>salience</strong> on material you already own — they do not create tasks, urgency, or notifications. Previous / current / next are quiet bands, surfaced when you pull this lane. <span class="mono">Placeholder:</span> no calendar or location source is grounded in an owner-doc yet.</div>
    <div class="band prev"><div class="b-when">${ic('clock')} previous · ended 40m ago</div>
      <div class="b-title">Q1 retro</div>
      <div class="why-now">why now · left an open loop: “follow up on staging budget”</div>
      <div class="provenance"><span class="pv-dot"></span> source: agenda note + open_loops · read-only</div>
    </div>
    <div class="band now"><div class="b-when">${ic('dot')} now · focus</div>
      <div class="b-title">${DOC.title}</div>
      <div class="why-now" style="color:var(--fg-3)">your current anchor · nothing to surface</div>
    </div>
    <div class="band next"><div class="b-when">${ic('clock')} next · in 20m</div>
      <div class="b-title">Q2 arch review</div>
      <div class="why-now">why now · this note is the decision record for it; 2 open loops relate</div>
      <div class="provenance"><span class="pv-dot"></span> source: agenda note · authority_role: derived · read-only</div>
    </div>
    ${placeBand}`;
  openOverlay('context', {html: ovShell('ov-context', 'Context', 'Reorient · time &amp; place', 'salience · read-only', body,
    `${ic('compass')} salience, not urgency · resurfacing, not notification · never pushes`)});
}

/* ---- Capture (friction-free → vault inbox) --------------------------------
   The home for “things to take care of” that aren't tied to a meeting. These are
   captured to the vault and surfaced contextually — NOT an app-owned task list. */
function openCapture(){
  const list = STATE.captures.length ? `<div class="eyebrow" style="margin:14px 0 8px">This session</div>` + STATE.captures.map(c=>`
    <div class="row" style="cursor:default"><span class="r-ic">${ic('circledot')}</span><span><span class="r-title">${c}</span><br><span class="r-sub">→ Inbox/2026-06-10.md · unfiled</span></span><span class="authority-tag read">captured</span></div>`).join('') : '';
  const body = `
    <div class="callout guidance">Capture is friction-free intake to the vault inbox — a commitment to future-self, not a managed task. It carries no due date and never nags. It resurfaces later by relevance (context lane, re-entry), the way any vault material does.</div>
    <textarea class="capture-area" data-region="capture-input" placeholder="A thought, a commitment, something to take care of…"></textarea>
    <div style="display:flex;gap:8px;margin-top:10px"><button class="btn btn--sm btn--vault" data-intent="capture.save">${ic('check')} Capture to inbox</button><button class="btn btn--sm btn--ghost" data-intent="overlay.dismiss">Close</button></div>
    ${list}`;
  openOverlay('capture', {html: ovShell('ov-capture', 'Capture', 'to vault inbox', 'governed write', body,
    `${ic('archive')} appended to the vault inbox via the governed path · not a task tracker`)});
  setTimeout(()=>{ const ta=$('#overlay-host .capture-area'); if(ta) ta.focus(); }, 60);
}
function saveCapture(){
  const ta = $('#overlay-host .capture-area'); const v = ta && ta.value.trim();
  if(!v){ toast('Nothing to capture', null); return; }
  STATE.captures.unshift(v);
  log('capture → vault inbox (simulated governed append)', {text:v});
  openCapture();
  toast('Captured to vault inbox', 'vault', 'Inbox/2026-06-10.md');
}

/* ---- Receipts / governed-action history (read-only) ----------------------- */
function openReceipts(){
  const body = `
    <div class="callout guidance">A read-only record of governed outcomes. Receipts are produced by the runtime; the UI never invents one. This is history, not a control surface.</div>
    <div class="row" style="cursor:default"><span class="r-ic" style="color:var(--vault)">${ic('receipt')}</span><span><span class="r-title">lifecycle.move · drafting → active</span><br><span class="r-sub">Projects/Q2-arch.md · 2026-06-10T09:12Z</span></span><span class="receipt-pill">${ic('dot')} success</span></div>
    <div class="row" style="cursor:default"><span class="r-ic" style="color:var(--vault)">${ic('receipt')}</span><span><span class="r-title">queue_review · Inbox note</span><br><span class="r-sub">Inbox/2026-06-08-meeting.md · 2026-06-09T18:40Z</span></span><span class="receipt-pill">${ic('dot')} logged</span></div>
    <div class="row" style="cursor:default"><span class="r-ic" style="color:var(--destructive)">${ic('alert')}</span><span><span class="r-title">cross-note rewrite · arch-review.md</span><br><span class="r-sub">2026-06-09T18:31Z · WriteGuard: outside allowlist</span></span><span class="receipt-pill blocked">${ic('dot')} blocked</span></div>`;
  openOverlay('receipts', {html: ovShell('ov-receipts', 'Receipts', 'Act · Reorient', 'read-only', body,
    `${ic('receipt')} runtime-produced · the UI must not invent a receipt`)});
}

/* ============================================================================
   EVENT DELEGATION
   ============================================================================ */
function ensureShell(){
  if(STATE.entryState !== 'shell_active'){ enterShell(); return true; }
  return false;
}
document.addEventListener('click', (e)=>{
  const t = e.target.closest('[data-intent]');
  if(!t) return;
  const intent = t.dataset.intent;
  const target = t.dataset.target;
  log('intent', intent, target||'');
  switch(intent){
    case 'entry.retry': boot(); break;
    case 'entry.resume': enterShell(); break;
    case 'entry.dismiss': enterShell(); break;
    case 'rail.open': STATE.railOpen = true; if(!ensureShell()) { renderShell(); } break;
    case 'rail.close': STATE.railOpen = false; renderShell(); break;
    case 'rail.send': toast('Message sent to Hugin (simulated)', 'agent', 'canvas surface'); break;
    case 'vault.open': openVault(); break;
    case 'vault.pick': pickNote(t.dataset.path); break;
    case 'vault.queue': log('POST /api/companion/vault-browser/actions/queue-review (simulated)'); closeOverlay(); toast('Queued for review (governed handoff)', 'amber', 'queue_review'); break;
    case 'cmd.open': ensureShell(); openCmd(); break;
    case 'panel.confirm': panelConfirm(t.dataset.prop); break;
    case 'panel.blocked': panelBlocked(); break;
    case 'memory.open': ensureShell(); openMemory(); break;
    case 'memory.accept': log('memory.accept → governed'); closeOverlay(); toast('Memory accepted via governed decision', 'vault', 'receipt'); break;
    case 'memory.defer': closeOverlay(); toast('Candidate deferred', null, 'review queue'); break;
    case 'memory.reject': closeOverlay(); toast('Candidate rejected — no durable apply', 'amber', 'review queue'); break;
    case 'source.peek': openPeek(); break;
    case 'posture.open': openPosture(); break;
    case 'posture.set': setPosture(t.dataset.posture); break;
    case 'map.open': ensureShell(); openMap(); break;
    case 'map.toSuggestion': closeOverlay(); toast('Staged suggestion lives in the document — apply or discard there', 'amber'); break;
    case 'map.toResurface': closeOverlay(); openMemory(); break;
    case 'suggestion.apply': applySuggestion(); break;
    case 'suggestion.discard': discardSuggestion(); break;
    case 'overlay.dismiss': closeOverlay(); break;
    case 'guidance.toggle': STATE.guidance = !STATE.guidance; $('#stage').dataset.guidance = STATE.guidance ? 'on' : ''; log('guidance layer', STATE.guidance ? 'on' : 'off (established-user default)'); break;
    case 'settings.open': ensureShell(); openSettings(); break;
    case 'settings.set': setPref(t.dataset.key, t.dataset.val); break;
    case 'settings.reset': STATE.prefs = {...DEFAULT_PREFS}; applyPrefs(); openSettings(); renderShell(); toast('Display preferences reset to canonical', null, 'byte-unchanged'); break;
    case 'tts.read': ensureShell(); openTTS(); break;
    case 'tts.play': log('POST /api/companion/tts/synthesize (simulated)', {voice:'af_heart', locale:'en-US'}); closeOverlay(); toast('Reading aloud… local TTS (simulated)', null, 'tts · after your action'); break;
    case 'context.open': ensureShell(); openContext(); break;
    case 'location.enable': STATE.prefs.location='on'; openContext(); toast('Location focus on · opt-in, local-first', 'vault', 'place'); break;
    case 'capture.open': ensureShell(); openCapture(); break;
    case 'capture.save': saveCapture(); break;
    case 'receipts.open': ensureShell(); openReceipts(); break;
  }
});
document.addEventListener('keydown', (e)=>{
  if(e.key === 'Escape' && STATE.openOverlay){ closeOverlay(); }
  if((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==='k'){ e.preventDefault(); ensureShell(); openCmd(); }
  if((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==='n'){ e.preventDefault(); ensureShell(); openCapture(); }
});

function applySuggestion(){
  STATE.suggestionApplied = true;
  log('canvas_writer.apply_edit', {suggestion:'sg-001', lane:'body-edit', receipt:null});
  renderShell();
  toast('Applied via canvas_writer · body-edit lane · no receipt', 'vault', 'canvas_writer');
}
function discardSuggestion(){
  log('suggestion.discard', {suggestion:'sg-001'});
  const block = $('[data-region="suggestion-block"]');
  if(block){ block.style.transition='opacity .25s'; block.style.opacity='0.25'; }
  toast('Suggestion discarded · document unchanged', null);
}
function pickNote(path){
  log('open note as anchor (simulated)', {path});
  DOC.title = path.split('/').pop().replace('.md','').replace(/-/g,' ').replace(/\b\w/g,c=>c.toUpperCase());
  DOC.path = path;
  closeOverlay();
  renderShell();
  toast('Document anchor re-formed · overlays returned', null, 'GET /api/companion/workspace?note_path');
}

/* ============================================================================
   PROTOTYPE CONTROL DECK (scaffolding — not production)
   ============================================================================ */
function renderDeck(){
  const scen = Object.entries(SCENARIOS).map(([k,v])=>`<button data-deck="scenario" data-val="${k}" aria-pressed="${STATE.scenario===k}">${v.label}</button>`).join('');
  $('#deck').innerHTML = `
    <span class="deck-label">prototype · scenario</span>
    <div class="seg">${scen}</div>
    <div class="div"></div>
    <div class="seg">
      <button data-deck="degraded" aria-pressed="${STATE.degraded}">degraded</button>
      <button data-deck="narrow" aria-pressed="${STATE.narrow}">narrow</button>
    </div>
    <div class="div"></div>
    <button class="btn btn--ghost btn--sm" data-deck="map">${ic('map')} map</button>
    <button class="btn btn--cyan btn--sm" data-deck="restart">${ic('refresh')} replay entry</button>`;
}
$('#deck').addEventListener('click', (e)=>{
  const b = e.target.closest('[data-deck]'); if(!b) return;
  const kind = b.dataset.deck;
  if(kind==='scenario'){ STATE.scenario = b.dataset.val; STATE.suggestionApplied=false; STATE.railOpen=false; closeOverlay(); renderDeck(); boot(); }
  else if(kind==='degraded'){ STATE.degraded = !STATE.degraded; renderDeck(); if(STATE.entryState==='orienting') resolveEntry(); else if(STATE.entryState==='shell_active') renderShell(); }
  else if(kind==='narrow'){ STATE.narrow = !STATE.narrow; $('#stage').classList.toggle('force-narrow', STATE.narrow); renderDeck(); }
  else if(kind==='map'){ ensureShell(); openMap(); }
  else if(kind==='restart'){ STATE.suggestionApplied=false; STATE.railOpen=false; closeOverlay(); boot(); }
});

/* ---- init ------------------------------------------------------------------ */
renderDeck();
boot();
</script>
