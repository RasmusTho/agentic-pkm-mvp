services:
  watcher:
    build: .
    image: workspace-app
    working_dir: /app
    command: ["python", "-m", "app.cli", "vault-watcher-daemon", "--vault-root", "/app/vault", "--poll-seconds", "5", "--cooldown-seconds", "10", "--max-notes", "20"]
    volumes:
      - ./:/app
      - "${VAULT_ROOT:-./vault}:/app/vault"
      - watcher_state:/state
    environment:
      STORE_BACKEND: memory
      LLM_PROVIDER: mock
      WATCHER_HEARTBEAT_PATH: /app/tmp/watcher_heartbeat.json
      INDEX_OUTBOX_PATH: /app/tmp/index-outbox.jsonl
    restart: unless-stopped

volumes:
  watcher_state:
    driver: local
