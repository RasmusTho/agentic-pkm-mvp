services:
  watcher:
    build: .
    image: workspace-app
    working_dir: /app
    command: ["python", "-m", "app.cli", "watcher", "run"]
    volumes:
      - ./:/app
      # Legacy no-vault ./vault fallback removed (#2386, Slice 05D of #2311):
      # this standalone watcher always watches a vault (WATCHER_ENABLE=1), so the
      # mount source requires an explicitly bound VAULT_ROOT and errors rather
      # than synthesizing a repo-local ./vault.
      - "${VAULT_ROOT:?VAULT_ROOT must be set to bind /app/vault for the standalone watcher}:/app/vault"
      - watcher_state:/state
    environment:
      STORE_BACKEND: memory
      LLM_PROVIDER: ${LLM_PROVIDER}
      LLM_PROVIDER_ENFORCE: "1"
      WATCHER_ENABLE: "1"
      WATCHER_AUTO_EXEC: "${WATCHER_AUTO_EXEC-1}"
      WATCHER_VAULT_PATH: /app/vault
      WATCHER_STATE_DIR: /state
      WATCHER_HEARTBEAT_PATH: /app/tmp/watcher_heartbeat.json
      WATCHER_STOP_FILE: /app/tmp/WATCHER_STOP
      INDEX_OUTBOX_PATH: /app/tmp/index-outbox.jsonl
    restart: unless-stopped

volumes:
  watcher_state:
    driver: local
